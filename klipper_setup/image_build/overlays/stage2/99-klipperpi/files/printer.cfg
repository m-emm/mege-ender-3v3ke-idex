# Minimal "boot stub" printer.cfg
#
# Goal: allow Klipper to start so Moonraker/Mainsail can connect.
# This config intentionally does NOT define motion/heaters/extruders.
# Replace this file with your real printer configuration before printing.

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6633861A3673038-if00

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]
