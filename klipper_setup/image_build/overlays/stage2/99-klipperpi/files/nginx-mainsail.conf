server {
    listen 80 default_server;
    server_name _;

    root /var/www/mainsail;
    index index.html index.htm;

    client_max_body_size 100M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /webcam/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 7d;
    }

    location /nozzle_cam/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 7d;
    }

    location = /home/pi/printer_data/vision {
        return 302 /vision/;
    }

    location = /home/pi/printer_data/vision/ {
        return 302 /vision/;
    }

    location = /home/pi/printer_data/vision/index.html {
        return 302 /vision/;
    }

    location ~ ^/home/pi/printer_data/vision/(.*)$ {
        return 302 /vision/$1;
    }

    location /vision/ {
        alias /home/pi/printer_data/vision/;
        index index.html;
        autoindex on;
        add_header Cache-Control "no-store";
    }

    location = /calibration {
        return 302 /calibration/;
    }

    location /calibration/ {
        alias /home/pi/printer_data/vision/multi_head_zero_calibration/;
        index index.html;
        autoindex off;
        add_header Cache-Control "no-store";
    }

    location /websocket {
        proxy_pass http://127.0.0.1:7125;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_connect_timeout 7d;
        proxy_send_timeout 7d;
        proxy_read_timeout 7d;
    }

    location ~ ^/(printer|api|access|machine|server)/ {
        proxy_pass http://127.0.0.1:7125$request_uri;
        proxy_set_header Host $host;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 7d;
    }
}
