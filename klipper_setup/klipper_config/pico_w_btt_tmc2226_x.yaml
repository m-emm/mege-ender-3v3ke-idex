basename: pico_w_btt_tmc2226_x

metadata:
  version_label: "Pico W + BTT TMC2226 (X axis MCU)"
  notes: |
    X-left: STEP=GPIO11, DIR=GPIO10, EN=GPIO12, UART=GPIO9, endstop=GPIO4.
    X-right: STEP=GPIO7, DIR=GPIO6, EN=GPIO8, UART=GPIO5, endstop=GPIO22.
    SFS left: SWITCH=GPIO0, MOTION=GPIO1. SFS right: SWITCH=GPIO2, MOTION=GPIO3.
    CR Touch: CONTROL=GPIO13, Z_SIGNAL=GPIO14 open-drain with Pico internal pull-up; 5V power only.

color_map:
  power: "#ff0000" # red: VCC/5V
  lv_power: "#9ca3af" # white wire shown as gray for visibility (3.3V)
  ground: "#000000" # black: GND
  clock: "#0057d8" # blue: clock-like signals
  data: "#ffd400" # yellow: data/control signals
  default: "#808080"

################
# Note on the coordinate system:
# The origin (0,0) is at the bottom-left corner
# coordinates are [ X, Y ]
# X increasing to the right
# Y increasing upwards
# ##############
pin_sets:
  - prefix: PICO_
    origin: [0, 30]
    direction: down
    pins:
      - GPIO_0
      - GPIO_1
      - GND_03
      - GPIO_2
      - GPIO_3
      - GPIO_4
      - GPIO_5
      - GND_08
      - GPIO_6
      - GPIO_7
      - GPIO_8
      - GPIO_9
      - GND_13
      - GPIO_10
      - GPIO_11
      - GPIO_12
      - GPIO_13
      - GND_18
      - GPIO_14
      - GPIO_15
  - prefix: PICO_
    origin: [8, 30]
    direction: down
    pins:
      - VBUS_40
      - VSYS_39
      - GND_38
      - THREEV3_EN_37
      - THREEV3_OUT_36
      - ADC_VREF_35
      - GPIO_28_ADC2_34
      - AGND_33
      - GPIO_27_ADC1_32
      - GPIO_26_ADC0_31
      - RUN_30
      - GPIO_22_29
      - GND_28
      - GPIO_21_27
      - GPIO_20_26
      - GPIO_19_25
      - GPIO_18_24
      - GND_23
      - GPIO_17_22
      - GPIO_16_21
  - prefix: TMC1_J1_
    origin: [20, 28]
    direction: down
    pins:
      - EN_1
      - MS1_2
      - MS2_3
      - UART_PDN_4
      - STDBY_5
      - CLK_6
      - STEP_7
      - DIR_8
  - prefix: TMC1_J2_
    origin: [24, 28]
    direction: down
    pins:
      - VM_1
      - GND_VM_2
      - B2_3
      - B1_4
      - A1_5
      - A2_6
      - VIO_7
      - GND_LOGIC_8
  - prefix: TMC2_J1_
    origin: [20, 18]
    direction: down
    pins:
      - EN_1
      - MS1_2
      - MS2_3
      - UART_PDN_4
      - STDBY_5
      - CLK_6
      - STEP_7
      - DIR_8
  - prefix: TMC2_J2_
    origin: [24, 18]
    direction: down
    pins:
      - VM_1
      - GND_VM_2
      - B2_3
      - B1_4
      - A1_5
      - A2_6
      - VIO_7
      - GND_LOGIC_8
  - prefix: TMC1_10K_PULL_UP_
    origin: [21, 20]
    direction: right
    pins:
      - "1"
      - "2"
  - prefix: TMC2_10K_PULL_UP_
    origin: [21, 10]
    direction: right
    pins:
      - "1"
      - "2"
  - prefix: PICO_POWER_CAP_
    origin: [15, 29]
    direction: down
    pins:
      - "1"
      - "2"
  - prefix: PWR_
    origin: [34, 29]
    direction: down
    pins:
      - V24
      - N/C
      - GND
  - prefix: X_LEFT_MOTOR_
    origin: [34, 25]
    direction: down
    pins:
      - A_PLUS
      - A_MINUS
      - B_PLUS
      - B_MINUS
  - prefix: X_LEFT_ENDSTOP_
    origin: [34, 20]
    direction: down
    pins:
      - "NO"
      - GND
      - VCC
  - prefix: X_RIGHT_MOTOR_
    origin: [34, 11]
    direction: down
    pins:
      - A_PLUS
      - A_MINUS
      - B_PLUS
      - B_MINUS
  - prefix: X_RIGHT_ENDSTOP_
    origin: [34, 15]
    direction: down
    pins:
      - "NO"
      - GND
      - VCC
  - prefix: SFS_X_LEFT_
    origin: [34, 6]
    direction: down
    pins:
      - SWITCH
      - MOTION
      - VCC
      - GND
  - prefix: SFS_X_RIGHT_
    origin: [34, 1]
    direction: down
    pins:
      - SWITCH
      - MOTION
      - VCC
      - GND
  - prefix: CR_TOUCH_
    origin: [34, -4]
    direction: down
    pins:
      - GND
      - FIVE_V
      - CONTROL
      - Z_GND
      - Z_SIGNAL

wires:
  - from: PICO_GND_03
    to: PICO_POWER_CAP_1
    type: ground
    color: "#000000"
  - from: PICO_POWER_CAP_2
    to: PICO_THREEV3_OUT_36
    type: lv_power
    color: "#9ca3af"

  - from: PICO_GPIO_11
    to: TMC1_J1_STEP_7
    type: clock
  - from: PICO_GPIO_10
    to: TMC1_J1_DIR_8
    type: data
  - from: PICO_GPIO_12
    to: TMC1_J1_EN_1
    type: data
  - from: PICO_GPIO_9
    to: TMC1_J1_UART_PDN_4
    type: data
    color: "#9ca3af"
  - from: PICO_GND_03
    to: TMC1_J2_GND_LOGIC_8
    type: ground
  - from: PICO_GND_08
    to: TMC1_J2_GND_VM_2
    type: ground
  - from: PICO_THREEV3_OUT_36
    to: TMC1_J2_VIO_7
    type: lv_power
  - from: TMC1_J2_VIO_7
    to: TMC1_10K_PULL_UP_2
    type: lv_power
    color: "#9ca3af"
  - from: TMC1_10K_PULL_UP_1
    to: TMC1_J1_EN_1
    type: data
    color: "#9ca3af"

  - from: PICO_GPIO_7
    to: TMC2_J1_STEP_7
    type: clock
  - from: PICO_GPIO_6
    to: TMC2_J1_DIR_8
    type: data
  - from: PICO_GPIO_8
    to: TMC2_J1_EN_1
    type: data
  - from: PICO_GPIO_5
    to: TMC2_J1_UART_PDN_4
    type: data
    color: "#9ca3af"
  - from: PICO_GND_18
    to: TMC2_J2_GND_LOGIC_8
    type: ground
  - from: PICO_THREEV3_OUT_36
    to: TMC2_J2_VIO_7
    type: lv_power
  - from: TMC2_J2_VIO_7
    to: TMC2_10K_PULL_UP_2
    type: lv_power
    color: "#9ca3af"
  - from: TMC2_10K_PULL_UP_1
    to: TMC2_J1_EN_1
    type: data
    color: "#9ca3af"

  - from: PICO_GPIO_4
    to: X_LEFT_ENDSTOP_NO
    type: data
  - from: PICO_GPIO_22_29
    to: X_RIGHT_ENDSTOP_NO
    type: data
  - from: PWR_GND
    to: X_LEFT_ENDSTOP_GND
    type: ground
  - from: X_LEFT_ENDSTOP_GND
    to: X_RIGHT_ENDSTOP_GND
    type: ground
  - from: X_LEFT_ENDSTOP_VCC
    to: PICO_THREEV3_OUT_36
    type: lv_power
  - from: X_RIGHT_ENDSTOP_VCC
    to: X_LEFT_ENDSTOP_VCC
    type: lv_power

  - from: PICO_GPIO_0
    to: SFS_X_LEFT_SWITCH
    type: data
  - from: PICO_GPIO_1
    to: SFS_X_LEFT_MOTION
    type: data
  - from: PICO_GPIO_2
    to: SFS_X_RIGHT_SWITCH
    type: data
  - from: PICO_GPIO_3
    to: SFS_X_RIGHT_MOTION
    type: data
  - from: PICO_THREEV3_OUT_36
    to: SFS_X_LEFT_VCC
    type: lv_power
  - from: SFS_X_RIGHT_VCC
    to: SFS_X_LEFT_VCC
    type: lv_power
  - from: PICO_GND_28
    to: SFS_X_LEFT_GND
    type: ground
  - from: SFS_X_RIGHT_GND
    to: SFS_X_LEFT_GND
    type: ground

  - from: PICO_GPIO_13
    to: CR_TOUCH_CONTROL
    type: data
  - from: PICO_GPIO_14
    to: CR_TOUCH_Z_SIGNAL
    type: data
    color: "#9ca3af"
  - from: PICO_VBUS_40
    to: CR_TOUCH_FIVE_V
    type: power
  - from: PICO_GND_23
    to: CR_TOUCH_GND
    type: ground
  - from: CR_TOUCH_Z_GND
    to: CR_TOUCH_GND
    type: ground

  - from: X_LEFT_MOTOR_A_PLUS
    to: TMC1_J2_A1_5
    type: default
    color: "#ff0000"
  - from: X_LEFT_MOTOR_A_MINUS
    to: TMC1_J2_A2_6
    type: default
    color: "#000000"
  - from: X_LEFT_MOTOR_B_PLUS
    to: TMC1_J2_B1_4
    type: default
    color: "#ffd400"
  - from: X_LEFT_MOTOR_B_MINUS
    to: TMC1_J2_B2_3
    type: default
    color: "#0057d8"

  - from: X_RIGHT_MOTOR_A_PLUS
    to: TMC2_J2_A1_5
    type: default
    color: "#ff0000"
  - from: X_RIGHT_MOTOR_A_MINUS
    to: TMC2_J2_A2_6
    type: default
    color: "#000000"
  - from: X_RIGHT_MOTOR_B_PLUS
    to: TMC2_J2_B1_4
    type: default
    color: "#ffd400"
  - from: X_RIGHT_MOTOR_B_MINUS
    to: TMC2_J2_B2_3
    type: default
    color: "#0057d8"

  - from: PWR_V24
    to: TMC1_J2_VM_1
    type: power
  - from: PWR_V24
    to: TMC2_J2_VM_1
    type: power
  - from: PWR_GND
    to: TMC1_J2_GND_VM_2
    type: ground
  - from: PWR_GND
    to: TMC2_J2_GND_VM_2
    type: ground
