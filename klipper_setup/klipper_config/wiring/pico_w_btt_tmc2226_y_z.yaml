basename: pico_w_btt_tmc2226_y_z

metadata:
  version_label: "Pico W + TB6600 Y + BTT TMC2226 dual Z"
  klipper_mcu: ""
  notes: |
    Active Y uses the external TB6600-style interface: STEP=GPIO0, DIR=GPIO1, EN=GPIO2, endstop=GPIO4.
    TMC1 is reserved as the Y fallback: STEP=GPIO11, DIR=GPIO10, EN=GPIO12, UART=GPIO9.
    TMC1 fallback DIAG: TMC top DIAG pad to GPIO3 through 1.2k series resistor.
    Driver2 (Z-left): STEP=GPIO7, DIR=GPIO6, EN=GPIO8, UART=GPIO5.
    Driver3 (Z-right): STEP=GPIO14, DIR=GPIO15, EN=GPIO16, UART=GPIO13.
    Live Y motor phases are on the external TB6600 driver; the local TMC1 motor wiring is reserved for rollback.
    Z endstops: Z-left=GPIO22, Z-right=GPIO17.
    Heatbed SSR: SSR_OUT=GPIO20 with Pico logic ground for the single 220V 750W bed.
    Reserved MOSFET driver: HEATBED_ON=GPIO21 remains wired but has no active Klipper assignment.
    Heatbed thermistor: SIGNAL=GPIO26_ADC0, GND=AGND, 4.7k pull-up REF-to-SIGNAL.
    Heatbed thermistor damping: 100uF SIGNAL-to-GND; electrolytic positive to SIGNAL, negative to AGND/GND.
    Vision APA102 helper header: 5V=VBUS for small-strip test use, 3.3V=level-shifter LV reference,
    GND=common ground, CLOCK=GPIO18, DATA=GPIO19. Shifted outputs go to strip CI/DI input side.
    Nine APA102 pixels at full white may approach USB-test power limits; use fused external 5V if unstable.

color_map:
  power: "#ff0000" # red: VCC/5V
  hazard_power: "#8b4513" # brown: 24V motor supply
  lv_power: "#9ca3af" # white wire shown as gray for visibility (3.3V)
  ground: "#000000" # black: GND
  clock: "#0057d8" # blue: clock-like signals
  data: "#ffd400" # yellow: data/control signals
  default: "#808080"

################
# Note on the coordinate system:
# The origin (0,0) is at the bottom-left corner
# coordinates are [ X, Y ]
# X increasing to the right
# Y increasing upwards
# ##############
pin_sets:
  - prefix: PICO_
    origin: [0, 30]
    direction: down
    pins:
      - GPIO_0
      - GPIO_1
      - GND_03
      - GPIO_2
      - GPIO_3
      - GPIO_4
      - GPIO_5
      - GND_08
      - GPIO_6
      - GPIO_7
      - GPIO_8
      - GPIO_9
      - GND_13
      - GPIO_10
      - GPIO_11
      - GPIO_12
      - GPIO_13
      - GND_18
      - GPIO_14
      - GPIO_15
  - prefix: PICO_
    origin: [8, 30]
    direction: down
    pins:
      - VBUS_40
      - VSYS_39
      - GND_38
      - THREEV3_EN_37
      - THREEV3_OUT_36
      - ADC_VREF_35
      - GPIO_28_ADC2_34
      - AGND_33
      - GPIO_27_ADC1_32
      - GPIO_26_ADC0_31
      - RUN_30
      - GPIO_22_29
      - GND_28
      - GPIO_21_27
      - GPIO_20_26
      - GPIO_19_25
      - GPIO_18_24
      - GND_23
      - GPIO_17_22
      - GPIO_16_21
  - prefix: TMC1_J1_
    origin: [20, 28]
    direction: down
    pins:
      - EN_1
      - MS1_2
      - MS2_3
      - UART_PDN_4
      - STDBY_5
      - CLK_6
      - STEP_7
      - DIR_8
  - prefix: TMC1_J2_
    origin: [24, 28]
    direction: down
    pins:
      - VM_1
      - GND_MOTOR_2
      - B2_3
      - B1_4
      - A1_5
      - A2_6
      - VIO_7
      - GND_LOGIC_8
  - prefix: TMC1_TOP_
    origin: [18, 26]
    direction: right
    pins:
      - DIAG
  - prefix: TMC2_J1_
    origin: [20, 18]
    direction: down
    pins:
      - EN_1
      - MS1_2
      - MS2_3
      - UART_PDN_4
      - STDBY_5
      - CLK_6
      - STEP_7
      - DIR_8
  - prefix: TMC2_J2_
    origin: [24, 18]
    direction: down
    pins:
      - VM_1
      - GND_MOTOR_2
      - B2_3
      - B1_4
      - A1_5
      - A2_6
      - VIO_7
      - GND_LOGIC_8
  - prefix: TMC3_J1_
    origin: [20, 8]
    direction: down
    pins:
      - EN_1
      - MS1_2
      - MS2_3
      - UART_PDN_4
      - STDBY_5
      - CLK_6
      - STEP_7
      - DIR_8
  - prefix: TMC3_J2_
    origin: [24, 8]
    direction: down
    pins:
      - VM_1
      - GND_MOTOR_2
      - B2_3
      - B1_4
      - A1_5
      - A2_6
      - VIO_7
      - GND_LOGIC_8
  - prefix: TMC1_10K_PULL_UP_
    origin: [21, 20]
    direction: right
    pins:
      - "1"
      - "2"
  - prefix: R_Y_DIAG_1K2_
    origin: [10, 26]
    direction: right
    pins:
      - PICO
      - TMC
  - prefix: TMC2_10K_PULL_UP_
    origin: [21, 10]
    direction: right
    pins:
      - "1"
      - "2"
  - prefix: TMC3_10K_PULL_UP_
    origin: [21, 0]
    direction: right
    pins:
      - "1"
      - "2"
  - prefix: PICO_POWER_CAP_
    origin: [15, 29]
    direction: down
    pins:
      - "1"
      - "2"
  - prefix: HEATBED_THERM_
    origin: [34, -2]
    direction: down
    pins:
      - GND
      - SIGNAL
      - REF
  - prefix: R_BED_4K7_
    origin: [29, -3.5]
    direction: right
    pins:
      - SIG
      - REF
  - prefix: C_BED_THERM_DAMP_100UF_
    origin: [31, -5]
    direction: right
    pins:
      - POS
      - NEG
  - prefix: VISION_APA102_
    origin: [-4, 24]
    direction: down
    pins:
      - FIVE_V
      - THREEV3
      - GND
      - CLOCK
      - DATA
  - prefix: ENDSTOP_Y_
    origin: [34, 20]
    direction: down
    pins:
      - "NO"
      - GND
      - VCC
  - prefix: MOTOR_Y_
    origin: [34, 25]
    direction: down
    pins:
      - A_PLUS
      - A_MINUS
      - B_PLUS
      - B_MINUS
  - prefix: Y_TB6600_IF_
    origin: [-4, 30]
    direction: down
    pins:
      - GND
      - DIR
      - STEP
      - ENABLE
  - prefix: ENDSTOP_Z_LEFT_
    origin: [34, 16]
    direction: down
    pins:
      - "NO"
      - GND
      - VCC
  - prefix: ENDSTOP_Z_RIGHT_
    origin: [34, 12]
    direction: down
    pins:
      - "NO"
      - GND
      - VCC
  - prefix: MOTOR_Z_LEFT_
    origin: [34, 8]
    direction: down
    pins:
      - A_PLUS
      - A_MINUS
      - B_PLUS
      - B_MINUS
  - prefix: MOTOR_Z_RIGHT_
    origin: [34, 3]
    direction: down
    pins:
      - A_PLUS
      - A_MINUS
      - B_PLUS
      - B_MINUS
  - prefix: PWR_
    origin: [34, 29]
    direction: down
    pins:
      - V24
      - N/C
      - GND

  - prefix: MOSFET_RESERVED_UNUSED_
    origin: [4, 4]
    direction: right
    pins:
      - GND
      - NC
      - HEATBED_ON
      - NC_2
  - prefix: SSR_HEATBED_
    origin: [9, 4]
    direction: right
    pins:
      - GND
      - SSR_OUT


wires:
  - from: PICO_GND_03
    to: PICO_POWER_CAP_1
    type: ground
    color: "#000000"
  - from: PICO_POWER_CAP_2
    to: PICO_THREEV3_OUT_36
    type: lv_power
    color: "#9ca3af"

  # APA102/DotStar vision light helper header for a 3.3V-to-5V level shifter.
  # VBUS is intended for small-strip testing; use fused external 5V with common
  # ground if the nine-pixel strip browns out the Pico or the rail sags.
  - from: PICO_VBUS_40
    to: VISION_APA102_FIVE_V
    type: power
  - from: PICO_THREEV3_OUT_36
    to: VISION_APA102_THREEV3
    type: lv_power
  - from: PICO_GND_13
    to: VISION_APA102_GND
    type: ground
  - from: PICO_GPIO_18_24
    to: VISION_APA102_CLOCK
    klipper: "dotstar vision_light.clock_pin"
    type: clock
  - from: PICO_GPIO_19_25
    to: VISION_APA102_DATA
    klipper: "dotstar vision_light.data_pin"
    type: data

  # Live Y TB6600 stripboard control connector.
  - from: PICO_GND_03
    to: Y_TB6600_IF_GND
    type: ground
  - from: PICO_GPIO_1
    to: Y_TB6600_IF_DIR
    type: data
  - from: PICO_GPIO_0
    to: Y_TB6600_IF_STEP
    type: clock
  - from: PICO_GPIO_2
    to: Y_TB6600_IF_ENABLE
    type: data

  # Reserved Y TMC2226 fallback driver.
  - from: PICO_GPIO_11
    to: TMC1_J1_STEP_7
    type: clock
  - from: PICO_GPIO_10
    to: TMC1_J1_DIR_8
    type: data
  - from: PICO_GPIO_12
    to: TMC1_J1_EN_1
    type: data
  - from: PICO_GPIO_9
    to: TMC1_J1_UART_PDN_4
    type: data
    color: "#9ca3af"
  - from: PICO_GPIO_3
    to: R_Y_DIAG_1K2_PICO
    type: data
    color: "#9ca3af"
  - from: R_Y_DIAG_1K2_TMC
    to: TMC1_TOP_DIAG
    type: data
    color: "#9ca3af"
  - from: PICO_GND_03
    to: TMC1_J2_GND_LOGIC_8
    type: ground
  - from: PICO_THREEV3_OUT_36
    to: TMC1_J2_VIO_7
    type: lv_power
  - from: TMC1_J2_VIO_7
    to: TMC1_10K_PULL_UP_2
    type: lv_power
    color: "#9ca3af"
  - from: TMC1_10K_PULL_UP_1
    to: TMC1_J1_EN_1
    type: data
    color: "#9ca3af"

  - from: PICO_GPIO_7
    to: TMC2_J1_STEP_7
    klipper: stepper_z.step_pin
    type: clock
  - from: PICO_GPIO_6
    to: TMC2_J1_DIR_8
    klipper: stepper_z.dir_pin
    type: data
  - from: PICO_GPIO_8
    to: TMC2_J1_EN_1
    klipper: stepper_z.enable_pin
    type: data
  - from: PICO_GPIO_5
    to: TMC2_J1_UART_PDN_4
    klipper: "tmc2209 stepper_z.uart_pin"
    type: data
    color: "#9ca3af"
  - from: PICO_GND_18
    to: TMC2_J2_GND_LOGIC_8
    type: ground
  - from: PICO_THREEV3_OUT_36
    to: TMC2_J2_VIO_7
    type: lv_power
  - from: TMC2_J2_VIO_7
    to: TMC2_10K_PULL_UP_2
    type: lv_power
    color: "#9ca3af"
  - from: TMC2_10K_PULL_UP_1
    to: TMC2_J1_EN_1
    type: data
    color: "#9ca3af"

  - from: PICO_GPIO_14
    to: TMC3_J1_STEP_7
    klipper: stepper_z1.step_pin
    type: clock
  - from: PICO_GPIO_15
    to: TMC3_J1_DIR_8
    klipper: stepper_z1.dir_pin
    type: data
  - from: PICO_GPIO_16_21
    to: TMC3_J1_EN_1
    klipper: stepper_z1.enable_pin
    type: data
  - from: PICO_GPIO_13
    to: TMC3_J1_UART_PDN_4
    klipper: "tmc2209 stepper_z1.uart_pin"
    type: data
    color: "#9ca3af"
  - from: PICO_GND_23
    to: TMC3_J2_GND_LOGIC_8
    type: ground
  - from: PICO_THREEV3_OUT_36
    to: TMC3_J2_VIO_7
    type: lv_power
  - from: TMC3_J2_VIO_7
    to: TMC3_10K_PULL_UP_2
    type: lv_power
    color: "#9ca3af"
  - from: TMC3_10K_PULL_UP_1
    to: TMC3_J1_EN_1
    type: data
    color: "#9ca3af"

  - from: PICO_GPIO_4
    to: ENDSTOP_Y_NO
    type: data
  - from: PICO_GPIO_22_29
    to: ENDSTOP_Z_LEFT_NO
    klipper: stepper_z.endstop_pin
    type: data
  - from: PICO_GPIO_17_22
    to: ENDSTOP_Z_RIGHT_NO
    klipper: stepper_z1.endstop_pin
    type: data
  - from: PWR_GND
    to: ENDSTOP_Y_GND
    type: ground
  - from: ENDSTOP_Y_GND
    to: ENDSTOP_Z_LEFT_GND
    type: ground
  - from: ENDSTOP_Z_LEFT_GND
    to: ENDSTOP_Z_RIGHT_GND
    type: ground
  - from: ENDSTOP_Y_VCC
    to: PICO_THREEV3_OUT_36
    type: lv_power
  - from: ENDSTOP_Z_LEFT_VCC
    to: ENDSTOP_Y_VCC
    type: lv_power
  - from: ENDSTOP_Z_RIGHT_VCC
    to: ENDSTOP_Z_LEFT_VCC
    type: lv_power
  - from: PICO_AGND_33
    to: HEATBED_THERM_GND
    type: ground
  - from: PICO_GPIO_26_ADC0_31
    to: HEATBED_THERM_SIGNAL
    klipper: heater_bed.sensor_pin
    type: data
    color: "#9ca3af"
  - from: PICO_THREEV3_OUT_36
    to: HEATBED_THERM_REF
    type: lv_power
  - from: HEATBED_THERM_REF
    to: R_BED_4K7_REF
    type: lv_power
    color: "#9ca3af"
  - from: R_BED_4K7_SIG
    to: HEATBED_THERM_SIGNAL
    type: data
    color: "#9ca3af"
  - from: C_BED_THERM_DAMP_100UF_POS
    to: HEATBED_THERM_SIGNAL
    type: data
    color: "#9ca3af"
  - from: C_BED_THERM_DAMP_100UF_NEG
    to: HEATBED_THERM_GND
    type: ground

  # Reserved TMC1 Y motor wiring. Live Y motor phases are on the external
  # TB6600 driver while the TB6600 interface is active.
  - from: MOTOR_Y_A_PLUS
    to: TMC1_J2_A1_5
    type: default
    color: "#ff0000"
  - from: MOTOR_Y_A_MINUS
    to: TMC1_J2_A2_6
    type: default
    color: "#000000"
  - from: MOTOR_Y_B_PLUS
    to: TMC1_J2_B1_4
    type: default
    color: "#ffd400"
  - from: MOTOR_Y_B_MINUS
    to: TMC1_J2_B2_3
    type: default
    color: "#0057d8"

  - from: MOTOR_Z_LEFT_A_PLUS
    to: TMC2_J2_A1_5
    type: default
    color: "#ff0000"
  - from: MOTOR_Z_LEFT_A_MINUS
    to: TMC2_J2_A2_6
    type: default
    color: "#000000"
  - from: MOTOR_Z_LEFT_B_PLUS
    to: TMC2_J2_B1_4
    type: default
    color: "#ffd400"
  - from: MOTOR_Z_LEFT_B_MINUS
    to: TMC2_J2_B2_3
    type: default
    color: "#0057d8"

  - from: MOTOR_Z_RIGHT_A_PLUS
    to: TMC3_J2_A1_5
    type: default
    color: "#ff0000"
  - from: MOTOR_Z_RIGHT_A_MINUS
    to: TMC3_J2_A2_6
    type: default
    color: "#000000"
  - from: MOTOR_Z_RIGHT_B_PLUS
    to: TMC3_J2_B1_4
    type: default
    color: "#ffd400"
  - from: MOTOR_Z_RIGHT_B_MINUS
    to: TMC3_J2_B2_3
    type: default
    color: "#0057d8"

  # Reserved TMC1 motor supply for Y rollback.
  - from: PWR_V24
    to: TMC1_J2_VM_1
    type: hazard_power
  - from: PWR_V24
    to: TMC2_J2_VM_1
    type: hazard_power
  - from: PWR_V24
    to: TMC3_J2_VM_1
    type: hazard_power
  - from: PWR_GND
    to: TMC1_J2_GND_MOTOR_2
    type: ground
  - from: PWR_GND
    to: TMC2_J2_GND_MOTOR_2
    type: ground
  - from: PWR_GND
    to: TMC3_J2_GND_MOTOR_2
    type: ground

  # The MOSFET driver remains physically connected for a possible future
  # auxiliary heater, but it is intentionally absent from printer.cfg.
  - from: PWR_GND
    to: MOSFET_RESERVED_UNUSED_GND
    type: ground
  - from: PICO_GPIO_21_27
    to: MOSFET_RESERVED_UNUSED_HEATBED_ON
    type: data
  - from: PICO_GND_28
    to: SSR_HEATBED_GND
    type: ground
  - from: PICO_GPIO_20_26
    to: SSR_HEATBED_SSR_OUT
    klipper: heater_bed.heater_pin
    type: data

    
