discrete_view:
  title: RP2040-Plus / TMC5160T Plus component placement — top side
  notes: |
    TOP / COMPONENT SIDE: insert the shown parts here; wire-wrap conductors are omitted.
    Pico USB exits above the aligned top edge; keep that entire edge clear.
    Then flip the board and use rp2040plus_btt_tmc5160t_plus_y_bottom.svg for wrapping.
    Diodes: K is the cathode/band. U1/U2: align the notch and pin-1 marker.
    Q1: C/B/E are shown; verify the actual BC327 flat-side lead order before insertion.
    HV socket: leave positions 5-7 and 14-16 empty as the detector guard gap.
  groups:
    - id: pico
      label: RP2040-Plus — USB / BOARD TOP
      pin_sets: [pico_left, pico_right]
    - id: u1
      label: U1 socket — SN7407N DIP-14
      pin_sets: [u1_left, u1_right]
    - id: tmc_adapter
      label: TMC5160T Plus StepStick adapter
      pin_sets: [tmc1_j1, tmc1_j2, tmc1_top]
    - id: external_io
      label: 18-pin external I/O — fuse/power end at pin 1, endstop end at pin 18
      pin_sets: [external_io]
    - id: socket_a
      label: Socket A — AR20
      pin_sets: [socket_a_left, socket_a_right]
    - id: socket_b
      label: Socket B — AR20
      pin_sets: [socket_b_left, socket_b_right]
    - id: socket_c
      label: Socket C — AR20
      pin_sets: [socket_c_left, socket_c_right]
    - id: socket_hv
      label: HV detector socket — AR20
      pin_sets: [socket_hv_left, socket_hv_right]
    - id: high_current
      label: TMC5160T Plus screw terminals
      pin_sets: [tmc5160_hv]
  anchor_labels:
    PICO_GPIO_0: "1"
    PICO_VBUS_40: "40"
    TMC1_J1_EN_1: J1-1
    TMC1_J2_VM_1: J2-1
    TMC1_TOP_DIAG0: DIAG0
    TMC1_TOP_DIAG1: DIAG1
    LINE18_F1_5A_OUT: FUSE OUT
    LINE18_F1_5A_IN: FUSE IN
    LINE18_PWR_V24_SW_A: 24V-A
    LINE18_PWR_V24_SW_B: 24V-B
    LINE18_NC_ISOLATION: KEEP EMPTY
    LINE18_PWR_GND_A: GND-A
    LINE18_PWR_GND_B: GND-B
    LINE18_ENDSTOP_NO: "NO"
    LINE18_ENDSTOP_GND: GND
    LINE18_ENDSTOP_VCC: VCC
    B01_NC: "1"
    B20_NC: "20"
    TMC5160_HV_1B: 1B
    TMC5160_HV_HVIN_8_60V: HVIN
wires:
  # Switched-24V input uses both paralleled positive and ground contacts. The
  # serviceable external fuse is connected physically between the two dedicated
  # contacts.
  - from: LINE18_PWR_V24_SW_A
    to: LINE18_PWR_V24_SW_B
    type: hazard_power
  - from: LINE18_PWR_V24_SW_B
    to: LINE18_F1_5A_IN
    type: hazard_power
  - from: LINE18_F1_5A_OUT
    to: TMC5160_HV_HVIN_8_60V
    type: hazard_power
  - from: LINE18_PWR_GND_A
    to: LINE18_PWR_GND_B
    type: ground
  - from: LINE18_PWR_GND_B
    to: TMC5160_HV_GND
    type: ground

  # Fused switched 24V also supplies the low-current detector and adapter auxiliary input.
  - from: LINE18_F1_5A_OUT
    to: HV08_R1_24V
    type: hazard_power
  - from: LINE18_F1_5A_OUT
    to: TMC1_J2_VM_1
    type: hazard_power

  # Common ground. The lower chain keeps motor current out of logic wiring; the
  # upper analog contacts form a short left-to-right bus fed once from U1 ground.
  - from: LINE18_PWR_GND_B
    to: TMC1_J2_GND_MOTOR_2
    type: ground
  - from: TMC1_J2_GND_MOTOR_2
    to: TMC1_J2_GND_LOGIC_8
    type: ground
  - from: TMC1_J2_GND_LOGIC_8
    to: C11_R22_GND
    type: ground
  - from: C11_R22_GND
    to: C12_R21_GND
    type: ground
  - from: C12_R21_GND
    to: U1_07_GND
    type: ground
  - from: U1_07_GND
    to: PICO_GND_28
    type: ground
  - from: U1_07_GND
    to: A14_DZ2_A
    type: ground
  - from: A20_C1_GND
    to: A19_C2_GND
    type: ground
  - from: A19_C2_GND
    to: A15_R5_GND
    type: ground
  - from: A15_R5_GND
    to: A14_DZ2_A
    type: ground
  - from: A14_DZ2_A
    to: HV11_D1_A
    type: ground
  - from: HV11_D1_A
    to: HV03_U2P3_LEDB_K
    type: ground
  - from: HV03_U2P3_LEDB_K
    to: HV17_U2P5_E_B
    type: ground
  - from: HV17_U2P5_E_B
    to: HV20_U2P8_E_A
    type: ground
  - from: PICO_GND_03
    to: LINE18_ENDSTOP_GND
    type: ground

  # Pico USB VBUS powers U1 and the switched VIO regulator input.
  - from: PICO_VBUS_40
    to: U1_14_VCC
    type: power
  - from: U1_14_VCC
    to: A10_Q1_E
    type: power
  - from: A10_Q1_E
    to: A03_R2_VBUS
    type: power
  - from: A03_R2_VBUS
    to: A02_C2_VBUS
    type: power

  # Pico 3.3V safe-state and power-good pull-ups.
  - from: PICO_THREEV3_OUT_36
    to: B02_R6_3V3
    type: lv_power
  - from: B02_R6_3V3
    to: B03_R12_3V3
    type: lv_power
  - from: B03_R12_3V3
    to: B04_R7_3V3
    type: lv_power
  - from: B04_R7_3V3
    to: B05_R11_3V3
    type: lv_power
  - from: B05_R11_3V3
    to: B06_R8_3V3
    type: lv_power
  - from: B06_R8_3V3
    to: B07_R10_3V3
    type: lv_power
  - from: B07_R10_3V3
    to: B08_R9_3V3
    type: lv_power
  - from: PICO_THREEV3_OUT_36
    to: LINE18_ENDSTOP_VCC
    type: lv_power

  # Switched-24V threshold detector: R1, DZ1, two ILD74 LEDs in series, and D1.
  - from: HV13_R1_DZ1
    to: HV09_DZ1_K
    type: hazard_power
  - from: HV12_DZ1_A
    to: HV01_U2P1_LEDA_A
    type: hazard_power
  - from: HV02_U2P2_LEDA_K
    to: HV04_U2P4_LEDB_A
    type: hazard_power
  - from: HV10_D1_K
    to: HV01_U2P1_LEDA_A
    type: hazard_power
  # U2A drives the BC327 VBUS high-side switch.
  - from: A18_R2_BASE
    to: A04_R3_BASE
    type: control
  - from: A04_R3_BASE
    to: A09_Q1_B
    type: control
  - from: A17_R3_U2A
    to: HV19_U2P7_C_A
    type: control
  - from: A08_Q1_C
    to: A05_R4_Q1C
    type: power

  # Sequenced VIO shunt regulator and all collector pull-up supply contacts.
  - from: A16_R4_VIO
    to: A06_R5_VIO
    type: lv_power
  - from: A06_R5_VIO
    to: A07_DZ2_K
    type: lv_power
  - from: A07_DZ2_K
    to: A01_C1_VIO
    type: lv_power
  - from: A01_C1_VIO
    to: C01_R15_VIO
    type: lv_power
  - from: C01_R15_VIO
    to: C02_R18_VIO
    type: lv_power
  - from: C02_R18_VIO
    to: C03_R17_VIO
    type: lv_power
  - from: C03_R17_VIO
    to: C04_R16_VIO
    type: lv_power
  - from: C04_R16_VIO
    to: C07_R13_VIO
    type: lv_power
  - from: C07_R13_VIO
    to: C08_R14_VIO
    type: lv_power
  - from: C08_R14_VIO
    to: TMC1_J2_VIO_7
    type: lv_power

  # Active-low power-good reporting from U2B to Pico GPIO5.
  - from: B19_R6_PWR_OK
    to: HV18_U2P6_C_B
    type: lv_power
  - from: HV18_U2P6_C_B
    to: PICO_GPIO_5
    type: power_good

  # U1 inputs and their 10k Pico-3.3V default-high resistors.
  - from: PICO_GPIO_0
    to: U1_01_1A_STEP
    type: clock
  - from: U1_01_1A_STEP
    to: B17_R7_STEP
    type: lv_power
  - from: PICO_GPIO_1
    to: U1_03_2A_DIR
    type: data
  - from: U1_03_2A_DIR
    to: B15_R8_DIR
    type: lv_power
  - from: PICO_GPIO_2
    to: U1_05_3A_ENABLE
    type: control
  - from: U1_05_3A_ENABLE
    to: B13_R9_ENABLE
    type: lv_power
  - from: PICO_GPIO_9
    to: U1_09_4A_CS
    type: control
  - from: U1_09_4A_CS
    to: B14_R10_CS
    type: lv_power
  - from: PICO_GPIO_10
    to: U1_11_5A_SCLK
    type: clock
  - from: U1_11_5A_SCLK
    to: B16_R11_SCLK
    type: lv_power
  - from: PICO_GPIO_11
    to: U1_13_6A_MOSI
    type: data
  - from: U1_13_6A_MOSI
    to: B18_R12_MOSI
    type: lv_power

  # U1 open-collector outputs and VIO-side pull-ups to the adapter.
  - from: U1_02_1Y_STEP
    to: C14_R13_STEP
    type: clock
  - from: C14_R13_STEP
    to: TMC1_J1_STEP_7
    type: clock
  - from: U1_04_2Y_DIR
    to: C13_R14_DIR
    type: data
  - from: C13_R14_DIR
    to: TMC1_J1_DIR_8
    type: data
  - from: U1_06_3Y_ENABLE
    to: C20_R15_ENABLE
    type: control
  - from: C20_R15_ENABLE
    to: TMC1_J1_EN_1
    type: control
  - from: U1_08_4Y_CS
    to: C17_R16_CS
    type: control
  - from: C17_R16_CS
    to: TMC1_J1_CS_CFG3_4
    type: control
  - from: U1_10_5Y_SCLK
    to: C18_R17_SCLK
    type: clock
  - from: C18_R17_SCLK
    to: TMC1_J1_SCK_CFG2_3
    type: clock
  - from: U1_12_6Y_MOSI
    to: C19_R18_MOSI
    type: data
  - from: C19_R18_MOSI
    to: TMC1_J1_MOSI_CFG1_2
    type: data

  # Protected adapter-to-Pico MISO and DIAG1 returns.
  - from: TMC1_J1_MISO_CFG0_5
    to: C16_R19_TMC_MISO
    type: return
  - from: C05_R19_PICO_MISO
    to: C09_R21_PICO_MISO
    type: return
  - from: C09_R21_PICO_MISO
    to: PICO_GPIO_8
    type: return
  - from: TMC1_TOP_DIAG1
    to: C15_R20_TMC_DIAG
    type: return
  - from: C06_R20_PICO_DIAG
    to: C10_R22_PICO_DIAG
    type: return
  - from: C10_R22_PICO_DIAG
    to: PICO_GPIO_3
    type: return

  # Physical Y endstop remains authoritative for production homing.
  - from: PICO_GPIO_4
    to: LINE18_ENDSTOP_NO
    type: data
