      - 19_U2P7_C_A
      - 18_U2P6_C_B
      - 17_U2P5_E_B
      - 16_NC
      - 15_NC
      - 14_NC
      - 13_R1_DZ1
      - 12_DZ1_A
      - 11_D1_A

  # Actual driver screw terminals; motor conductors land directly on pins 1-4.
