  # Dedicated switched-24V detector carrier. U2 occupies the first four
  # contacts on each side. Three empty positions form a guard gap before R1/DZ1/D1.
  - id: socket_hv_left
    prefix: HV
    origin: [26, 33]
    direction: down
    discrete_pin_numbers: {start: 1, step: 1}
