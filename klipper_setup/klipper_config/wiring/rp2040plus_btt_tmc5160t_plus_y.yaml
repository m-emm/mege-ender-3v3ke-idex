basename: rp2040plus_btt_tmc5160t_plus_y

metadata:
  version_label: "RP2040-Plus + BTT TMC5160T Plus Y concept review"
  klipper_mcu: y_pico
  notes: |
    REVIEW ONLY: not active printer wiring. Bench-validate before construction.
    Pico: STEP=GPIO0, DIR=GPIO1, ENABLE=GPIO2, DIAG1=GPIO3, endstop=GPIO4,
    PWR_OK_N=GPIO5, MISO=GPIO8, CS=GPIO9, SCLK=GPIO10, MOSI=GPIO11.
    TMC1_J1/J2/TOP model the ordinary StepStick-format adapter and supplied ribbon as one boundary.
    Continuity-check the received adapter/ribbon and mark pin 1 before applying power.
    TMC1 J1: EN, MOSI/CFG1, SCK/CFG2, CS/CFG3, MISO/CFG0, CLK N/C, STEP, DIR.
    TMC1 J2: auxiliary 24V, two grounds, B2/B1/A1/A2 N/C, sequenced VIO.
    TMC1 TOP: DIAG0 is electrically unused and DIAG1 is the protected GPIO3 return;
    both are physical through-pins and require carrier holes.
    U1 is SN7407N DIP-14. U2 is ILD74 DIP-8. Both use the shown top-view pin numbering.
    A/B/C/HV are AR20-HZW/TN 20-pin, 0.3-inch DIL wire-wrap sockets with spring contacts.
    Physical layout: Pico at the left; Socket A above U1; the HV socket above Socket C;
    the TMC adapter and 18-pin external I/O row precede the full driver footprint.
    Top-row parts align with the Pico USB edge. Keep that area clear except for the plate's USB bridge.
    Insert each passive across its labeled opposite contact pair; the passive itself joins the pair.
    Socket HV contacts 1-4 and 20-17 hold U2 pins 1-4 and 8-5; positions 8-10 hold R1, DZ1, D1.
    HV positions 5-7 remain empty as a physical guard gap between U2 and the detector passives.
    Do not use those spare HV contacts for low-voltage circuitry.
    Socket A positions 1-2 hold C1/C2; positions 3-7 hold R2-R5 and DZ2.
    A08/A09/A10 hold Q1 C/B/E on one side.
    A13/A12/A11 remain empty. Verify the actual BC327 lead order before inserting Q1.
    Socket B positions 2-8 hold R6, R12, R7, R11, R8, R10, R9 in that order;
    positions 1, 9, and 10 remain empty.
    Socket C positions 1-10: R15, R18, R17, R16, R19, R20, R13, R14, R21, R22.
    HV optocoupler labels use U2P=ILD74 pin, LEDA/LEDB=channel, A/K=anode/cathode,
    and C/E=collector/emitter.
    DZ1/DZ2 contacts marked K/A are cathode/anode. D1 K goes to U2 pin 1; D1 A to U2 pin 3.
    R1=620R/0.5W; R2=47k; R3=2.7k; R4=39R/0.5W; R5=2.2k; R6=4.7k.
    R7-R12=10k; R13-R15=4.7k; R16-R18=2.2k; R19-R20=1k; R21-R22=47k.
    DZ1=12V/0.5W; DZ2=3.3V/0.5W; D1=1N4148; C1=C2=100nF ceramic.
    PWR_OK_N is active-low: LOW means switched 24V is valid; it is a reporting input only.
    Wire colors: red=positive power; black=ground; blue=STEP/SCLK; yellow=all other signals;
    grey on the drawing=physical white wire for Pico 3.3V and sequenced VIO.
    U1 collectors are pulled up only from sequenced TMC_VIO. Initial SPI speed is 500kHz.
    Logic, detector, and VIO conductors are low-current wire-wrap class only.
    The external I/O row carries both external 5A fuse contacts, switched 24V through two
    paralleled positive contacts, and two paralleled ground contacts. Connect the serviceable
    external fuse only between LINE18_F1_5A_IN and LINE18_F1_5A_OUT.
    Keep LINE18_NC_ISOLATION and LINE18_SPARE_01 through LINE18_SPARE_08 unconnected.
    High-current 24V bypasses the Pico and DIL-socket conductors.
    Land the four Y-motor conductors directly on the driver's 1B/2B/1A/2A screw terminals.
    The 64x57mm driver box is exact; screw-terminal spacing within it is illustrative.
    F1 is a dedicated serviceable external 5A branch fuse.
    Size all high-current wiring above the fuse rating.

color_map:
  power: "#ff0000"
  hazard_power: "#ff0000"
  lv_power: "#9ca3af"
  ground: "#000000"
  clock: "#0057d8"
  data: "#d9a900"
  control: "#d9a900"
  return: "#d9a900"
  power_good: "#d9a900"
  default: "#d9a900"

boxes:
  - id: tmc5160t_plus_driver
    label: |
      TMC5160T Plus
      64 x 57 mm
      25.197 x 22.441 raster units
      Screw-terminal spacing illustrative
    top_left: [42, 36]
    size_pitches: [25.1968503937, 22.4409448819]

physical_components:
  - id: pico
    label: RP2040-Plus
    component_type: rp2040_plus_2x20
    pin_sets: [pico_left, pico_right]
    downholder: corner

  - id: socket_b
    label: Socket B
    component_type: ar20_2x10
    pin_sets: [socket_b_left, socket_b_right]
    downholder: center_strip

  - id: socket_a
    label: Socket A
    component_type: ar20_2x10
    pin_sets: [socket_a_left, socket_a_right]
    downholder: center_strip

  - id: u1_socket
    label: U1 SN7407N socket
    component_type: dip14_socket
    pin_sets: [u1_left, u1_right]
    downholder: center_strip

  - id: socket_hv
    label: HV detector socket
    component_type: ar20_2x10
    pin_sets: [socket_hv_left, socket_hv_right]
    downholder: center_strip

  - id: socket_c
    label: Socket C
    component_type: ar20_2x10
    pin_sets: [socket_c_left, socket_c_right]
    downholder: center_strip

  - id: tmc_adapter
    label: TMC5160T Plus StepStick adapter
    component_type: stepstick_adapter
    pin_sets: [tmc1_j1, tmc1_j2, tmc1_top]
    downholder: none

  - id: external_io_pin_line
    label: 18-pin fuse, power, spare, and Y-endstop row
    component_type: pin_line
    pin_sets: [external_io]
    downholder: pin_line_clamp

  - id: tmc5160t_plus_driver
    label: TMC5160T Plus
    component_type: boxed_module
    pin_sets: [tmc5160_hv]
    through_pin_sets: []
    box: tmc5160t_plus_driver
    downholder: none

# Coordinate system: origin at bottom-left; X increases right; Y increases up.
pin_sets:
  # RP2040-Plus, using the Pico-compatible 40-pin header numbering.
  - id: pico_left
    prefix: PICO_
    origin: [0, 36]
    direction: down
    discrete_pin_numbers: {start: 1, step: 1}
    pins:
      - GPIO_0
      - GPIO_1
      - GND_03
      - GPIO_2
      - GPIO_3
      - GPIO_4
      - GPIO_5
      - GND_08
      - GPIO_6
      - GPIO_7
      - GPIO_8
      - GPIO_9
      - GND_13
      - GPIO_10
      - GPIO_11
      - GPIO_12
      - GPIO_13
      - GND_18
      - GPIO_14
      - GPIO_15
  - id: pico_right
    prefix: PICO_
    origin: [8, 36]
    direction: down
    discrete_pin_numbers: {start: 40, step: -1}
    pins:
      - VBUS_40
      - VSYS_39
      - GND_38
      - THREEV3_EN_37
      - THREEV3_OUT_36
      - ADC_VREF_35
      - GPIO_28_ADC2_34
      - AGND_33
      - GPIO_27_ADC1_32
      - GPIO_26_ADC0_31
      - RUN_30
      - GPIO_22_29
      - GND_28
      - GPIO_21_27
      - GPIO_20_26
      - GPIO_19_25
      - GPIO_18_24
      - GND_23
      - GPIO_17_22
      - GPIO_16_21

  # U1 SN7407N: top view, notch at the top.
  - id: u1_left
    prefix: U1_
    origin: [16, 18]
    direction: down
    discrete_pin_numbers: {start: 1, step: 1}
    pins:
      - 01_1A_STEP
      - 02_1Y_STEP
      - 03_2A_DIR
      - 04_2Y_DIR
      - 05_3A_ENABLE
      - 06_3Y_ENABLE
      - 07_GND
  - id: u1_right
    prefix: U1_
    origin: [19, 18]
    direction: down
    discrete_pin_numbers: {start: 14, step: -1}
    pins:
      - 14_VCC
      - 13_6A_MOSI
      - 12_6Y_MOSI
      - 11_5A_SCLK
      - 10_5Y_SCLK
      - 09_4A_CS
      - 08_4Y_CS

  # Ordinary StepStick-format adapter, matching the existing TMC1 layout pattern.
  - id: tmc1_j1
    prefix: TMC1_J1_
    origin: [33, 36]
    direction: down
    discrete_pin_numbers: {start: 1, step: 1}
    pins:
      - EN_1
      - MOSI_CFG1_2
      - SCK_CFG2_3
      - CS_CFG3_4
      - MISO_CFG0_5
      - CLK_NC_6
      - STEP_7
      - DIR_8
  - id: tmc1_j2
    prefix: TMC1_J2_
    origin: [37, 36]
    direction: down
    discrete_pin_numbers: {start: 1, step: 1}
    pins:
      - VM_1
      - GND_MOTOR_2
      - B2_NC_3
      - B1_NC_4
      - A1_NC_5
      - A2_NC_6
      - VIO_7
      - GND_LOGIC_8
  - id: tmc1_top
    prefix: TMC1_TOP_
    origin: [34, 36]
    direction: right
    pins:
      - DIAG0
      - DIAG1

  # One retained 18-pin SIL row. Numbering runs from the lower fuse/power end
  # toward the upper endstop end so the high- and low-voltage interfaces are
  # far apart.
  - id: external_io
    prefix: LINE18_
    origin: [40, 18]
    direction: up
    discrete_pin_numbers: {start: 1, step: 1}
    pins:
      - F1_5A_OUT
      - F1_5A_IN
      - PWR_V24_SW_A
      - PWR_V24_SW_B
      - NC_ISOLATION
      - PWR_GND_A
      - PWR_GND_B
      - SPARE_01
      - SPARE_02
      - SPARE_03
      - SPARE_04
      - SPARE_05
      - SPARE_06
      - SPARE_07
      - SPARE_08
      - ENDSTOP_NO
      - ENDSTOP_GND
      - ENDSTOP_VCC

  # AR20 socket A: VBUS switch/VIO regulator plus Q1 on one side.
  - id: socket_a_left
    prefix: A
    origin: [19, 33]
    direction: down
    discrete_pin_numbers: {start: 1, step: 1}
    pins:
      - 01_C1_VIO
      - 02_C2_VBUS
      - 03_R2_VBUS
      - 04_R3_BASE
      - 05_R4_Q1C
      - 06_R5_VIO
      - 07_DZ2_K
      - 08_Q1_C
      - 09_Q1_B
      - 10_Q1_E
  - id: socket_a_right
    prefix: A
    origin: [22, 33]
    direction: down
    discrete_pin_numbers: {start: 20, step: -1}
    pins:
      - 20_C1_GND
      - 19_C2_GND
      - 18_R2_BASE
      - 17_R3_U2A
      - 16_R4_VIO
      - 15_R5_GND
      - 14_DZ2_A
      - 13_NC
      - 12_NC
      - 11_NC

  # AR20 socket B: power-good/input pulls, signal pulls, and capacitors.
  - id: socket_b_left
    prefix: B
    origin: [12, 33]
    direction: down
    discrete_pin_numbers: {start: 1, step: 1}
    pins:
      - 01_NC
      - 02_R6_3V3
      - 03_R12_3V3
      - 04_R7_3V3
      - 05_R11_3V3
      - 06_R8_3V3
      - 07_R10_3V3
      - 08_R9_3V3
      - 09_NC
      - 10_NC
  - id: socket_b_right
    prefix: B
    origin: [15, 33]
    direction: down
    discrete_pin_numbers: {start: 20, step: -1}
    pins:
      - 20_NC
      - 19_R6_PWR_OK
      - 18_R12_MOSI
      - 17_R7_STEP
      - 16_R11_SCLK
      - 15_R8_DIR
      - 14_R10_CS
      - 13_R9_ENABLE
      - 12_NC
      - 11_NC

  # AR20 socket C: collector pull-ups and protected return paths.
  - id: socket_c_left
    prefix: C
    origin: [23, 18]
    direction: down
    discrete_pin_numbers: {start: 1, step: 1}
    pins:
      - 01_R15_VIO
      - 02_R18_VIO
      - 03_R17_VIO
      - 04_R16_VIO
      - 05_R19_PICO_MISO
      - 06_R20_PICO_DIAG
      - 07_R13_VIO
