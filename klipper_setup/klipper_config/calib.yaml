bed_grid_zero:
  x: 113.300
  y: 107.000
# Canonical absolute Z datum for the Iteration 1 T0 tap workflow.
bed_z_reference:
  x: 150.000
  y: 150.000
# Physical nozzle-to-bed clearance at G-code Z=0 for both tools.  Raw Tap
# contact is intentionally targeted at -bed_to_nozzle_gap.
bed_to_nozzle_gap: 0.200
# Accepted vision-derived relationship. Iteration 1 may translate both
# endstops, but must never change this relative T1/T0 Z alignment.
vision_relative_alignment:
  t0_minus_t1_z: 1.274
  tolerance_mm: 0.010
  source: accepted vision-derived T1/T0 Z relationship
tools:
  t0:
    x_endstop: -77.635
    y_endstop: -14.800
    z_endstop: 293.412
  t1:
    x_endstop: 353.087
    y_endstop: -13.615
    z_endstop: 292.138
    
