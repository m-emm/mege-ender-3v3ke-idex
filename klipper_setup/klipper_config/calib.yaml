    capture:
      # Calibration at nozzle X=180 Y=35.
      # After ACCEPT: nozzle moves to (237.4, 16.0), eddy sweeps at (180, 35).
      # Bed front edge ~Y=24mm; eddy at Y=35 is 11mm inside the edge.
      # Z=0 trusted from prior nozzle calibration at X=180 Y=-3.
      status: pending_calibration
      method: accept_at_z0
      cold_only: true
      drive_current:
        chip: btt_eddy
        coil_height_mm: 20.000
        nozzle_command_position: {x: 180.000, y: 35.000, z: 20.000}
      height_mapping:
        chip: btt_eddy
        nozzle_start_position: {x: 180.000, y: 35.000, z: 0.000}
        required_usable_height_mm: 3.000
      smoke_checks:
        stationary_scan:
          command: PROBE_ACCURACY METHOD=scan SAMPLES=50
          result: pending
        repeated_descent:
          command: PROBE_ACCURACY SAMPLES=20 PROBE_SPEED=2 SAMPLE_RETRACT_DIST=1
          result: pending
