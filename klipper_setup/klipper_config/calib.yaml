bed_grid_zero:
  x: 113.300
  y: 107.000
# Canonical absolute Z datum for the Iteration 1 T0 tap workflow.
bed_z_reference:
  x: 150.000
  y: 150.000
# Signed physical nozzle-to-bed datum at G-code Z=0 for both tools: positive
# is above the bed, zero is contact, and negative is below it. Raw Tap contact
# is intentionally targeted at -bed_to_nozzle_gap.
bed_to_nozzle_gap: 0.0
# The single source of truth for the managed GUI/workflow Tap mesh command.
# The generated printer.cfg and calibration runner both consume these values.
tap_mesh:
  profile: default
  # One contact per grid point is the managed default.  A caller may still
  # request a larger explicit SAMPLES value for a diagnostic run.
  samples: 1
  # Tap needs a short post-XY-move mechanical settle.  Two consecutive full
  # 7x7 meshes at 100 ms completed on 2026-08-24, including the former
  # insufficient-slope point at X=189.956, Y=239.544.
  settle_ms: 100
  horizontal_move_z: 5.0
  # Eddy rapid-scan height; unlike Tap travel clearance this must stay within
  # the calibrated Eddy sensor range above the bed.
  rapid_scan_height: 0.5
  probe_count: [7, 7]
  # Source-controlled copy of the mesh measured on the replacement bed on
  # 2026-08-25.  This is the reviewed, repeatable 7x7 Tap profile inside the
  # current PEI-covered mesh domain.
  saved_mesh:
    version: 1
    points:
      - [0.057772, 0.077115, 0.110504, 0.114016, 0.105312, 0.098052, 0.096143]
      - [0.120073, 0.145766, 0.177555, 0.182322, 0.185368, 0.173973, 0.159673]
      - [0.135039, 0.162887, 0.184337, 0.181731, 0.183186, 0.169852, 0.169977]
      - [0.133055, 0.152090, 0.179335, 0.192297, 0.195567, 0.207330, 0.178609]
      - [0.137490, 0.143167, 0.159465, 0.170805, 0.176374, 0.176034, 0.172466]
      - [0.093124, 0.120720, 0.132863, 0.147307, 0.141673, 0.127180, 0.146183]
      - [0.073753, 0.075394, 0.090117, 0.083278, 0.110340, 0.093392, 0.102010]
    mesh_params:
      min_x: 66.66
      max_x: 189.96
      min_y: 62.5
      max_y: 274.96
      x_count: 7
      y_count: 7
      mesh_x_pps: 0
      mesh_y_pps: 0
      algo: lagrange
      tension: 0.2
# The T0/T1 Z relationship is derived from the two endstops below. The Eddy/Tap
# workflow may translate both together, but must preserve their difference.
tools:
  t0:
    x_endstop: -85.472
    y_endstop: -14.800
    z_endstop: 293.919
  t1:
    x_endstop: 345.984
    y_endstop: -13.226
    z_endstop: 293.425

