bed_grid_zero:
  x: 113.300
  y: 107.000
# Canonical absolute Z datum for the Iteration 1 T0 tap workflow.
bed_z_reference:
  x: 150.000
  y: 150.000
# Signed physical nozzle-to-bed datum at G-code Z=0 for both tools: positive
# is above the bed, zero is contact, and negative is below it. Raw Tap contact
# is intentionally targeted at -bed_to_nozzle_gap.
bed_to_nozzle_gap: 0.0
# Measured on 2026-09-03 at X=117.5, Y=117.5, Z=20 using the left
# toolhead ADXL345. Klipper stores X shaping per IDEX carriage; until T1 is
# remeasured, the latest T0 X result is intentionally applied to both.
input_shaper:
  carriages:
    t0:
      x: { type: mzv, frequency_hz: 31.6 }
    t1:
      x: { type: mzv, frequency_hz: 31.6 }
  y: { type: 2hump_ei, frequency_hz: 44.2 }
# The single source of truth for the managed GUI/workflow Tap mesh command.
# The generated printer.cfg and calibration runner both consume these values.
tap_mesh:
  profile: default
  # One contact per grid point is the managed default.  A caller may still
  # request a larger explicit SAMPLES value for a diagnostic run.
  samples: 1
  # Tap needs a post-XY-move mechanical settle. At the intermittent
  # insufficient-slope point X=169.408, Y=62.506, a 3x3 native mesh and
  # repeated single taps were stable with a 500 ms dwell on 2026-08-28.
  settle_ms: 500
  horizontal_move_z: 5.0
  probe_count: [7, 7]
  # Source-controlled copy of the mesh measured after the complete Z-axis
  # rebuild on 2026-09-04. The live 7x7 Tap matrix passed five independent
  # single-Tap checks at the center and all four mesh corners.
  saved_mesh:
    version: 1
    points:
      - [0.034864, 0.068636, 0.100114, 0.123343, 0.111136, 0.118888, 0.106404]
      - [-0.006511, 0.028297, 0.089920, 0.076861, 0.104693, 0.104095, 0.117214]
      - [-0.023787, -0.015292, 0.011099, 0.038776, 0.064049, 0.089172, 0.123154]
      - [-0.154275, -0.091129, -0.039946, -0.004316, 0.025513, 0.093869, 0.079019]
      - [-0.226111, -0.187519, -0.129170, -0.083119, -0.023318, 0.015393, 0.062862]
      - [-0.326370, -0.267344, -0.194413, -0.173617, -0.116504, -0.029769, 0.005660]
      - [-0.424954, -0.364903, -0.295710, -0.242285, -0.187549, -0.119580, -0.021884]
    mesh_params:
      min_x: 66.66
      max_x: 189.96
      min_y: 62.5
      max_y: 274.96
      x_count: 7
      y_count: 7
      mesh_x_pps: 0
      mesh_y_pps: 0
      algo: lagrange
      tension: 0.2
# The T0/T1 Z relationship is derived from the two endstops below. The Eddy/Tap
# workflow may translate both together, but must preserve their difference.
tools:
  t0:
    x_endstop: -85.472
    y_endstop: -14.800
    z_endstop: 291.493
  t1:
    x_endstop: 346.457
    y_endstop: -13.732
    z_endstop: 290.878

