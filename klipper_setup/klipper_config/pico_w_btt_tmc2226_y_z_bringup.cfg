# Y + dual-Z bring-up config for Raspberry Pi Pico W + BTT TMC2226.
#
# This is a non-printing test config for the rewired Pico controller. It keeps
# the working Y-axis manual stepper behavior and adds tiny synchronized dual-Z
# debug moves plus manual Z endstop checks. Do not use this for printing.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6633861A3673038-if00
# Alternative for temporary bring-up only:
# serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 1:
# STEP=GPIO11, DIR=GPIO10, EN=GPIO12, UART=GPIO9, endstop=GPIO4.
[manual_stepper y_axis]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: ^!gpio4

# BTT TMC2226 V1.0 uses the tmc2209 driver in Klipper.
[tmc2209 manual_stepper y_axis]
uart_pin: gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 2:
# STEP=GPIO7, DIR=GPIO6, EN=GPIO8, UART=GPIO5, endstop button=GPIO22.
[manual_stepper z_left_axis]
step_pin: gpio7
dir_pin: gpio6
enable_pin: !gpio8
microsteps: 16
rotation_distance: 8

[tmc2209 manual_stepper z_left_axis]
uart_pin: gpio5
uart_address: 0
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 3:
# STEP=GPIO14, DIR=GPIO15, EN=GPIO16, UART=GPIO13, endstop button=GPIO17.
[manual_stepper z_right_axis]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
microsteps: 16
rotation_distance: 8

[tmc2209 manual_stepper z_right_axis]
uart_pin: gpio13
uart_address: 0
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

[gcode_button z_left_endstop]
pin: ^!gpio22
press_gcode:
    RESPOND TYPE=echo MSG="Left Z endstop pressed."
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=left_seen VALUE=True
    UPDATE_DELAYED_GCODE ID=z_test_wait_left_endstop_poll DURATION=0.01
    UPDATE_DELAYED_GCODE ID=z_test_wait_both_endstops_poll DURATION=0.01

[gcode_button z_right_endstop]
pin: ^!gpio17
press_gcode:
    RESPOND TYPE=echo MSG="Right Z endstop pressed."
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=right_seen VALUE=True
    UPDATE_DELAYED_GCODE ID=z_test_wait_right_endstop_poll DURATION=0.01
    UPDATE_DELAYED_GCODE ID=z_test_wait_both_endstops_poll DURATION=0.01

[gcode_macro Y_TEST_ENABLE]
description: Enable the Y-axis manual stepper and set its temporary position to 0.
gcode:
    MANUAL_STEPPER STEPPER=y_axis ENABLE=1 SET_POSITION=0

[gcode_macro Y_TEST_BUZZ]
description: Move the Y-axis a short distance out and back for direction testing.
gcode:
    MANUAL_STEPPER STEPPER=y_axis ENABLE=1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=y_axis MOVE=5 SPEED=20 ACCEL=300
    MANUAL_STEPPER STEPPER=y_axis MOVE=0 SPEED=20 ACCEL=300

[gcode_macro Y_TEST_HOME]
description: Home the Y-axis manual stepper toward its endstop.
gcode:
    MANUAL_STEPPER STEPPER=y_axis ENABLE=1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=y_axis MOVE=-260 SPEED=25 ACCEL=300 STOP_ON_ENDSTOP=1
    MANUAL_STEPPER STEPPER=y_axis SET_POSITION=0

[gcode_macro Y_TEST_DISABLE]
description: Disable the Y-axis manual stepper.
gcode:
    MANUAL_STEPPER STEPPER=y_axis ENABLE=0

[gcode_macro Z_TEST_ENABLE]
description: Enable both Z manual steppers and set their temporary positions to 0.
gcode:
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=1 SET_POSITION=0

[gcode_macro Z_TEST_MOVE_UP_1]
description: Move both Z steppers synchronously upward by 1mm.
gcode:
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_left_axis SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_right_axis SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_left_axis MOVE=1 SPEED=2 ACCEL=20 SYNC=0
    MANUAL_STEPPER STEPPER=z_right_axis MOVE=1 SPEED=2 ACCEL=20

[gcode_macro Z_TEST_MOVE_DOWN_1]
description: Move both Z steppers synchronously downward by 1mm.
gcode:
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_left_axis SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_right_axis SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_left_axis MOVE=-1 SPEED=2 ACCEL=20 SYNC=0
    MANUAL_STEPPER STEPPER=z_right_axis MOVE=-1 SPEED=2 ACCEL=20

[gcode_macro Z_TEST_MOVE_UP_3]
description: Move both Z steppers synchronously upward by 3mm.
gcode:
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_left_axis SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_right_axis SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_left_axis MOVE=3 SPEED=2 ACCEL=20 SYNC=0
    MANUAL_STEPPER STEPPER=z_right_axis MOVE=3 SPEED=2 ACCEL=20

[gcode_macro Z_TEST_MOVE_DOWN_3]
description: Move both Z steppers synchronously downward by 3mm.
gcode:
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_left_axis SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_right_axis SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_left_axis MOVE=-3 SPEED=2 ACCEL=20 SYNC=0
    MANUAL_STEPPER STEPPER=z_right_axis MOVE=-3 SPEED=2 ACCEL=20

[gcode_macro Z_TEST_BUZZ]
description: Move both Z steppers +1mm and back to 0 for direction testing.
gcode:
    Z_TEST_ENABLE
    MANUAL_STEPPER STEPPER=z_left_axis MOVE=1 SPEED=2 ACCEL=20 SYNC=0
    MANUAL_STEPPER STEPPER=z_right_axis MOVE=1 SPEED=2 ACCEL=20
    MANUAL_STEPPER STEPPER=z_left_axis MOVE=0 SPEED=2 ACCEL=20 SYNC=0
    MANUAL_STEPPER STEPPER=z_right_axis MOVE=0 SPEED=2 ACCEL=20

[gcode_macro Z_TEST_DISABLE]
description: Disable both Z manual steppers.
gcode:
    MANUAL_STEPPER STEPPER=z_left_axis SYNC=1
    MANUAL_STEPPER STEPPER=z_right_axis SYNC=1
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=0
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=0

[gcode_macro Z_TEST_QUERY_ENDSTOPS]
description: Report the current Z endstop states.
gcode:
    QUERY_ENDSTOPS
    QUERY_BUTTON BUTTON=z_left_endstop
    QUERY_BUTTON BUTTON=z_right_endstop

[gcode_macro Z_TEST_WAIT_LEFT_ENDSTOP]
description: Arm a no-motion wait for the left Z endstop to be pressed by hand.
variable_waiting: False
gcode:
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_LEFT_ENDSTOP VARIABLE=waiting VALUE=True
    RESPOND TYPE=echo MSG="Armed left Z endstop wait. Press it by hand; no Z motion will be commanded."
    UPDATE_DELAYED_GCODE ID=z_test_wait_left_endstop_poll DURATION=0.1

[delayed_gcode z_test_wait_left_endstop_poll]
gcode:
    {% set waiting = printer["gcode_macro Z_TEST_WAIT_LEFT_ENDSTOP"].waiting %}
    {% set pressed = printer["gcode_button z_left_endstop"].state == "PRESSED" %}
    {% if waiting and pressed %}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_LEFT_ENDSTOP VARIABLE=waiting VALUE=False
        RESPOND TYPE=echo MSG="Left Z endstop wait complete."
    {% elif waiting %}
        UPDATE_DELAYED_GCODE ID=z_test_wait_left_endstop_poll DURATION=0.25
    {% endif %}

[gcode_macro Z_TEST_WAIT_RIGHT_ENDSTOP]
description: Arm a no-motion wait for the right Z endstop to be pressed by hand.
variable_waiting: False
gcode:
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_RIGHT_ENDSTOP VARIABLE=waiting VALUE=True
    RESPOND TYPE=echo MSG="Armed right Z endstop wait. Press it by hand; no Z motion will be commanded."
    UPDATE_DELAYED_GCODE ID=z_test_wait_right_endstop_poll DURATION=0.1

[delayed_gcode z_test_wait_right_endstop_poll]
gcode:
    {% set waiting = printer["gcode_macro Z_TEST_WAIT_RIGHT_ENDSTOP"].waiting %}
    {% set pressed = printer["gcode_button z_right_endstop"].state == "PRESSED" %}
    {% if waiting and pressed %}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_RIGHT_ENDSTOP VARIABLE=waiting VALUE=False
        RESPOND TYPE=echo MSG="Right Z endstop wait complete."
    {% elif waiting %}
        UPDATE_DELAYED_GCODE ID=z_test_wait_right_endstop_poll DURATION=0.25
    {% endif %}

[gcode_macro Z_TEST_WAIT_BOTH_ENDSTOPS]
description: Arm a no-motion wait until both Z endstops have been pressed by hand.
variable_waiting: False
variable_left_seen: False
variable_right_seen: False
gcode:
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=waiting VALUE=True
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=left_seen VALUE=False
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=right_seen VALUE=False
    RESPOND TYPE=echo MSG="Armed both Z endstop wait. Press left and right by hand in any order; no Z motion will be commanded."
    UPDATE_DELAYED_GCODE ID=z_test_wait_both_endstops_poll DURATION=0.1

[delayed_gcode z_test_wait_both_endstops_poll]
gcode:
    {% set wait = printer["gcode_macro Z_TEST_WAIT_BOTH_ENDSTOPS"] %}
    {% if wait.waiting %}
        {% set left_seen = wait.left_seen or printer["gcode_button z_left_endstop"].state == "PRESSED" %}
        {% set right_seen = wait.right_seen or printer["gcode_button z_right_endstop"].state == "PRESSED" %}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=left_seen VALUE={left_seen}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=right_seen VALUE={right_seen}
        {% if left_seen and right_seen %}
            SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=waiting VALUE=False
            RESPOND TYPE=echo MSG="Both Z endstops have been pressed."
        {% else %}
            UPDATE_DELAYED_GCODE ID=z_test_wait_both_endstops_poll DURATION=0.25
        {% endif %}
    {% endif %}

[gcode_macro Z_TEST_WAIT_CANCEL]
description: Cancel any armed Z endstop wait pollers.
gcode:
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_LEFT_ENDSTOP VARIABLE=waiting VALUE=False
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_RIGHT_ENDSTOP VARIABLE=waiting VALUE=False
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_BOTH_ENDSTOPS VARIABLE=waiting VALUE=False
    UPDATE_DELAYED_GCODE ID=z_test_wait_left_endstop_poll DURATION=0
    UPDATE_DELAYED_GCODE ID=z_test_wait_right_endstop_poll DURATION=0
    UPDATE_DELAYED_GCODE ID=z_test_wait_both_endstops_poll DURATION=0
    RESPOND TYPE=echo MSG="Cancelled Z endstop wait polling."

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[respond]
