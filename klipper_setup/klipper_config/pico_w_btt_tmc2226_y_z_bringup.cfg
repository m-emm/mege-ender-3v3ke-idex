# Temporary real-kinematics right-X + Y + dual-Z config for Raspberry Pi Pico W + BTT TMC2226.
#
# This config exposes the right IDEX carriage as normal Klipper X, plus Y and
# dual-Z, so Mainsail and KlipperScreen can use standard G28 homing and GUI
# jogging. The left IDEX carriage remains a manual stepper until its endstop
# mechanics are fixed and full dual-carriage kinematics are ready.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6633861A3673038-if00
# Alternative for temporary bring-up only:
# serial: /dev/ttyACM0

[mcu x_pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E66368254F174333-if00

[printer]
kinematics: cartesian
max_velocity: 60
max_accel: 300
max_z_velocity: 8
max_z_accel: 30

# Temporary live X rail: right IDEX carriage only. The right endstop is at the
# positive boundary, X=340. X=40 is a temporary lower software limit to avoid the
# current left-carriage collision zone.
[stepper_x]
step_pin: x_pico:gpio7
dir_pin: !x_pico:gpio6
enable_pin: !x_pico:gpio8
microsteps: 16
rotation_distance: 36
endstop_pin: ^x_pico:gpio22
position_endstop: 340
position_min: 40
position_max: 340
homing_positive_dir: true
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 5

# Second Pico X motor bring-up. X-left remains manual until its endstop
# mechanics are fixed. X-right is the temporary live [stepper_x] above.
[manual_stepper x_left]
step_pin: x_pico:gpio11
dir_pin: !x_pico:gpio10
enable_pin: !x_pico:gpio12
microsteps: 16
rotation_distance: 36
velocity: 5
accel: 100
endstop_pin: ^x_pico:gpio4

[tmc2209 manual_stepper x_left]
uart_pin: x_pico:gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 stepper_x]
uart_pin: x_pico:gpio5
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# CR Touch bring-up only. This temporary raw-control mode is used because the
# built-in BLTouch pin_down command alarmed this CR Touch during testing, while
# the same 650us deploy pulse sent through raw PWM deployed cleanly. Z homing
# still uses the independent Z endstops below; do not use this probe for homing,
# safe-Z-home, or bed mesh until the normal [bltouch] path is understood.
[output_pin cr_touch_control]
pin: x_pico:gpio13
pwm: True
cycle_time: 0.020
value: 0
shutdown_value: 0

[gcode_button cr_touch_signal]
pin: ^x_pico:gpio14
press_gcode:
    RESPOND TYPE=echo MSG="CR Touch raw signal TRIGGERED"
    M117 CR Touch raw TRIGGERED
release_gcode:
    RESPOND TYPE=echo MSG="CR Touch raw signal open"

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 1:
# STEP=GPIO11, DIR=GPIO10, EN=GPIO12, UART=GPIO9, endstop=GPIO4.
[stepper_y]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 60
endstop_pin: ^!gpio4
position_endstop: 0
position_min: 0
position_max: 310
homing_positive_dir: false
homing_speed: 25
second_homing_speed: 10
homing_retract_dist: 5

# BTT TMC2226 V1.0 uses the tmc2209 driver in Klipper.
[tmc2209 stepper_y]
uart_pin: gpio9
uart_address: 0
run_current: 1.4
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 2:
# STEP=GPIO7, DIR=GPIO6, EN=GPIO8, UART=GPIO5, endstop=GPIO22.
[stepper_z]
step_pin: gpio7
dir_pin: gpio6
enable_pin: !gpio8
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio22
position_endstop: 295
position_min: 0
position_max: 295
homing_positive_dir: true
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: gpio5
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 3:
# STEP=GPIO14, DIR=GPIO15, EN=GPIO16, UART=GPIO13, endstop=GPIO17.
[stepper_z1]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio17

[tmc2209 stepper_z1]
uart_pin: gpio13
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Normal GUI homing support for temporary right-X, Y, and dual-Z.
#
# - G28 or "home all" homes right-X first, then homes Y and Z.
# - G28 X homes the real right-X carriage to the right endstop at X=340.
# - G28 Y homes the real Y axis.
# - G28 Z homes both real Z motors against their independent endstops.
[homing_override]
axes: xyz
gcode:
    {% set home_all = params.X is not defined and params.Y is not defined and params.Z is not defined %}
    {% set home_x = home_all or params.X is defined %}
    {% set home_y = home_all or params.Y is defined %}
    {% set home_z = home_all or params.Z is defined %}

    {% if home_x %}
        G28 X
    {% endif %}
    {% if home_y %}
        G28 Y
    {% endif %}
    {% if home_z %}
        G28 Z
    {% endif %}

[gcode_macro YZ_QUERY_ENDSTOPS]
description: Report the current Y and dual-Z endstop states.
gcode:
    QUERY_ENDSTOPS

[gcode_macro X_QUERY_ENDSTOPS]
description: Report the current X endstop states.
gcode:
    QUERY_ENDSTOPS

[gcode_macro _X_ENDSTOP_WAIT_STATE]
variable_wait_left: 0
variable_wait_right: 0
gcode:

[gcode_macro X_WAIT_LEFT_ENDSTOP]
description: Wait until the X-left NC endstop triggers.
gcode:
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=1
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=0
    RESPOND TYPE=echo MSG="Waiting for X-left endstop trigger..."
    M117 Waiting X-left endstop
    QUERY_ENDSTOPS
    UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0.25

[gcode_macro X_WAIT_RIGHT_ENDSTOP]
description: Wait until the X-right NC endstop triggers.
gcode:
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=0
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=1
    RESPOND TYPE=echo MSG="Waiting for X-right endstop trigger..."
    M117 Waiting X-right endstop
    QUERY_ENDSTOPS
    UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0.25

[gcode_macro X_WAIT_BOTH_ENDSTOPS]
description: Wait until both X NC endstops trigger.
gcode:
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=1
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=1
    RESPOND TYPE=echo MSG="Waiting for both X endstops to trigger..."
    M117 Waiting X endstops
    QUERY_ENDSTOPS
    UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0.25

[gcode_macro X_CANCEL_ENDSTOP_WAIT]
description: Cancel the active X endstop wait test.
gcode:
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=0
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=0
    UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0
    RESPOND TYPE=echo MSG="X endstop wait cancelled."
    M117 X endstop wait cancelled

[delayed_gcode _X_ENDSTOP_WAIT_POLL]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _X_ENDSTOP_WAIT_STATE"] %}
    {% set wait_left = state.wait_left|int %}
    {% set wait_right = state.wait_right|int %}
    {% if not wait_left and not wait_right %}
        UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0
    {% else %}
        {% set queried = printer.query_endstops.last_query %}
        {% set left_triggered = queried.get("manual_stepper x_left", 0)|int != 0 %}
        {% set right_triggered = queried.get("stepper_x", 0)|int != 0 %}
        {% set left_done = (not wait_left) or left_triggered %}
        {% set right_done = (not wait_right) or right_triggered %}
        {% if left_done and right_done %}
            {% if wait_left and wait_right %}
                RESPOND TYPE=echo MSG="X-left and X-right endstops TRIGGERED"
                M117 X endstops TRIGGERED
            {% elif wait_left %}
                RESPOND TYPE=echo MSG="X-left endstop TRIGGERED"
                M117 X-left endstop TRIGGERED
            {% else %}
                RESPOND TYPE=echo MSG="X-right endstop TRIGGERED"
                M117 X-right endstop TRIGGERED
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=0
            SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=0
            UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0
        {% else %}
            QUERY_ENDSTOPS
            UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0.25
        {% endif %}
    {% endif %}

[gcode_macro X_LEFT_MOTOR_LEFT]
description: Move only the left X manual stepper left by 2mm.
gcode:
    MANUAL_STEPPER STEPPER=x_left ENABLE=1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=x_left MOVE=-2 SPEED=5 ACCEL=100

[gcode_macro X_LEFT_MOTOR_RIGHT]
description: Move only the left X manual stepper right by 2mm.
gcode:
    MANUAL_STEPPER STEPPER=x_left ENABLE=1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=x_left MOVE=2 SPEED=5 ACCEL=100

[gcode_macro X_MANUAL_MOTORS_OFF]
description: Disable the left manual X bring-up stepper and temporary live right-X motor.
gcode:
    MANUAL_STEPPER STEPPER=x_left ENABLE=0
    M84 X

[gcode_macro CR_TOUCH_DEPLOY]
description: Send a raw CR Touch deploy pulse. Optional WIDTH_US defaults to 650.
gcode:
    {% set width_us = params.WIDTH_US|default(650)|float %}
    {% set hold_ms = params.HOLD_MS|default(1200)|float %}
    {% set duty = width_us / 20000.0 %}
    SET_PIN PIN=cr_touch_control VALUE={duty}
    G4 P{hold_ms}
    SET_PIN PIN=cr_touch_control VALUE=0
    RESPOND TYPE=echo MSG="CR Touch raw deploy pulse sent: {width_us|round(0)}us"
    M117 CR Touch {width_us|round(0)}us

[gcode_macro CR_TOUCH_DEPLOY_650]
description: Send a 650us raw CR Touch deploy pulse.
gcode:
    CR_TOUCH_DEPLOY WIDTH_US=650

[gcode_macro CR_TOUCH_DEPLOY_750]
description: Send a 750us raw CR Touch deploy pulse.
gcode:
    CR_TOUCH_DEPLOY WIDTH_US=750

[gcode_macro CR_TOUCH_DEPLOY_900]
description: Send a 900us raw CR Touch deploy pulse.
gcode:
    CR_TOUCH_DEPLOY WIDTH_US=900

[gcode_macro CR_TOUCH_DEPLOY_1000]
description: Send a 1000us raw CR Touch deploy pulse.
gcode:
    CR_TOUCH_DEPLOY WIDTH_US=1000

[gcode_macro CR_TOUCH_STOW]
description: Send a raw CR Touch stow pulse.
gcode:
    SET_PIN PIN=cr_touch_control VALUE=0.07375
    G4 P1200
    SET_PIN PIN=cr_touch_control VALUE=0
    RESPOND TYPE=echo MSG="CR Touch raw stow pulse sent: 1475us"
    M117 CR Touch stowed

[gcode_macro CR_TOUCH_TOUCH_MODE]
description: Send the raw CR Touch touch-mode pulse and report signal state.
gcode:
    SET_PIN PIN=cr_touch_control VALUE=0.05825
    G4 P1200
    SET_PIN PIN=cr_touch_control VALUE=0
    QUERY_BUTTON BUTTON=cr_touch_signal
    UPDATE_DELAYED_GCODE ID=_CR_TOUCH_REPORT_QUERY DURATION=0.10
    RESPOND TYPE=echo MSG="CR Touch raw touch-mode pulse sent: 1165us. Trigger the pin by hand, then run CR_TOUCH_QUERY."
    M117 CR Touch touch mode

# Do not use touch-mode inside the deploy-and-wait helper. During 2026-05-31
# bring-up it made the wait report an immediate trigger. The wait helper polls
# the raw Z signal after deploy instead, and reset+stows after a trigger.
[gcode_macro CR_TOUCH_RESET]
description: Reset the CR Touch after an error or interrupted test.
gcode:
    SET_GCODE_VARIABLE MACRO=_CR_TOUCH_WAIT_STATE VARIABLE=wait_trigger VALUE=0
    UPDATE_DELAYED_GCODE ID=_CR_TOUCH_WAIT_POLL DURATION=0
    SET_PIN PIN=cr_touch_control VALUE=0.1095
    G4 P1200
    SET_PIN PIN=cr_touch_control VALUE=0
    RESPOND TYPE=echo MSG="CR Touch raw reset pulse sent: 2190us"
    M117 CR Touch reset

[gcode_macro CR_TOUCH_SELF_TEST]
description: Run the CR Touch built-in self-test.
gcode:
    SET_GCODE_VARIABLE MACRO=_CR_TOUCH_WAIT_STATE VARIABLE=wait_trigger VALUE=0
    UPDATE_DELAYED_GCODE ID=_CR_TOUCH_WAIT_POLL DURATION=0
    SET_PIN PIN=cr_touch_control VALUE=0.089
    G4 P1200
    SET_PIN PIN=cr_touch_control VALUE=0
    RESPOND TYPE=echo MSG="CR Touch raw self-test pulse sent: 1780us"
    M117 CR Touch self-test

[gcode_macro CR_TOUCH_QUERY]
description: Query and display the current CR Touch probe signal.
gcode:
    QUERY_BUTTON BUTTON=cr_touch_signal
    UPDATE_DELAYED_GCODE ID=_CR_TOUCH_REPORT_QUERY DURATION=0.10

[delayed_gcode _CR_TOUCH_REPORT_QUERY]
initial_duration: 0
gcode:
    {% if printer["gcode_button cr_touch_signal"].state == "PRESSED" %}
        RESPOND TYPE=echo MSG="CR Touch probe TRIGGERED"
        M117 CR Touch TRIGGERED
    {% else %}
        RESPOND TYPE=echo MSG="CR Touch probe open"
        M117 CR Touch open
    {% endif %}

[gcode_macro _CR_TOUCH_WAIT_STATE]
variable_wait_trigger: 0
gcode:

[gcode_macro CR_TOUCH_WAIT_TRIGGER]
description: Deploy the CR Touch with a raw pulse and wait until its probe signal triggers.
gcode:
    {% set width_us = params.WIDTH_US|default(650)|float %}
    SET_GCODE_VARIABLE MACRO=_CR_TOUCH_WAIT_STATE VARIABLE=wait_trigger VALUE=1
    RESPOND TYPE=echo MSG="Waiting for CR Touch probe trigger after {width_us|round(0)}us deploy pulse..."
    M117 Waiting CR Touch
    CR_TOUCH_DEPLOY WIDTH_US={width_us}
    QUERY_BUTTON BUTTON=cr_touch_signal
    UPDATE_DELAYED_GCODE ID=_CR_TOUCH_WAIT_POLL DURATION=0.25

[gcode_macro CR_TOUCH_CANCEL_WAIT]
description: Cancel the active CR Touch wait test and stow the probe.
gcode:
    SET_GCODE_VARIABLE MACRO=_CR_TOUCH_WAIT_STATE VARIABLE=wait_trigger VALUE=0
    UPDATE_DELAYED_GCODE ID=_CR_TOUCH_WAIT_POLL DURATION=0
    CR_TOUCH_STOW
    RESPOND TYPE=echo MSG="CR Touch wait cancelled."
    M117 CR Touch wait cancelled

[delayed_gcode _CR_TOUCH_WAIT_POLL]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _CR_TOUCH_WAIT_STATE"] %}
    {% if not state.wait_trigger|int %}
        UPDATE_DELAYED_GCODE ID=_CR_TOUCH_WAIT_POLL DURATION=0
    {% elif printer["gcode_button cr_touch_signal"].state == "PRESSED" %}
        RESPOND TYPE=echo MSG="CR Touch probe TRIGGERED"
        M117 CR Touch TRIGGERED
        CR_TOUCH_RESET
        CR_TOUCH_STOW
        SET_GCODE_VARIABLE MACRO=_CR_TOUCH_WAIT_STATE VARIABLE=wait_trigger VALUE=0
        UPDATE_DELAYED_GCODE ID=_CR_TOUCH_WAIT_POLL DURATION=0
    {% else %}
        QUERY_BUTTON BUTTON=cr_touch_signal
        UPDATE_DELAYED_GCODE ID=_CR_TOUCH_WAIT_POLL DURATION=0.25
    {% endif %}

[gcode_macro Y_TEST_TRAVEL_100]
description: Run three 100mm Y travel cycles at 550mm/s and 4500mm/s^2, then re-home Y.
gcode:
    {% set distance = 100.0 %}
    {% set cycles = 3 %}
    {% set test_velocity = 550.0 %}
    {% set test_accel = 4500.0 %}
    {% set test_scv = 11.0 %}
    {% set verify_velocity = 20.0 %}
    {% set verify_accel = 500.0 %}
    {% set y = printer.toolhead.position.y|float %}
    {% set y_min = printer.toolhead.axis_minimum.y|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    {% set old_velocity = printer.toolhead.max_velocity|float %}
    {% set old_accel = printer.toolhead.max_accel|float %}
    {% set old_scv = printer.toolhead.square_corner_velocity|float %}
    {% if "y" not in printer.toolhead.homed_axes %}
        { action_raise_error("Home Y first with G28 Y before running Y_TEST_TRAVEL_100.") }
    {% elif y + distance <= y_max %}
        {% set target = y + distance %}
    {% elif y - distance >= y_min %}
        {% set target = y - distance %}
    {% else %}
        { action_raise_error("Y_TEST_TRAVEL_100 needs 100mm free travel from the current Y position.") }
    {% endif %}
    {% if y >= target %}
        {% set verify_start = y %}
    {% else %}
        {% set verify_start = target %}
    {% endif %}
    RESPOND TYPE=echo MSG="Y travel test: {cycles} cycles from Y={y|round(2)} to Y={target|round(2)} at 550mm/s, accel 8000mm/s^2, SCV 11."
    SAVE_GCODE_STATE NAME=Y_TEST_TRAVEL_100_STATE
    G90
    SET_VELOCITY_LIMIT VELOCITY={test_velocity} ACCEL={test_accel} SQUARE_CORNER_VELOCITY={test_scv}
    {% for _ in range(cycles) %}
        G1 Y{target} F{test_velocity * 60.0}
        G1 Y{y} F{test_velocity * 60.0}
    {% endfor %}
    M400
    G1 Y{verify_start} F{test_velocity * 60.0}
    M400
    RESPOND TYPE=echo MSG="Y travel test: slowly re-homing Y from Y={verify_start|round(2)}. The Y endstop must stop this move."
    SET_VELOCITY_LIMIT VELOCITY={verify_velocity} ACCEL={verify_accel} SQUARE_CORNER_VELOCITY={old_scv}
    G28 Y
    SET_VELOCITY_LIMIT VELOCITY={old_velocity} ACCEL={old_accel} SQUARE_CORNER_VELOCITY={old_scv}
    RESTORE_GCODE_STATE NAME=Y_TEST_TRAVEL_100_STATE

[gcode_macro MOTORS_OFF]
description: Disable all configured motors.
gcode:
    M84

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[respond]
