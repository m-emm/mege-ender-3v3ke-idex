# Temporary real-kinematics Y + dual-Z config for Raspberry Pi Pico W + BTT TMC2226.
#
# This config exposes Y and dual-Z as normal Klipper axes so Mainsail and
# KlipperScreen can use standard G28 homing. There is no physical X axis in this
# stage, so stepper_x is a harmless placeholder on currently unused Pico pins.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6633861A3673038-if00
# Alternative for temporary bring-up only:
# serial: /dev/ttyACM0

[printer]
kinematics: cartesian
max_velocity: 60
max_accel: 300
max_z_velocity: 8
max_z_accel: 30

# Placeholder X rail: required by cartesian kinematics, not physically connected.
# Do not connect a driver to these pins while this placeholder is active.
[stepper_x]
step_pin: gpio18
dir_pin: gpio19
enable_pin: !gpio20
microsteps: 16
rotation_distance: 40
endstop_pin: ^!gpio27
position_endstop: 0
position_max: 1
homing_speed: 5

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 1:
# STEP=GPIO11, DIR=GPIO10, EN=GPIO12, UART=GPIO9, endstop=GPIO4.
[stepper_y]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: ^!gpio4
position_endstop: 0
position_max: 235
homing_speed: 25
second_homing_speed: 10
homing_retract_dist: 5

# BTT TMC2226 V1.0 uses the tmc2209 driver in Klipper.
[tmc2209 stepper_y]
uart_pin: gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 2:
# STEP=GPIO7, DIR=GPIO6, EN=GPIO8, UART=GPIO5, endstop=GPIO22.
[stepper_z]
step_pin: gpio7
dir_pin: gpio6
enable_pin: !gpio8
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio22
position_endstop: 250
position_min: 0
position_max: 250
homing_positive_dir: true
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: gpio5
uart_address: 0
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 3:
# STEP=GPIO14, DIR=GPIO15, EN=GPIO16, UART=GPIO13, endstop=GPIO17.
[stepper_z1]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio17

[tmc2209 stepper_z1]
uart_pin: gpio13
uart_address: 0
run_current: 1.1
sense_resistor: 0.110
stealthchop_threshold: 0

# Normal GUI homing support without a physical X axis.
#
# - G28 or "home all" marks the placeholder X as homed, then homes Y and Z.
# - G28 Y homes the real Y axis.
# - G28 Z homes both real Z motors against their independent endstops.
# - G28 X only marks the placeholder X as homed; it does not move anything.
[homing_override]
axes: xyz
set_position_x: 0
gcode:
    {% set home_all = params.X is not defined and params.Y is not defined and params.Z is not defined %}
    {% set home_y = home_all or params.Y is defined %}
    {% set home_z = home_all or params.Z is defined %}

    {% if home_y %}
        G28 Y
    {% endif %}
    {% if home_z %}
        G28 Z
    {% endif %}
    {% if not home_y and not home_z %}
        RESPOND TYPE=echo MSG="No physical X axis configured; marked placeholder X as homed."
    {% endif %}

[gcode_macro YZ_QUERY_ENDSTOPS]
description: Report the current Y and dual-Z endstop states.
gcode:
    QUERY_ENDSTOPS

[gcode_macro MOTORS_OFF]
description: Disable all configured motors.
gcode:
    M84

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[respond]
