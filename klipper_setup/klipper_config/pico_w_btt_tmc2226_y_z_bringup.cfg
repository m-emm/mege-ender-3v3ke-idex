# Conservative IDEX motion bring-up config for Raspberry Pi Pico W + BTT TMC2226.
#
# This config exposes X-left as Klipper carriage 0 ([stepper_x]) and X-right as
# Klipper carriage 1 ([dual_carriage]), plus the proven Y and independent
# dual-Z axes. It also brings up the left Nitehawk toolhead board with the
# calibrated left hotend/extruder, and enables the heatbed on the Y/Z Pico.
# Toolchanging, copy/mirror printing, and the second extruder are intentionally
# deferred until bring-up checks are proven.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6633861A3673038-if00
# Alternative for temporary bring-up only:
# serial: /dev/ttyACM0

[mcu x_pico]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E66368254F174333-if00

[mcu nitehawk]
# Left toolhead Nitehawk 36. The board presents its RP2040 through the
# Nitehawk's internal USB hub, so the by-id path is the stable identifier.
serial: /dev/serial/by-id/usb-Klipper_rp2040_30333938340637C1-if00

[printer]
kinematics: cartesian
max_velocity: 60
max_accel: 300
max_z_velocity: 8
max_z_accel: 30

# Custom thermistor calibration for the left Micro Swiss FlowTech toolhead.
# Reused from toolhead_nitehawk_and_x_axis.cfg for the same hotend assembly.
[thermistor microswiss_calibrated]
temperature1: 35.0
resistance1: 49410
temperature2: 96.0
resistance2: 5238
temperature3: 160.0
resistance3: 909

# Left toolhead extruder on the Nitehawk.
[extruder]
step_pin: nitehawk:gpio23
dir_pin: !nitehawk:gpio24
enable_pin: !nitehawk:gpio25
microsteps: 16
rotation_distance: 7.33
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nitehawk:gpio9
sensor_type: microswiss_calibrated
sensor_pin: nitehawk:gpio29
pullup_resistor: 2200
control: pid
pid_Kp: 31.708
pid_Ki: 2.578
pid_Kd: 97.504
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150.0

[tmc2209 extruder]
uart_pin: nitehawk:gpio0
tx_pin: nitehawk:gpio1
uart_address: 0
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 999999

# Left toolhead part cooling fan.
[fan]
pin: nitehawk:gpio6

# Left hotend heatsink fan.
[heater_fan left_hotend_fan]
pin: nitehawk:gpio5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
tachometer_pin: nitehawk:gpio16

# Primary IDEX carriage: X-left. Homes to the left-mounted endstop at X=0.
[stepper_x]
step_pin: x_pico:gpio11
dir_pin: !x_pico:gpio10
enable_pin: !x_pico:gpio12
microsteps: 16
rotation_distance: 36
endstop_pin: ^x_pico:gpio4
position_endstop: 0
position_min: 0
position_max: 300
homing_positive_dir: false
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 5

# Secondary IDEX carriage: X-right. Homes to the right-mounted endstop at X=340.
[dual_carriage]
axis: x
step_pin: x_pico:gpio7
dir_pin: !x_pico:gpio6
enable_pin: !x_pico:gpio8
microsteps: 16
rotation_distance: 36
endstop_pin: ^x_pico:gpio22
position_endstop: 340
position_min: 15
position_max: 340
homing_positive_dir: true
homing_speed: 10
second_homing_speed: 3
homing_retract_dist: 5
safe_distance: 10

[tmc2209 stepper_x]
uart_pin: x_pico:gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

[tmc2209 dual_carriage]
uart_pin: x_pico:gpio5
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 1:
# STEP=GPIO11, DIR=GPIO10, EN=GPIO12, UART=GPIO9, endstop=GPIO4.
[stepper_y]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 60
endstop_pin: ^!gpio4
position_endstop: 0
position_min: 0
position_max: 310
homing_positive_dir: false
homing_speed: 25
second_homing_speed: 10
homing_retract_dist: 5

# BTT TMC2226 V1.0 uses the tmc2209 driver in Klipper.
[tmc2209 stepper_y]
uart_pin: gpio9
uart_address: 0
run_current: 1.4
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 2:
# STEP=GPIO7, DIR=GPIO6, EN=GPIO8, UART=GPIO5, endstop=GPIO22.
[stepper_z]
step_pin: gpio7
dir_pin: gpio6
enable_pin: !gpio8
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio22
position_endstop: 295
position_min: 0
position_max: 295
homing_positive_dir: true
homing_speed: 5
second_homing_speed: 2
homing_retract_dist: 3

[tmc2209 stepper_z]
uart_pin: gpio5
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 3:
# STEP=GPIO14, DIR=GPIO15, EN=GPIO16, UART=GPIO13, endstop=GPIO17.
[stepper_z1]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio17

[tmc2209 stepper_z1]
uart_pin: gpio13
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Heatbed wiring follows pico_w_btt_tmc2226_y_z.yaml:
# MOSFET control on gpio21 and 100k B3950 NTC on gpio26 / ADC0.
[heater_bed]
heater_pin: gpio21
sensor_type: Generic 3950
sensor_pin: gpio26
pullup_resistor: 4700
control: pid
pid_Kp: 60.731
pid_Ki: 1.140
pid_Kd: 808.481
min_temp: 0
max_temp: 130

# Normal GUI homing support for IDEX X, Y, and dual-Z.
#
# - G28 or "home all" homes both X carriages first, then homes Y and Z.
# - G28 X homes X-left to X=0 and X-right to X=340.
# - G28 Y homes the real Y axis.
# - G28 Z homes both real Z motors against their independent endstops.
[homing_override]
axes: xyz
gcode:
    {% set home_all = params.X is not defined and params.Y is not defined and params.Z is not defined %}
    {% set home_x = home_all or params.X is defined %}
    {% set home_y = home_all or params.Y is defined %}
    {% set home_z = home_all or params.Z is defined %}

    {% if home_x %}
        G28 X
    {% endif %}
    {% if home_y %}
        G28 Y
    {% endif %}
    {% if home_z %}
        G28 Z
    {% endif %}

[gcode_macro YZ_QUERY_ENDSTOPS]
description: Report the current Y and dual-Z endstop states.
gcode:
    QUERY_ENDSTOPS

[gcode_macro X_QUERY_ENDSTOPS]
description: Report the current X endstop states.
gcode:
    QUERY_ENDSTOPS

[gcode_macro _X_ENDSTOP_WAIT_STATE]
variable_wait_left: 0
variable_wait_right: 0
gcode:

[gcode_macro X_WAIT_LEFT_ENDSTOP]
description: Wait until the X-left NC endstop triggers.
gcode:
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=1
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=0
    RESPOND TYPE=echo MSG="Waiting for X-left endstop trigger..."
    M117 Waiting X-left endstop
    QUERY_ENDSTOPS
    UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0.25

[gcode_macro X_WAIT_RIGHT_ENDSTOP]
description: Wait until the X-right NC endstop triggers.
gcode:
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=0
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=1
    RESPOND TYPE=echo MSG="Waiting for X-right endstop trigger..."
    M117 Waiting X-right endstop
    QUERY_ENDSTOPS
    UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0.25

[gcode_macro X_WAIT_BOTH_ENDSTOPS]
description: Wait until both X NC endstops trigger.
gcode:
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=1
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=1
    RESPOND TYPE=echo MSG="Waiting for both X endstops to trigger..."
    M117 Waiting X endstops
    QUERY_ENDSTOPS
    UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0.25

[gcode_macro X_CANCEL_ENDSTOP_WAIT]
description: Cancel the active X endstop wait test.
gcode:
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=0
    SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=0
    UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0
    RESPOND TYPE=echo MSG="X endstop wait cancelled."
    M117 X endstop wait cancelled

[delayed_gcode _X_ENDSTOP_WAIT_POLL]
initial_duration: 0
gcode:
    {% set state = printer["gcode_macro _X_ENDSTOP_WAIT_STATE"] %}
    {% set wait_left = state.wait_left|int %}
    {% set wait_right = state.wait_right|int %}
    {% if not wait_left and not wait_right %}
        UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0
    {% else %}
        {% set queried = printer.query_endstops.last_query %}
        {% set left_triggered = queried.get("stepper_x", 0)|int != 0 %}
        {% set right_triggered = queried.get("dual_carriage", 0)|int != 0 %}
        {% set left_done = (not wait_left) or left_triggered %}
        {% set right_done = (not wait_right) or right_triggered %}
        {% if left_done and right_done %}
            {% if wait_left and wait_right %}
                RESPOND TYPE=echo MSG="X-left and X-right endstops TRIGGERED"
                M117 X endstops TRIGGERED
            {% elif wait_left %}
                RESPOND TYPE=echo MSG="X-left endstop TRIGGERED"
                M117 X-left endstop TRIGGERED
            {% else %}
                RESPOND TYPE=echo MSG="X-right endstop TRIGGERED"
                M117 X-right endstop TRIGGERED
            {% endif %}
            SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_left VALUE=0
            SET_GCODE_VARIABLE MACRO=_X_ENDSTOP_WAIT_STATE VARIABLE=wait_right VALUE=0
            UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0
        {% else %}
            QUERY_ENDSTOPS
            UPDATE_DELAYED_GCODE ID=_X_ENDSTOP_WAIT_POLL DURATION=0.25
        {% endif %}
    {% endif %}

[gcode_macro IDEX_HOME_X]
description: Home both IDEX X carriages, then select and park the left carriage.
gcode:
    G28 X
    IDEX_SELECT_LEFT

[gcode_macro IDEX_SELECT_LEFT]
description: Park X-right, activate X-left as the primary carriage, and park X-left.
gcode:
    {% if "x" not in printer.toolhead.homed_axes %}
        { action_raise_error("Home X first with G28 X or IDEX_HOME_X.") }
    {% endif %}
    SAVE_GCODE_STATE NAME=IDEX_SELECT_LEFT_STATE
    G90
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X340 F600
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X0 F600
    RESTORE_GCODE_STATE NAME=IDEX_SELECT_LEFT_STATE
    RESPOND TYPE=echo MSG="IDEX active carriage: X-left"
    M117 IDEX X-left active

[gcode_macro IDEX_SELECT_RIGHT]
description: Park X-left, activate X-right as the primary carriage, and park X-right.
gcode:
    {% if "x" not in printer.toolhead.homed_axes %}
        { action_raise_error("Home X first with G28 X or IDEX_HOME_X.") }
    {% endif %}
    SAVE_GCODE_STATE NAME=IDEX_SELECT_RIGHT_STATE
    G90
    SET_DUAL_CARRIAGE CARRIAGE=0 MODE=PRIMARY
    G1 X0 F600
    SET_DUAL_CARRIAGE CARRIAGE=1 MODE=PRIMARY
    G1 X340 F600
    RESTORE_GCODE_STATE NAME=IDEX_SELECT_RIGHT_STATE
    RESPOND TYPE=echo MSG="IDEX active carriage: X-right"
    M117 IDEX X-right active

[gcode_macro X_MOTORS_OFF]
description: Disable both configured X carriage motors.
gcode:
    M84 X

[gcode_macro Y_TEST_TRAVEL_100]
description: Run three 100mm Y travel cycles at 550mm/s and 4500mm/s^2, then re-home Y.
gcode:
    {% set distance = 100.0 %}
    {% set cycles = 3 %}
    {% set test_velocity = 550.0 %}
    {% set test_accel = 4500.0 %}
    {% set test_scv = 11.0 %}
    {% set verify_velocity = 20.0 %}
    {% set verify_accel = 500.0 %}
    {% set y = printer.toolhead.position.y|float %}
    {% set y_min = printer.toolhead.axis_minimum.y|float %}
    {% set y_max = printer.toolhead.axis_maximum.y|float %}
    {% set old_velocity = printer.toolhead.max_velocity|float %}
    {% set old_accel = printer.toolhead.max_accel|float %}
    {% set old_scv = printer.toolhead.square_corner_velocity|float %}
    {% if "y" not in printer.toolhead.homed_axes %}
        { action_raise_error("Home Y first with G28 Y before running Y_TEST_TRAVEL_100.") }
    {% elif y + distance <= y_max %}
        {% set target = y + distance %}
    {% elif y - distance >= y_min %}
        {% set target = y - distance %}
    {% else %}
        { action_raise_error("Y_TEST_TRAVEL_100 needs 100mm free travel from the current Y position.") }
    {% endif %}
    {% if y >= target %}
        {% set verify_start = y %}
    {% else %}
        {% set verify_start = target %}
    {% endif %}
    RESPOND TYPE=echo MSG="Y travel test: {cycles} cycles from Y={y|round(2)} to Y={target|round(2)} at 550mm/s, accel 4500mm/s^2, SCV 11."
    SAVE_GCODE_STATE NAME=Y_TEST_TRAVEL_100_STATE
    G90
    SET_VELOCITY_LIMIT VELOCITY={test_velocity} ACCEL={test_accel} SQUARE_CORNER_VELOCITY={test_scv}
    {% for _ in range(cycles) %}
        G1 Y{target} F{test_velocity * 60.0}
        G1 Y{y} F{test_velocity * 60.0}
    {% endfor %}
    M400
    G1 Y{verify_start} F{test_velocity * 60.0}
    M400
    RESPOND TYPE=echo MSG="Y travel test: slowly re-homing Y from Y={verify_start|round(2)}. The Y endstop must stop this move."
    SET_VELOCITY_LIMIT VELOCITY={verify_velocity} ACCEL={verify_accel} SQUARE_CORNER_VELOCITY={old_scv}
    G28 Y
    SET_VELOCITY_LIMIT VELOCITY={old_velocity} ACCEL={old_accel} SQUARE_CORNER_VELOCITY={old_scv}
    RESTORE_GCODE_STATE NAME=Y_TEST_TRAVEL_100_STATE

[gcode_macro MOTORS_OFF]
description: Disable all configured motors.
gcode:
    M84

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[respond]
