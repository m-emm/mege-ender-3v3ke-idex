# Y + dual-Z bring-up config for Raspberry Pi Pico W + BTT TMC2226.
#
# This is a non-printing test config for the rewired Pico controller. It keeps
# the working Y-axis manual stepper behavior and adds tiny synchronized dual-Z
# debug moves plus manual Z endstop checks. Do not use this for printing.

[mcu]
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6633861A3673038-if00
# Alternative for temporary bring-up only:
# serial: /dev/ttyACM0

[printer]
kinematics: none
max_velocity: 1
max_accel: 1

# The Z endstop pins are intentionally read both as manual-stepper endstops
# for QUERY_ENDSTOPS and as gcode_buttons for wait-style debug macros.
[duplicate_pin_override]
pins: gpio22, gpio17

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 1:
# STEP=GPIO11, DIR=GPIO10, EN=GPIO12, UART=GPIO9, endstop=GPIO4.
[manual_stepper y_axis]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: ^!gpio4

# BTT TMC2226 V1.0 uses the tmc2209 driver in Klipper.
[tmc2209 manual_stepper y_axis]
uart_pin: gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 2:
# STEP=GPIO7, DIR=GPIO6, EN=GPIO8, UART=GPIO5, endstop=GPIO22.
[manual_stepper z_left_axis]
step_pin: gpio7
dir_pin: gpio6
enable_pin: !gpio8
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio22

[tmc2209 manual_stepper z_left_axis]
uart_pin: gpio5
uart_address: 0
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

# Wiring follows pico_w_btt_tmc2226_y_z.yaml, Driver 3:
# STEP=GPIO14, DIR=GPIO15, EN=GPIO16, UART=GPIO13, endstop=GPIO17.
[manual_stepper z_right_axis]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio17

[tmc2209 manual_stepper z_right_axis]
uart_pin: gpio13
uart_address: 0
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

[gcode_button z_left_endstop]
pin: ^!gpio22
press_gcode:
    Z_TEST_ENDSTOP_PRESSED SIDE=LEFT
release_gcode:
    RESPOND TYPE=echo MSG="Z left endstop released"

[gcode_button z_right_endstop]
pin: ^!gpio17
press_gcode:
    Z_TEST_ENDSTOP_PRESSED SIDE=RIGHT
release_gcode:
    RESPOND TYPE=echo MSG="Z right endstop released"

[gcode_macro Y_TEST_ENABLE]
description: Enable the Y-axis manual stepper and set its temporary position to 0.
gcode:
    MANUAL_STEPPER STEPPER=y_axis ENABLE=1 SET_POSITION=0

[gcode_macro Y_TEST_BUZZ]
description: Move the Y-axis a short distance out and back for direction testing.
gcode:
    MANUAL_STEPPER STEPPER=y_axis ENABLE=1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=y_axis MOVE=5 SPEED=20 ACCEL=300
    MANUAL_STEPPER STEPPER=y_axis MOVE=0 SPEED=20 ACCEL=300

[gcode_macro Y_TEST_HOME]
description: Home the Y-axis manual stepper toward its endstop.
gcode:
    MANUAL_STEPPER STEPPER=y_axis ENABLE=1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=y_axis MOVE=-260 SPEED=25 ACCEL=300 STOP_ON_ENDSTOP=1
    MANUAL_STEPPER STEPPER=y_axis SET_POSITION=0

[gcode_macro Y_TEST_DISABLE]
description: Disable the Y-axis manual stepper.
gcode:
    MANUAL_STEPPER STEPPER=y_axis ENABLE=0

[gcode_macro Z_TEST_ENABLE]
description: Enable both Z manual steppers and set their temporary positions to 0.
gcode:
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=1 SET_POSITION=0
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=1 SET_POSITION=0

[gcode_macro Z_TEST_MOVE]
description: Move both Z steppers synchronously to DIST, limited to +/-3mm.
gcode:
    {% set distance = params.DIST|default(1)|float %}
    {% if distance|abs > 3.0 %}
        { action_raise_error("Z_TEST_MOVE DIST must be between -3 and 3 mm.") }
    {% endif %}
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=1
    MANUAL_STEPPER STEPPER=z_left_axis MOVE={distance} SPEED=2 ACCEL=20 SYNC=0
    MANUAL_STEPPER STEPPER=z_right_axis MOVE={distance} SPEED=2 ACCEL=20

[gcode_macro Z_TEST_BUZZ]
description: Move both Z steppers +1mm and back to 0 for direction testing.
gcode:
    Z_TEST_ENABLE
    Z_TEST_MOVE DIST=1
    Z_TEST_MOVE DIST=0

[gcode_macro Z_TEST_DISABLE]
description: Disable both Z manual steppers.
gcode:
    MANUAL_STEPPER STEPPER=z_left_axis SYNC=1
    MANUAL_STEPPER STEPPER=z_right_axis SYNC=1
    MANUAL_STEPPER STEPPER=z_left_axis ENABLE=0
    MANUAL_STEPPER STEPPER=z_right_axis ENABLE=0

[gcode_macro Z_TEST_QUERY_ENDSTOPS]
description: Report the current Z endstop states.
gcode:
    QUERY_ENDSTOPS
    QUERY_BUTTON BUTTON=z_left_endstop
    QUERY_BUTTON BUTTON=z_right_endstop

[gcode_macro Z_TEST_ENDSTOP_PRESSED]
description: Internal helper called by Z endstop gcode_buttons.
gcode:
    {% set side = params.SIDE|default("")|upper %}
    {% if side == "LEFT" %}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=left_hit VALUE=True
        RESPOND TYPE=echo MSG="Z left endstop pressed"
    {% elif side == "RIGHT" %}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=right_hit VALUE=True
        RESPOND TYPE=echo MSG="Z right endstop pressed"
    {% else %}
        { action_raise_error("Z_TEST_ENDSTOP_PRESSED requires SIDE=LEFT or SIDE=RIGHT.") }
    {% endif %}
    UPDATE_DELAYED_GCODE ID=z_test_wait_endstop_poll DURATION=0.01

[gcode_macro Z_TEST_WAIT_ENDSTOP]
description: Wait until the requested Z endstop side has been manually pressed.
variable_waiting: "NONE"
variable_left_hit: False
variable_right_hit: False
gcode:
    {% set side = params.SIDE|default("BOTH")|upper %}
    {% if side not in ["LEFT", "RIGHT", "BOTH"] %}
        { action_raise_error("Z_TEST_WAIT_ENDSTOP SIDE must be LEFT, RIGHT, or BOTH.") }
    {% endif %}
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=waiting VALUE="'{side}'"
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=left_hit VALUE=False
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=right_hit VALUE=False
    RESPOND TYPE=echo MSG="Waiting for Z endstop: {side}. Press the switch by hand."
    UPDATE_DELAYED_GCODE ID=z_test_wait_endstop_poll DURATION=0.2

[gcode_macro Z_TEST_WAIT_CANCEL]
description: Cancel an active Z_TEST_WAIT_ENDSTOP poll.
gcode:
    SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=waiting VALUE="'NONE'"
    UPDATE_DELAYED_GCODE ID=z_test_wait_endstop_poll DURATION=0
    RESPOND TYPE=echo MSG="Cancelled Z endstop wait."

[delayed_gcode z_test_wait_endstop_poll]
gcode:
    {% set wait = printer["gcode_macro Z_TEST_WAIT_ENDSTOP"] %}
    {% set waiting = wait.waiting %}
    {% set left_pressed = printer["gcode_button z_left_endstop"].state == "PRESSED" %}
    {% set right_pressed = printer["gcode_button z_right_endstop"].state == "PRESSED" %}
    {% set left_hit = wait.left_hit or left_pressed %}
    {% set right_hit = wait.right_hit or right_pressed %}
    {% if waiting == "NONE" %}
    {% elif waiting == "LEFT" and left_hit %}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=waiting VALUE="'NONE'"
        RESPOND TYPE=echo MSG="Z left endstop test complete."
    {% elif waiting == "RIGHT" and right_hit %}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=waiting VALUE="'NONE'"
        RESPOND TYPE=echo MSG="Z right endstop test complete."
    {% elif waiting == "BOTH" and left_hit and right_hit %}
        SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=waiting VALUE="'NONE'"
        RESPOND TYPE=echo MSG="Both Z endstop tests complete."
    {% else %}
        {% if left_pressed %}
            SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=left_hit VALUE=True
        {% endif %}
        {% if right_pressed %}
            SET_GCODE_VARIABLE MACRO=Z_TEST_WAIT_ENDSTOP VARIABLE=right_hit VALUE=True
        {% endif %}
        UPDATE_DELAYED_GCODE ID=z_test_wait_endstop_poll DURATION=0.2
    {% endif %}

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

[respond]
