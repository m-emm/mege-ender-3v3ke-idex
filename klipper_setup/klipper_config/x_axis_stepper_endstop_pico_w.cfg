# Minimal X-axis bring-up snippet for Raspberry Pi Pico W + TMC2226 driver.
# Include this from your main printer.cfg:
#   [include x_axis_stepper_endstop_pico_w.cfg]
#
# Pin choice follows common RP2040/Klipper practice used by BTT SKR Pico examples:
# - STEP gpio11
# - DIR  gpio10
# - EN   gpio12
# - X endstop gpio4
# - TMC UART gpio9

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 36  # Calibrated: 200mm commanded = 180mm actual
endstop_pin: ^!gpio4
position_endstop: 0
position_max: 235
homing_speed: 50

# BTT TMC2226 V1.0 uses the tmc2209 driver in Klipper
[tmc2209 stepper_x]
uart_pin: gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0  # Disable stealthChop for better high-speed torque

