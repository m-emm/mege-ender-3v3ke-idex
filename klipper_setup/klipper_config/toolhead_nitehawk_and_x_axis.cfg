# Klipper Configuration for IDEX Ender 3V3 KE
# Main board: RP2040-based controller (/dev/ttyACM0)
# Toolhead: Nitehawk 36 (/dev/ttyACM1)
#
# This is the MAIN configuration file with calibrated values.
# Deploy to Pi: ./klipper_setup/klipper_config/install_printer_cfg.sh

#==============================================================================
# MCU Definitions
#==============================================================================

[mcu]
# Main printer controller board (X-axis stepper)
serial: /dev/serial/by-id/usb-Klipper_rp2040_E6633861A3673038-if00
# Alternative: serial: /dev/ttyACM0

[mcu nitehawk]
# Nitehawk 36 toolhead board
serial: /dev/serial/by-id/usb-Klipper_rp2040_30333938340637C1-if00
# Alternative: serial: /dev/ttyACM1

#==============================================================================
# Printer Kinematics - IDEX (Independent Dual Extruder)
#==============================================================================

[printer]
kinematics: cartesian  # Minimal config for testing
max_velocity: 300
max_accel: 3000
max_z_velocity: 5
max_z_accel: 100

#==============================================================================
# Nitehawk 36 Toolhead Configuration
#==============================================================================

# Custom thermistor calibration for Micro Swiss FlowTech
# Calibrated from measured offsets:
# - At ~35C: Klipper 35C = Actual 45C (adjusted temp1 to compensate)
# - At 110C: Klipper 110C = Actual 108C (excellent!)
# - At 180C: Klipper 180C = Actual 182C (excellent!)
[thermistor microswiss_calibrated]
temperature1: 35.0
resistance1: 49410
temperature2: 96.0
resistance2: 5238
temperature3: 160.0
resistance3: 909

# Extruder (TMC2209 driven)
[extruder]
step_pin: nitehawk:gpio23
dir_pin: !nitehawk:gpio24  # Inverted to correct extrude direction
enable_pin: !nitehawk:gpio25
microsteps: 16
rotation_distance: 7.33  # Sprite Extruder Pro geared (fine-tuned: 6.98 × 21/20)
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: nitehawk:gpio9
sensor_type: microswiss_calibrated  # Custom 3-point calibrated thermistor
sensor_pin: nitehawk:gpio29
pullup_resistor: 2200
control: pid
pid_Kp: 31.708
pid_Ki: 2.578
pid_Kd: 97.504
min_temp: 0
max_temp: 300
max_extrude_only_distance: 150.0

[tmc2209 extruder]
uart_pin: nitehawk:gpio0
tx_pin: nitehawk:gpio1
uart_address: 0
run_current: 0.6
sense_resistor: 0.100
stealthchop_threshold: 999999

# Hotend heater (E0506 ferrule)
# Configured in [extruder] section above

# Hotend thermistor (2.2kΩ pullup)
# Configured in [extruder] section above

# Part cooling fan
[fan]
pin: nitehawk:gpio6
# Use PCF voltage selector jumper to choose 24V or 5V

# Hotend fan (automatic, temperature controlled)
[heater_fan hotend_fan]
pin: nitehawk:gpio5
heater: extruder
heater_temp: 50.0
fan_speed: 1.0
tachometer_pin: nitehawk:gpio16
# Use HEF voltage selector jumper to choose 24V or 5V

# X Endstop
[stepper_x]
# Main board (Pico W + TMC2226/2209)
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 36  # Calibrated: 200mm commanded = 180mm actual, adjusted from 40
endstop_pin: ^gpio4  # X endstop on Pico GP4 (NC switch COM->GND, NC->GP4)
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0  # Disable stealthChop for better high-speed torque

# Probe (bed leveling/Z sensing)
[probe]
pin: ^nitehawk:gpio10
x_offset: 0
y_offset: 0
z_offset: 0
samples: 2
# Use Probe voltage selector jumper to choose 24V or 5V

# Filament sensor
[filament_switch_sensor filament_sensor]
switch_pin: ^nitehawk:gpio3
pause_on_runout: True

# Neopixel LEDs
[neopixel toolhead_leds]
pin: nitehawk:gpio7
chain_count: 2  # Adjust for your LED count
color_order: GRB
initial_RED: 0.3
initial_GREEN: 0.3
initial_BLUE: 0.3

# Activity LED (active low)
[output_pin activity_led]
pin: !nitehawk:gpio8
value: 0

# ADXL345 Accelerometer (software SPI)
[adxl345]
cs_pin: nitehawk:gpio27
spi_software_sclk_pin: nitehawk:gpio18
spi_software_mosi_pin: nitehawk:gpio20
spi_software_miso_pin: nitehawk:gpio19

[resonance_tester]
accel_chip: adxl345
probe_points:
    117.5, 117.5, 20  # Center of bed (adjust for your dimensions)

#==============================================================================
# Main Board Configuration (Placeholders - Adjust for Your Hardware)
#==============================================================================

# Y Stepper (DUMMY - not connected, using unused pins for kinematics requirement)
[stepper_y]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
microsteps: 16
rotation_distance: 40
endstop_pin: ^gpio17
position_endstop: 0
position_max: 235
homing_speed: 50

# Z Stepper (DUMMY - not connected, using unused pins for kinematics requirement)
[stepper_z]
step_pin: gpio19
dir_pin: gpio20
enable_pin: !gpio21
microsteps: 16
rotation_distance: 8
endstop_pin: ^gpio22
position_endstop: 0.0
position_max: 250

# Heated bed (configured in pico_w_btt_tmc2226_y_z_bringup.cfg)
#
# The connected bed is on the Y/Z Pico MOSFET gpio21 with a 100k B3950 NTC on
# gpio26 / ADC0. Keep this legacy placeholder disabled in this older full
# config until the final integrated config owns the Y/Z Pico pins too.
#[heater_bed]
#heater_pin: gpio21
#sensor_type: Generic 3950
#sensor_pin: gpio26
#pullup_resistor: 4700
#control: pid
#pid_Kp: 54.027
#pid_Ki: 0.770
#pid_Kd: 948.182
#min_temp: 0
#max_temp: 130

#==============================================================================
# Optional Features
#==============================================================================

[virtual_sdcard]
path: ~/printer_data/gcodes

[display_status]

[pause_resume]

[exclude_object]

# Input shaper (use after running resonance test)
#[input_shaper]
#shaper_freq_x: 0
#shaper_freq_y: 0
#shaper_type: mzv

#==============================================================================
# Macros
#==============================================================================

[gcode_macro PRINT_START]
gcode:
    G28  # Home all axes
    # Add your start sequence here

[gcode_macro PRINT_END]
gcode:
    G91
    G1 Z10 F600  # Raise Z
    G90
    G1 X0 Y200 F6000  # Present print
    M104 S0  # Turn off hotend
    M140 S0  # Turn off bed
    M106 S0  # Turn off fan
    M84  # Disable motors

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    CANCEL_PRINT_BASE

#==============================================================================
# Notes for IDEX Conversion
#==============================================================================

# To enable dual carriage IDEX mode, you'll need to:
# 1. Add a second X stepper for the second toolhead
# 2. Configure [dual_carriage] section
# 3. Change kinematics to "cartesian" with dual_carriage support
# 4. Add IDEX-specific macros (T0, T1, dual print modes)
#
# Example dual_carriage configuration (uncomment when ready):
#
# [dual_carriage]
# axis: x
# step_pin: gpio??  # Second X stepper
# dir_pin: gpio??
# enable_pin: !gpio??
# microsteps: 16
# rotation_distance: 40
# endstop_pin: ^gpio??
# position_endstop: 235
# position_max: 235
# homing_speed: 50
