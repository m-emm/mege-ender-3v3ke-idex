# X-axis MCU snippet for Raspberry Pi Pico W + two BTT TMC2226 drivers.
# Include this from the main printer.cfg:
#   [include snippets/x_axis_stepper_endstop_pico_w.cfg]
#
# Wiring is documented in pico_w_btt_tmc2226_x.yaml and the generated SVGs.
# Active below:
# - X-left driver: STEP=GPIO11, DIR=GPIO10, EN=GPIO12, UART=GPIO9, endstop=GPIO4.
#
# Reserved/commented templates below:
# - X-right/dual carriage driver: STEP=GPIO7, DIR=GPIO6, EN=GPIO8, UART=GPIO5, endstop=GPIO22.
# - Left SFS V2.0: SWITCH=GPIO0, MOTION=GPIO1.
# - Right SFS V2.0: SWITCH=GPIO2, MOTION=GPIO3.

[stepper_x]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 36  # Calibrated: 200mm commanded = 180mm actual
endstop_pin: ^gpio4
position_endstop: 0
position_max: 235
homing_speed: 50

# BTT TMC2226 V1.0 uses the tmc2209 driver section in this Klipper setup.
[tmc2209 stepper_x]
uart_pin: gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0  # Disable stealthChop for better high-speed torque

