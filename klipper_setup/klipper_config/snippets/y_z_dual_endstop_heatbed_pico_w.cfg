# Minimal Y/Z/heatbed bring-up snippet for Raspberry Pi Pico W + TMC2226 drivers.
# Include this from your main printer.cfg:
#   [include snippets/y_z_dual_endstop_heatbed_pico_w.cfg]
#
# Wiring follows pico_w_btt_tmc2226_y_z.yaml:
# - Y:  STEP gpio11, DIR gpio10, EN gpio12, endstop gpio4,   UART gpio9
# - Z:  STEP gpio7,  DIR gpio6,  EN gpio8,  endstop gpio22, UART gpio5
# - Z1: STEP gpio14, DIR gpio15, EN gpio16, endstop gpio17, UART gpio13
# - Bed MOSFET control: gpio21
# - Bed thermistor: gpio26

[stepper_y]
step_pin: gpio11
dir_pin: !gpio10
enable_pin: !gpio12
microsteps: 16
rotation_distance: 40
endstop_pin: ^!gpio4
position_endstop: 0
position_max: 235
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: gpio9
uart_address: 0
run_current: 1.2
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z]
step_pin: gpio7
dir_pin: gpio6
enable_pin: !gpio8
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio22
position_endstop: 0.0
position_max: 250
homing_speed: 8
second_homing_speed: 3

[tmc2209 stepper_z]
uart_pin: gpio5
uart_address: 0
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

[stepper_z1]
step_pin: gpio14
dir_pin: gpio15
enable_pin: !gpio16
microsteps: 16
rotation_distance: 8
endstop_pin: ^!gpio17

[tmc2209 stepper_z1]
uart_pin: gpio13
uart_address: 0
run_current: 0.9
sense_resistor: 0.110
stealthchop_threshold: 0

[heater_bed]
heater_pin: gpio21
sensor_type: EPCOS 100K B57560G104F
sensor_pin: gpio26
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 130

# Recommended after first power-on verification:
# PID_CALIBRATE HEATER=heater_bed TARGET=60
