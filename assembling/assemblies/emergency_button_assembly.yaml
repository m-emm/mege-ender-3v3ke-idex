ShellforgepyBuilderVersion: "2026-03-27"

Description: Standalone emergency stop button reference assembly

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - right
        - top
      width: 512
      height: 512
    parts:
      - source: self
        artifact: followers
        names:
          - body
          - neck
        name_template: "{name}"
        color: [0.72, 0.62, 0.46]
      - source: self
        artifact: followers
        names:
          - silver_collar
        name_template: "{name}"
        color: [1.0, 1.0, 1.0]
      - source: self
        artifact: followers
        names:
          - button_disc
        name_template: "{name}"
        color: [0.88, 0.02, 0.02]

