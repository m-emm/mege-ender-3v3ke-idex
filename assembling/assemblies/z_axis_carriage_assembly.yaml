ShellforgepyBuilderVersion: "2026-03-27"

Description: Joiner for one monolithic z-axis carriage and its movable MGN12H blocks

Builder:
  Outputs:
    carriage:
      Visualization:
        preview:
          enabled: true
          views:
            - isometric
            - front
            - back
            - top
            - bottom
            - left
            - right
          width: 700
          height: 700
        parts:
          - source: self
            artifact: all
            name_template: "{name}"
          - source: output
            assembly: bottom_rail_carriage
            artifact: all
            name_template: "bottom_rail_carriage_{name}"
          - source: output
            assembly: top_rail_carriage
            artifact: all
            name_template: "top_rail_carriage_{name}"
          - source: injected
            assembly: z_axis_rail
            artifact: all
            name_template: "z_axis_rail_{name}"
          - source: injected
            assembly: z_axis_profile
            artifact: all
            name_template: "z_axis_profile_{name}"
          - source: injected
            assembly: z_axis_threaded_rod
            artifact: all
            name_template: "z_axis_threaded_rod_{name}"
      Production:
        process_data_preset: petgcf_max_strength_high_speed_06
        process_data:
          process_overrides:
            enable_support: "1"

        parts:
          - source: self
            artifact: leader
            name: carriage
            prod_rotation_angle: 90
            prod_rotation_axis: [1, 0, 0]
          - source: self
            artifact: followers.back_part
            name: back_part
            prod_rotation_angle: -90
            prod_rotation_axis: [1, 0, 0]

    bottom_rail_carriage:
      Visualization:
        parts:
          - source: self
            artifact: leader
            name: bottom_carriage
      Production:
        parts: []

    top_rail_carriage:
      Visualization:
        parts:
          - source: self
            artifact: leader
            name: top_carriage
      Production:
        parts: []

Parameters:
  carriage_z_offset:
    Type: Float
  z_axis_carriage_back_height:
    Type: Float
  z_axis_carriage_fillet_radius:
    Type: Float
  z_axis_carriage_front_depth:
    Type: Float
  z_axis_carriage_front_height:
    Type: Float
  z_axis_carriage_profile_center_distance:
    Type: Float
  z_axis_carriage_threaded_rod_clearance:
    Type: Float
  z_axis_carriage_width:
    Type: Float
  z_axis_carriage_x_axis_connector_thickness:
    Type: Float
  z_axis_rail_carriage_gap:
    Type: Float
  z_axis_rail_carriage_offset_above_carriage:
    Type: Float
  z_axis_creality_nut_base_cut_radius:
    Type: Float
  z_axis_creality_nut_base_length:
    Type: Float
  z_axis_creality_nut_base_thickness:
    Type: Float
  z_axis_creality_nut_base_width:
    Type: Float
  z_axis_creality_nut_mount_hole_center_center_distance:
    Type: Float
  z_axis_creality_nut_mount_screw_size:
    Type: String
  z_axis_creality_nut_rod_guide_bottom_overstand:
    Type: Float
  z_axis_creality_nut_rod_guide_diameter:
    Type: Float
  z_axis_creality_nut_rod_guide_height:
    Type: Float
  z_axis_creality_nut_threaded_rod_cuide_cutter_clearance:
    Type: Float
  z_axis_default_clearance_hole_type:
    Type: String
  z_axis_nut_screw_hole_clearence_type:
    Type: String
  z_axis_threaded_rod_diameter:
    Type: Float
  z_axis_x_axis_to_carriage_gap:
    Type: Float

Parts:
  ZAxisCarriageJoiner:
    Type: Shellforgepy::AssemblyJoiner

    Properties:
      Joiner: mege_ender_3v3ke_idex.designs.assemblies.z_axis_carriage_assembly.join_z_axis_carriage_assembly
