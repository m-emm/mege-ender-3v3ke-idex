ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for one z-axis carriage

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: carriage
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - carriage_fused
          - x_axis_alignment_reference
        name_template: "{name}"
  Production:
    parts:
      - source: self
        artifact: leader
        name: carriage
      - source: self
        artifact: followers
        name_template: "{name}"

Parameters:
  carriage_z_offset:
    Type: Float

Parts:
  ZAxisCarriageAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.z_axis_carriage_assembly.create_z_axis_carriage_assembly
      Properties:
        carriage_z_offset:
          $ref: carriage_z_offset
