ShellforgepyBuilderVersion: "2026-03-27"

Description: Part fan v2 fused connector assembly

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - top
        - left
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: part_fan_v2

      - source: injected
        assembly: sprite_extruder
        artifact: all
        name_template: "sprite_extruder_{name}"

      - source: injected
        assembly: front_part_fan
        artifact: leader
        name: front_part_fan
      - source: injected
        assembly: front_part_fan
        artifact: followers
        name_template: "front_part_fan_{name}"

      - source: injected
        assembly: side_part_fan
        artifact: leader
        name: side_part_fan
      - source: injected
        assembly: side_part_fan
        artifact: followers
        name_template: "side_part_fan_{name}"

      - source: injected
        assembly: blower_ring
        artifact: leader
        name: blower_ring

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    process_data:
      overrides:
        process_overrides:
          enable_support: "1"
          support_type: tree(auto)
          support_style: organic
          support_threshold_angle: "25"
          brim_type: no_brim
    parts:
      - source: self
        artifact: leader
        name: blower_ducts
        prod_rotation_angle: 50
        prod_rotation_axis: [1, 0, 0]

Parameters:
  part_fan_v2_front_rotation:
    Type: Float
  part_fan_v2_front_y_shift:
    Type: Float
  part_fan_v2_front_z_shift:
    Type: Float
  part_fan_v2_side_stack_gap:
    Type: Float
  part_fan_v2_side_y_shift:
    Type: Float
  part_fan_v2_side_z_shift:
    Type: Float
  duct_extension_width:
    Type: Float
  part_fan_duct_extension_length:
    Type: Float
  feeder_ring_height:
    Type: Float
  feeder_ring_wall:
    Type: Float

Parts:
  PartFanAssemblyV2:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.part_fan_assembly_v2.create_part_fan_assembly_v2
