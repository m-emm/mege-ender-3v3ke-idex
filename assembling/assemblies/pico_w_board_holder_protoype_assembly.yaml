ShellforgepyBuilderVersion: "2026-03-27"

Description: Prototype assembly configuration for a single-board TPU-retained holder

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - front_angle
        - isometric
        - top
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: board_holder_base
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"

  Production:
    parts:
      - source: self
        artifact: leader
        name: board_holder_base
      - source: self
        artifact: followers
        name_template: "{name}"

Parameters:
  board_catalog:
    Type: Json
  board_placements:
    Type: Json
  pin_lines:
    Type: Json
    Default: []
  base_plate_thickness:
    Type: Float
  board_z_offset:
    Type: Float
  base_border:
    Type: Float
  tpu_cover_thickness:
    Type: Float

Parts:
  PicoWBoardHolderProtoypeAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.board_holder_assembly_parameterized.create_board_holder_assembly_parameterized
