ShellforgepyBuilderVersion: "2026-03-27"

Description: Reusable carriage stopper assembly

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: carriage_stopper
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
  Production:
    parts:
      - source: self
        artifact: leader
        name: carriage_stopper

Parameters:
  stopper_width:
    Type: Float
  stopper_length:
    Type: Float
  stopper_thickness:
    Type: Float
  stopper_fillet_radius:
    Type: Float
  mount_screw_size:
    Type: String
    Default: null
  mount_screw_length:
    Type: Float
    Default: null
  no_fillets_at:
    Type: Any
    Default:
      - BOTTOM

Parts:
  CarriageStopperAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.carriage_stopper_assembly.create_carriage_stopper_assembly
