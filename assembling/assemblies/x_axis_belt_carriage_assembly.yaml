ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the standalone x-axis belt carriage

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - front_angle
        - isometric
        - left
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: x_axis_belt_carriage
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
      - source: injected
        assembly: carriage
        artifact: leader
        name: carriage
      - source: injected
        assembly: axis_profile
        artifact: leader
        name: axis_profile
      - source: injected
        assembly: sprite_extruder
        artifact: leader
        name: sprite_extruder
      - source: injected
        assembly: sprite_extruder
        artifact: non_production_parts
        name_template: "sprite_extruder_{name}"
  Production:
    parts:
      - source: self
        artifact: leader
        name: x_axis_belt_carriage
      - source: self
        artifact: followers
        names:
          - clamp_1
          - clamp_2
        name_template: "{name}"
    arrange:
      export_individual_parts: false
      plates:
        - name: x_axis_belt_carriage
          process_data_preset: petgcf_max_strength_high_speed_06
          parts:
            - x_axis_belt_carriage
            - clamp_1
            - clamp_2
      auto_assign_plates: false

Parameters:
  tool_head_mount_base_plate_height:
    Type: Float
  tool_head_mount_belt_clamp_base_thickness:
    Type: Float
  tool_head_mount_belt_clamp_length:
    Type: Float
  tool_head_mount_belt_clamp_thickness:
    Type: Float
  tool_head_mount_belt_clamp_y_offset:
    Type: Float
  tool_head_mount_belt_deflector_belt_clearance:
    Type: Float
  tool_head_mount_belt_deflector_cage_thickness:
    Type: Float
  tool_head_mount_belt_deflector_into_profile_distance:
    Type: Float
  tool_head_mount_belt_deflector_thickness:
    Type: Float
  tool_head_mount_belt_path_cutter_clearance:
    Type: Float
  tool_head_mount_carriage_mount_plate_fillet_radius:
    Type: Float
  tool_head_mount_carriage_mount_plate_thickness:
    Type: Float
  tool_head_mount_carriage_mount_plate_width:
    Type: Float
  tool_head_mount_clamp_base_cutter_clearance:
    Type: Float
  tool_head_mount_plate_carriage_clearance:
    Type: Float
  tool_head_mount_side_plate_depth:
    Type: Float
  tool_head_mount_side_plate_height:
    Type: Float
  tool_head_mount_side_plate_thickness:
    Type: Float
  tool_head_mount_y_extension:
    Type: Float
  x_axis_belt_carriage_left_gap:
    Type: Float
  x_axis_belt_carriage_right_gap:
    Type: Float
  x_axis_belt_carriage_bridge_clearance_to_sprite:
    Type: Float
  x_axis_belt_carriage_bridge_depth:
    Type: Float
  x_axis_belt_carriage_bridge_thickness:
    Type: Float
  x_axis_belt_carriage_bridge_web_height:
    Type: Float
  x_axis_belt_carriage_mount_eye_fillet_radius:
    Type: Float
  x_axis_belt_carriage_mount_eye_hole_diameter:
    Type: Float
  x_axis_belt_carriage_mount_eye_length:
    Type: Float
  x_axis_belt_carriage_mount_eye_thickness:
    Type: Float
  x_axis_belt_carriage_mount_eye_width:
    Type: Float
  drive_position:
    Type: String

Parts:
  XAxisBeltCarriageAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.x_axis_belt_carriage_assembly.create_x_axis_belt_carriage_assembly
