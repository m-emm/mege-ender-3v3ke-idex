ShellforgepyBuilderVersion: "2026-03-27"

Description: Simple PETG-CF test coupon

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: coupon
      - source: self
        artifact: followers
        names:
          - coupon_2
        name_template: "{name}"

  Production:
    parts:
      - source: self
        artifact: leader
        name: coupon
      - source: self
        artifact: followers
        names:
          - coupon_2
        name_template: "{name}"
    arrange:
      export_individual_parts: false
      plates:
        - name: idex
          process_data_preset: petgcf_max_strength_high_speed_06_idex_stock_matched
          parts:
            - coupon
        - name: stock
          process_data_preset: petgcf_max_strength_high_speed_06
          parts:
            - coupon_2
      auto_assign_plates: false

Parameters: {}

Parts:
  TestCouponAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.test_coupon_assembly.create_test_coupon_assembly
