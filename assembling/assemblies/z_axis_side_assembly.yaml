ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for a single z-axis side

Builder:
  Visualization:
    parts:
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - x_axis_alignment_reference
        name_template: "{name}"
      - source: dependencies
        assembly: left_z_axis_profile_assembly
        artifact: leader
        name: left_z_axis_profile
      - source: dependencies
        assembly: right_z_axis_profile_assembly
        artifact: leader
        name: right_z_axis_profile
      - source: dependencies
        assembly: printer_frame_assembly
        artifact: non_production_parts
        names:
          - frame_profile_left
          - frame_profile_right
        name_template: "{name}"

  Production:
    parts:
      - source: self
        artifact: followers
        name_template: "{name}"

Parts:
  ZAxisSideAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.z_axis_side_assembly.create_z_axis_side_assembly
