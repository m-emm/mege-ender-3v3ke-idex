ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for a single z-axis side

Builder:
  Visualization:
    parts:
      - source: dependencies
        assembly: z_axis_profile
        artifact: leader
        name: z_axis_profile
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - carriage_fused
          - x_axis_alignment_reference
        name_template: "{name}"
  Production:
    parts:
      - source: self
        artifact: followers
        name_template: "{name}"

Parameters:
  side:
    Type: String
  carriage_z_offset:
    Type: Float
  z_axis_base_z_offset:
    Type: Float

Parts:
  ZAxisSideAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.z_axis_side_assembly.create_z_axis_side_assembly
      Properties:
        side:
          $ref: side
        carriage_z_offset:
          $ref: carriage_z_offset
        z_axis_base_z_offset:
          $ref: z_axis_base_z_offset