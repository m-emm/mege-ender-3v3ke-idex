ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the dual z-axis

Builder:
  Visualization:
    parts:
      - source: dependencies
        assembly: left_z_axis_profile_assembly
        artifact: leader
        name: left_z_axis_profile
      - source: dependencies
        assembly: right_z_axis_profile_assembly
        artifact: leader
        name: right_z_axis_profile
      - source: dependencies
        assembly: printer_frame_assembly
        artifact: non_production_parts
        names:
          - frame_profile_left
          - frame_profile_right
        name_template: "{name}"
      - source: self
        artifact: followers
        names:
          - left_carriage
          - left_carriage_clamp_0
          - left_carriage_clamp_1
          - right_carriage
          - right_carriage_clamp_0
          - right_carriage_clamp_1
        name_template: "{name}"
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }
      - source: self
        artifact: followers
        exclude_names:
          - left_carriage
          - left_carriage_clamp_0
          - left_carriage_clamp_1
          - right_carriage
          - right_carriage_clamp_0
          - right_carriage_clamp_1
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - x_axis_alignment_reference
        name_template: "{name}"
  Production:

    parts:
      - source: self
        artifact: followers
        names:
          - left_carriage
          - right_carriage
        name_template: "{name}"
        flip: true
      - source: self
        artifact: followers
        names:
          - left_carriage_clamp_0
          - right_carriage_clamp_0
        name_template: "{name}"
        flip: true
      - source: self
        artifact: followers
        names:
          - right_top_mount
          - left_top_mount
        name_template: "{name}"
        prod_rotation_angle: 45
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - left_carriage_clamp_1
          - right_carriage_clamp_1
        name_template: "{name}"
      - source: self
        artifact: followers
        exclude_names:
          - left_carriage
          - right_carriage
          - left_carriage_clamp_0
          - right_carriage_clamp_0
          - left_carriage_clamp_1
          - right_carriage_clamp_1
          - right_top_mount
          - left_top_mount
        name_template: "{name}"
    process_data_preset: petgcf_medium_strength_high_speed_06
    process_data:
      overrides:
        process_overrides:
          enable_support: "1"

    arrange:
      export_individual_parts: false
      plates:
        - name: left_z_axis
          parts:
            - left_axial_bearing_stopper
            - left_axial_clamp_part_0
            - left_axial_clamp_part_1
            - left_mount_plate_back
            - left_mount_plate_clamp_part
            - left_top_mount
            - left_top_mount_clamp
            - left_carriage
            - left_carriage_clamp_0
            - left_carriage_clamp_1
        - name: right_z_axis
          parts:
            - right_axial_bearing_stopper
            - right_axial_clamp_part_0
            - right_axial_clamp_part_1
            - right_mount_plate_back
            - right_mount_plate_clamp_part
            - right_top_mount
            - right_top_mount_clamp
            - right_carriage
            - right_carriage_clamp_0
            - right_carriage_clamp_1

        # - name: remaining_parts
        #   parts:
        #     - left_axial_bearing_stopper
        #     - left_axial_clamp_part_0
        #     - left_axial_clamp_part_1
        #     - left_top_mount
        #     - left_top_mount_clamp
        #     - right_axial_bearing_stopper
        #     - right_axial_clamp_part_0
        #     - right_axial_clamp_part_1
        #     - right_mount_plate_back
        #     - right_mount_plate_clamp_part
        #     - right_top_mount
        #     - right_top_mount_clamp
        #     - right_carriage
        #     - right_carriage_clamp_0
        #     - right_carriage_clamp_1
        #     - left_carriage_clamp_1

      auto_assign_plates: false

Parameters:
  z_axis_z_travel:
    Type: Float

Parts:
  ZAxisAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.z_axis_assembly.create_z_axis_assembly
