ShellforgepyBuilderVersion: "2026-03-27"

Description: Open-top tray housing for a back-to-back Cooleon PSU pair

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - right
        - top
        - bottom
      width: 1024
      height: 1024
    parts:
      - source: self
        artifact: leader
        name: cooleon_pair_housing
        color: [0.92, 0.96, 1.0]
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_lid
          - cooleon_pair_housing_input_cable_clamp
        name_template: "{name}"
        color: [0.92, 0.96, 1.0]
      - source: self
        artifact: non_production_parts
        names:
          - lid_mount_screws
          - psu_mount_thread_insets
          - input_cable_clamp_screw
        name_template: "{name}"
        color: [0.78, 0.78, 0.72]
      - source: injected
        assembly: cooleon_psu_1
        artifact: all
        name_template: "cooleon_psu_1_{name}"
      - source: injected
        assembly: cooleon_psu_2
        artifact: all
        name_template: "cooleon_psu_2_{name}"

  Production:
    parts:
      - source: self
        artifact: leader
        name: cooleon_pair_housing
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_lid
          - cooleon_pair_housing_input_cable_clamp
        name_template: "{name}"

