ShellforgepyBuilderVersion: "2026-03-27"

Description: Open-top tray housing for a back-to-back Cooleon PSU pair

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - right
        - top
        - bottom
      width: 1024
      height: 1024
      variants:
        - name: no_lid
          hide:
            - cooleon_pair_housing_lid_left
            - cooleon_pair_housing_lid_right
            - lid_mount_screws
            - lid_split_join_screws
        - name: no_lid_no_psus
          views:
            - isometric
            - right
            - top
          hide:
            - cooleon_pair_housing_lid_left
            - cooleon_pair_housing_lid_right
            - lid_mount_screws
            - lid_split_join_screws
            - cooleon_psu_1_
            - cooleon_psu_2_
    parts:
      - source: self
        artifact: leader
        name: cooleon_pair_housing
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_lid_left
          - cooleon_pair_housing_lid_right
        name_template: "{name}"
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_input_cable_clamp
        name_template: "{name}"
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_front_left_hatch
          - cooleon_pair_housing_front_right_hatch
          - cooleon_pair_housing_back_left_hatch
          - cooleon_pair_housing_back_right_hatch
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        names:
          - lid_mount_screws
          - psu_mount_thread_insets
          - input_cable_clamp_screw
          - split_join_hardware
          - lid_split_join_screws
        name_template: "{name}"
      - source: injected
        assembly: cooleon_psu_1
        artifact: all
        name_template: "cooleon_psu_1_{name}"
      - source: injected
        assembly: cooleon_psu_2
        artifact: all
        name_template: "cooleon_psu_2_{name}"

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    parts:
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_left_body
          - cooleon_pair_housing_right_body
        name_template: "{name}"
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_lid_left
          - cooleon_pair_housing_lid_right
        name_template: "{name}"
        prod_rotation_angle: 180
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_input_cable_clamp
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_front_left_hatch
          - cooleon_pair_housing_front_right_hatch
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - cooleon_pair_housing_back_left_hatch
          - cooleon_pair_housing_back_right_hatch
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [1, 0, 0]
    arrange:
      export_individual_parts: false
      prod_gap: 12.0
      plates:
        - name: cooleon_pair_housing
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                brim_type: no_brim
                enable_support: "1"
                support_type: tree(auto)
                support_style: organic
                support_on_build_plate_only: "1"
                support_top_z_distance: "0.47"
                max_bridge_length: "0"
                bridge_no_support: "0"
                support_remove_small_overhang: "0"
                support_interface_top_layers: "2"
                support_interface_spacing: "0.8"
                support_object_xy_distance: "0.8"
                support_bottom_z_distance: "0.2"
                wall_loops: "3"
          parts:
            - cooleon_pair_housing_left_body
            - cooleon_pair_housing_right_body
        - name: cooleon_pair_housing_lid_and_clamp
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                brim_type: no_brim
                enable_support: "1"
                support_type: tree(auto)
                support_style: organic
                support_on_build_plate_only: "1"
                support_top_z_distance: "0.47"
                max_bridge_length: "0"
                bridge_no_support: "0"
                support_remove_small_overhang: "0"
                support_interface_top_layers: "2"
                support_interface_spacing: "0.8"
                support_object_xy_distance: "0.8"
                support_bottom_z_distance: "0.2"
                wall_loops: "3"
          parts:
            - cooleon_pair_housing_lid_left
            - cooleon_pair_housing_lid_right
            - cooleon_pair_housing_input_cable_clamp
            - cooleon_pair_housing_front_left_hatch
            - cooleon_pair_housing_front_right_hatch
            - cooleon_pair_housing_back_left_hatch
            - cooleon_pair_housing_back_right_hatch
      auto_assign_plates: false

