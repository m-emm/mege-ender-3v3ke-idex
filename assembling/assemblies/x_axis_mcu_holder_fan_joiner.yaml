ShellforgepyBuilderVersion: "2026-03-27"

Description: Joiner for the X-axis MCU holder and replacement part fan

Builder:
  Outputs:
    x_axis_mcu_holder:
      Visualization:
        preview:
          enabled: true
          views:
            - top
            - left
            - front
            - isometric
          width: 512
          height: 512
        parts:
          - source: self
            artifact: leader
            name: board_holder
          - source: self
            artifact: followers
            name_template: "{name}"
          - source: self
            artifact: non_production_parts
            name_template: "{name}"
          - source: output
            assembly: part_fan
            artifact: leader
            name: part_fan_body

    part_fan:
      Visualization:
        preview:
          enabled: true
          views:
            - top
            - left
            - front
            - isometric
          width: 512
          height: 512
        parts:
          - source: self
            artifact: leader
            name: part_fan_body

Parameters:
  replacement_lid_fillet_radius:
    Type: Float
    Default: 3.0

Parts:
  XAxisMcuHolderFanJoiner:
    Type: Shellforgepy::AssemblyJoiner

    Properties:
      Joiner: mege_ender_3v3ke_idex.designs.assemblies.x_axis_mcu_holder_fan_joiner.join_x_axis_mcu_holder_with_fan
      Properties:
        replacement_lid_fillet_radius:
          $ref: replacement_lid_fillet_radius
