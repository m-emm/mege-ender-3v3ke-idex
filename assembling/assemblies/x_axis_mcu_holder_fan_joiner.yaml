ShellforgepyBuilderVersion: "2026-03-27"

Description: Joiner for the X-axis MCU holder and replacement part fan

Builder:
  Outputs:
    x_axis_mcu_holder:
      Visualization:
        preview:
          enabled: true
          views:
            - top
            - left
            - front
            - isometric
          width: 512
          height: 512
        parts:
          - source: self
            artifact: leader
            name: board_holder
          - source: self
            artifact: followers
            name_template: "{name}"
          - source: self
            artifact: non_production_parts
            name_template: "{name}"
          - source: output
            assembly: part_fan
            artifact: leader
            name: part_fan_body
      Production:
        process_data_preset: petgcf_medium_strength_high_speed_06
        parts:
          - source: self
            artifact: leader
            name: board_holder
          - source: self
            artifact: followers
            names:
              - tpu_cover
            name_template: "{name}"
            flip: true
          - source: self
            artifact: followers
            names:
              - elko_sleeve_plate_*
            name_template: "{name}"
            flip: true
            prod_rotation_angle: 90
            prod_rotation_axis: [1, 0, 0]
          - source: self
            artifact: followers
            names:
              - side_walls
            name_template: "{name}"
            flip: false
          - source: self
            artifact: followers
            names:
              - top_lid
            name_template: "{name}"
            flip: true
            prod_rotation_angle: 90
            prod_rotation_axis: [1, 0, 0]
          - source: self
            artifact: followers
            names:
              - bottom_lid
            name_template: "{name}"
            flip: false
        arrange:
          export_individual_parts: false
          plates:
            - name: x_axis_mcu_holder_base
              parts:
                - board_holder
              process_data:
                process_overrides:
                  enable_support: "1"
                  support_threshold_angle: "30"
            - name: x_axis_mcu_holder_side_walls
              parts:
                - side_walls
            - name: x_axis_mcu_holder_top_lid
              parts:
                - top_lid
            - name: x_axis_mcu_holder_bottom_lid
              parts:
                - bottom_lid
            - name: x_axis_mcu_holder_tpu_cover
              process_data_preset: tpu_minimal_quality_minimal_strength_06
              parts:
                - tpu_cover
            - name: x_axis_mcu_holder_elko_sleeve_plates
              process_data_preset: tpu_minimal_quality_minimal_strength_06
              parts:
                - elko_sleeve_plate_*
          auto_assign_plates: false

    part_fan:
      Visualization:
        preview:
          enabled: true
          views:
            - top
            - left
            - front
            - isometric
          width: 512
          height: 512
        parts:
          - source: self
            artifact: leader
            name: part_fan_body

Parameters:
  replacement_lid_fillet_radius:
    Type: Float
    Default: 3.0

Parts:
  XAxisMcuHolderFanJoiner:
    Type: Shellforgepy::AssemblyJoiner

    Properties:
      Joiner: mege_ender_3v3ke_idex.designs.assemblies.x_axis_mcu_holder_fan_joiner.join_x_axis_mcu_holder_with_fan
      Properties:
        replacement_lid_fillet_radius:
          $ref: replacement_lid_fillet_radius
