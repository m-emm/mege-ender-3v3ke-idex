ShellforgepyBuilderVersion: "2026-03-27"

Description: Exploratory fixed frame for the T1/right/top Tap packaging study

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - back
        - top
        - left
        - right
      width: 700
      height: 700
    parts:
      - source: self
        artifact: leader
        name: idex_tap_fixed_frame

      - source: self
        artifact: all

        name_template: "{default_name}_{name}"

      - source: injected
        assembly: fixed_tool_head_mount
        artifact: all
      - source: dependencies
        assembly: opb991t11z_sensor_assembly
        artifact: all
        name_template: "opb991t11z_sensor_{name}"
      - source: dependencies
        assembly: x_axis_top_profile_assembly
        artifact: all
      - source: dependencies
        assembly: x_axis_rail_assembly
        artifact: all
        name_template: "{default_name}"
      - source: injected
        assembly: x_axis_carriage
        artifact: leader
        name: carriage
      - source: injected
        assembly: mgn7h_rail_with_carriage
        artifact: all

  Production:
    parts:
      - source: self
        artifact: leader
        name: idex_tap_fixed_frame

Parameters:
  mgn7h_rail_length:
    Type: Float
  mgn7h_rail_width:
    Type: Float
  mgn7h_rail_mount_hole_pitch:
    Type: Float
  mgn7h_rail_mount_hole_end_offset:
    Type: Float
  mgn7h_rail_mount_hole_diameter:
    Type: Float
  idex_tap_frame_height:
    Type: Float
  idex_tap_frame_thickness:
    Type: Float
  idex_tap_frame_mount_flange_depth:
    Type: Float
  idex_tap_frame_mount_flange_thickness:
    Type: Float
  idex_tap_frame_mount_screw_size:
    Type: String

Parts:
  IdexTapT1Assembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.idex_tap_t1_assembly.create_idex_tap_t1_assembly
