ShellforgepyBuilderVersion: "2026-03-27"

Description: Cooleon 24 V slim PSU reference mock for housing design

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - top
        - front
        - right
        - back
      width: 1024
      height: 1024
    parts:
      - source: self
        artifact: leader
        name: cooleon_psu_body
        color: [0.24, 0.54, 0.68]
      - source: self
        artifact: non_production_parts
        names:
          - input_terminal_block
        name_template: "{name}"
        color: [0.18, 0.52, 0.9]
      - source: self
        artifact: non_production_parts
        names:
          - output_terminal_block
        name_template: "{name}"
        color: [0.9, 0.14, 0.14]

      - source: self
        artifact: non_production_parts
        names:
          - mount_screw_0
          - mount_screw_1
        name_template: "{name}"
        color: [0.78, 0.78, 0.72]

Parameters:
  cooleon_psu_length:
    Type: Float
  cooleon_psu_width:
    Type: Float
  cooleon_psu_thickness:
    Type: Float
  cooleon_psu_base_plate_thickness:
    Type: Float
  cooleon_psu_side_wall_width:
    Type: Float
  cooleon_psu_terminal_block_length:
    Type: Float
  cooleon_psu_terminal_block_width:
    Type: Float
  cooleon_psu_terminal_block_height:
    Type: Float
  cooleon_psu_mount_slot_length:
    Type: Float
  cooleon_psu_mount_slot_width:
    Type: Float
  cooleon_psu_mount_slot_side_inset:
    Type: Float

Parts:
  CooleonPsuAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.cooleon_psu_assembly.create_cooleon_psu_assembly
