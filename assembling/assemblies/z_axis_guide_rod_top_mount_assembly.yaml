ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for one z-axis top guide-rod mount

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: top_mount
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    process_data:
      overrides:
        process_overrides:
          enable_support: "1"
          support_threshold_angle: "25"
          sparse_infill_density: "75%"
          top_shell_layers: "4"
          bottom_shell_layers: "4"
    parts:
      - source: self
        artifact: leader
        name: top_mount
        prod_rotation_angle: 45
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - top_mount_clamp
        name_template: "{name}"
        prod_rotation_angle: 270
        prod_rotation_axis: [1, 0, 0]
    arrange:
      export_individual_parts: false
      plates:
        - name: z_axis_guide_rod_top_mount
          parts:
            - top_mount
            - top_mount_clamp
      auto_assign_plates: false

Parameters:
  z_axis_cylinder_head_clearance:
    Type: Float
  z_axis_additional_screw_mount_clearance:
    Type: Float
  z_axis_default_clearance_hole_type:
    Type: String
  z_axis_default_screw_nut_cutter_clearance:
    Type: Float
  z_axis_endstop_cable_hole_size:
    Type: Float
  z_axis_endstop_profile_clearance:
    Type: Float
  z_axis_guide_rod_clamp_width:
    Type: Float
  z_axis_motor_mount_plate_profile_distance:
    Type: Float
  z_axis_profile_mount_plate_fillet_radius:
    Type: Float
  z_axis_top_profile_mount_plate_height:
    Type: Float
  z_axis_profile_mount_plate_num_holes:
    Type: Integer
  z_axis_profile_mount_plate_screw_inset:
    Type: Float
  z_axis_profile_mount_plate_thickness:
    Type: Float
  z_axis_profile_mount_plate_clearance:
    Type: Float
  z_axis_rod_clamp_gap:
    Type: Float
  z_axis_threaded_rod_diameter:
    Type: Float
  z_axis_top_mount_depth:
    Type: Float
  z_axis_top_mount_fillet_radius:
    Type: Float
  z_axis_top_mount_holder_depth:
    Type: Float
  z_axis_top_mount_holder_height:
    Type: Float
  z_axis_top_mount_profile_mount_width:
    Type: Float
  z_axis_top_mount_reinforcement_factor:
