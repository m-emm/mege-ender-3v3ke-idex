ShellforgepyBuilderVersion: "2026-03-27"

Description: Focused visualization of the T1/right/top Tap packaging study

Builder:
  Collection: true
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - back
        - top
        - left
        - right
      width: 700
      height: 700
    parts:
      - source: dependencies
        assembly: tool_head_mount_machined_top_assembly
        artifact: leader
        name: tool_head_mount_machined_top
      - source: dependencies
        assembly: idex_tap_t1_joined_assembly
        artifact: all
        name_template: "idex_tap_t1_{name}"
      - source: dependencies
        assembly: mgn7h_rail_with_carriage_assembly
        artifact: leader
        name: mgn7h_rail
      - source: dependencies
        assembly: mgn7h_rail_with_carriage_assembly
        artifact: followers
        names:
          - carriage
        name: mgn7h_carriage
        animation:
          idex_tap_total_travel:
            - 0
            - 0
            - { $ref: idex_tap_total_travel }
      - source: dependencies
        assembly: sprite_extruder_right_assembly
        artifact: all
        name_template: "sprite_extruder_right_{name}"
  Production:
    parts: []

Parameters:
  idex_tap_total_travel:
    Type: Float

Parts:
  IdexTapT1StackAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.idex_tap_t1_stack_assembly.create_idex_tap_t1_stack_assembly
