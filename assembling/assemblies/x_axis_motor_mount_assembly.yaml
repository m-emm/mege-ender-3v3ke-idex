ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for one standalone x-axis motor mount

Builder:
  Visualization:
    parts:
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - profile_to_align
        name_template: "{name}"
  Production:
    parts:
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        names:
          - axis_holding_counter_flange
        name_template: "{name}"

