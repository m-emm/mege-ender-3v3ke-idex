  nitehawk_heater_connector_y_offset_from_front:
    Type: Float
  nitehawk_front_cutter_width:
    Type: Float
  nitehawk_front_cutter_back_width:
    Type: Float
  nitehawk_front_cutter_y_size:
    Type: Float
  BIG_THING:
    Type: Float

Parts:
  NitehawkBoardAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.nitehawk_board_assembly.create_nitehawk_board_assembly
