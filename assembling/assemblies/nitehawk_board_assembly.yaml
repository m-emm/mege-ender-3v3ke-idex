ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the Nitehawk toolhead board

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - top
        - left
        - front
        - back
      width: 512
      height: 512
    parts:
      - source: self
        artifact: followers
        name_template: "{name}"

  Production:
    parts: []

