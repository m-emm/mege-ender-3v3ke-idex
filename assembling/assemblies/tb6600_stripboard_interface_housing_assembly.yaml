ShellforgepyBuilderVersion: "2026-03-27"

Description: Screw-lid housing for the TB6600 stripboard interface

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - back
        - top
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: tb6600_stripboard_interface_housing
        color: [1, 1, 1]
      - source: self
        artifact: followers
        names:
          - tb6600_stripboard_interface_housing_lid
        name_template: "{name}"
        color: [1, 1, 1]
      - source: self
        artifact: non_production_parts
        names:
          - lid_mount_screws
          - mount_flange_screw
        name_template: "{name}"
        color: [0.78, 0.78, 0.72]

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    parts:
      - source: self
        artifact: leader
        name: tb6600_stripboard_interface_housing
      - source: self
        artifact: followers
        names:
          - tb6600_stripboard_interface_housing_lid
        name_template: "{name}"
        prod_rotation_angle: 180
        prod_rotation_axis: [1, 0, 0]
    arrange:
      export_individual_parts: false
      prod_gap: 12.0
      plates:
        - name: tb6600_stripboard_interface_housing
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                enable_support: "1"
          parts:
            - tb6600_stripboard_interface_housing
            - tb6600_stripboard_interface_housing_lid
      auto_assign_plates: false

