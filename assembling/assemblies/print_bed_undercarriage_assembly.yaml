ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the print bed undercarriage

Builder:
  Visualization:
    parts:
      - source: dependencies
        assembly: print_bed_assembly
        artifact: leader
        name: print_bed
      - source: dependencies
        assembly: print_bed_assembly
        artifact: non_production_parts
        name_template: "{name}"
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
  Production:
    parts:
      - source: self
        artifact: followers
        names:
          - front_right_uc
          - back_right_uc
        name_template: "{name}"
        flip: true
      - source: self
        artifact: followers
        names:
          - belt_clamp_clamp_front
          - belt_clamp_clamp_back
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - adjustment_wheel_left_front
          - adjustment_wheel_left_back
          - adjustment_wheel_right_front
          - adjustment_wheel_right_back
        name_template: "{name}"
      - source: self
        artifact: followers
        exclude_names:
          - front_right_uc
          - back_right_uc
          - belt_clamp_clamp_front
          - belt_clamp_clamp_back
          - adjustment_wheel_left_front
          - adjustment_wheel_left_back
          - adjustment_wheel_right_front
          - adjustment_wheel_right_back
        name_template: "{name}"
    prototype:
      # include_parts:
      #   # - front_left_uc
      #   - back_right_uc
      #   - back_left_uc
      # box_cutters:
      #   # - part: front_left_uc
      #   #   around: self.non_production_parts.mount_tower_left_front
      #   #   size:
      #   #     - $expr:
      #   #         $sub: "${print_bed_undercarriage_mount_tower_holder_size} + 12"
      #   #     - $expr:
      #   #         $sub: "${print_bed_undercarriage_mount_tower_holder_size} + 12"
      #   #     - 200
      #   #   offset:
      #   #     - 0
      #   #     - 0
      #   #     - $expr:
      #   #         $sub: "${print_bed_mount_tower_height} * 0.5"
      #   - part: back_right_uc
      #     around: print_bed_undercarriage_assembly.non_production_parts.belt_clamp_torsion_screw_back
      #     size:
      #       - 40
      #       - 70
      #       - 12
      #     offset:
      #       - -8
      #       - 0
      #       - 0
      #   - part: back_left_uc
      #     around: print_bed_undercarriage_assembly.non_production_parts.belt_clamp_torsion_screw_back
      #     size:
      #       - 40
      #       - 70
      #       - 12
      #     offset:
      #       - -8
      #       - 0
      #       - 0
      include_parts:
        - back_right_uc
      box_cutters:
        - part: back_right_uc
          around: print_bed_undercarriage_assembly.non_production_parts.carriage_back_right
          size:
            - 40
            - 46
            - 12
      # process_data:
      #   overrides:
      #     process_overrides:
      #       wall_loops: "1"
      #       sparse_infill_density: "20%"
      arrange:
        plates: null
        auto_assign_plates: false
    process_data:
      source: mege_3devops.process_data.mender3.process_data_06_high_speed.PROCESS_DATA_PETGCF_06_HS
      overrides:
        process_overrides:
          brim_type: no_brim
          enable_support: "1"
          sparse_infill_density: "30%"
          support_interface_spacing: "0.8" # on Orca UI, this is Top interface spacing
          support_object_first_layer_gap: 2.5
          support_object_xy_distance: "3.0"
          support_on_build_plate_only: "1"
          support_threshold_angle: "30"
          support_top_z_distance: "0.3"
          wall_loops: "3"
          top_shell_layers: "4"
          bottom_shell_layers: "4"
    arrange:
      export_individual_parts: false
      plates:
        - name: front_left
          parts:
            - front_left_uc
        - name: front_right
          parts:
            - front_right_uc
        - name: back_left
          parts:
            - back_left_uc
        - name: back_right
          parts:
            - back_right_uc
        - name: belt_clamps
          parts:
            - belt_clamp_clamp_front
            - belt_clamp_clamp_back
        # - name: adjustment_wheel_single
        #   parts:
        #     - adjustment_wheel_left_front
        #   process_data:
        #     overrides:
        #       process_overrides:
        #         enable_support: "1"
        #         support_object_xy_distance: "1"

        - name: adjustment_wheels_group
          process_data:
            overrides:
              process_overrides:
                enable_support: "1"
                support_object_xy_distance: "1"
          parts:
            - adjustment_wheel_left_back
            - adjustment_wheel_right_front
            - adjustment_wheel_right_back
            - adjustment_wheel_left_front

