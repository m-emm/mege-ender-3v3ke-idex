ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the printer host and touchscreen

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - top
        - right
      width: 512
      height: 512
    parts:
      - source: dependencies
        assembly: printer_frame_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"
      - source: dependencies
        assembly: printer_foot_left_front_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"
      - source: dependencies
        assembly: printer_foot_left_back_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"
      - source: dependencies
        assembly: printer_foot_right_front_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"
      - source: dependencies
        assembly: printer_foot_right_back_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"
      - source: dependencies
        assembly: raspberry_pi_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"
      - source: self
        artifact: leader
        name: printer_host_screen_housing
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"

  Production:
    process_data_preset: petgcf_low_strength_high_speed_06
    parts:
      - source: self
        artifact: leader
        name: printer_host_screen_housing
        flip: false
      - source: self
        artifact: followers
        name_template: "{name}"
        flip: false
    arrange:
      export_individual_parts: false
      plates:
        - name: front_panel
          parts:
            - printer_host_screen_housing
          process_data:
            process_overrides:
              enable_support: "1"
              support_type: tree(auto)
              support_style: organic
              support_threshold_angle: "30"
        - name: housing_body
          parts:
            - housing_body
          process_data:
            process_overrides:
              enable_support: "0"

Parts:
  PrinterHostAndScreenAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.printer_host_and_screen_assembly.create_printer_host_and_screen_assembly
