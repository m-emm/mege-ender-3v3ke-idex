ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the x-axis

Builder:
  Visualization:
    parts:
      - source: dependencies
        assembly: x_axis_lower_profile_assembly
        artifact: leader
        name: lower_axis_profile
      - source: dependencies
        assembly: x_axis_top_profile_assembly
        artifact: leader
        name: top_axis_profile
      - source: dependencies
        assembly: x_axis_rail_assembly
        artifact: leader
        name: rail
      - source: dependencies
        assembly: x_axis_left_carriage_assembly
        artifact: leader
        name: carriage_1
        animation:
          x_carriage_1:
            - { $ref: x_axis_x_travel }
            - 0
            - 0
      - source: dependencies
        assembly: x_axis_right_carriage_assembly
        artifact: leader
        name: carriage_2
        animation:
          x_carriage_2:
            - { $ref: x_axis_x_travel_negative }
            - 0
            - 0
      - source: dependencies
        assembly: x_axis_motor_mount_bottom_assembly
        artifact: non_production_parts
        exclude_names:
          - axis_holding_counter_flange
          - profile_to_align
        name_template: "{name}_bottom"
      - source: dependencies
        assembly: x_axis_motor_mount_bottom_assembly
        artifact: non_production_parts
        names:
          - axis_holding_counter_flange
        name: axis_holding_counter_flange_bottom
      - source: dependencies
        assembly: x_axis_motor_mount_top_assembly
        artifact: non_production_parts
        exclude_names:
          - axis_holding_counter_flange
          - profile_to_align
        name_template: "{name}_top"
      - source: dependencies
        assembly: x_axis_motor_mount_top_assembly
        artifact: non_production_parts
        names:
          - axis_holding_counter_flange
        name: axis_holding_counter_flange_top
      - source: dependencies
        assembly: x_axis_carriage_stopper_left_assembly
        artifact: leader
        name: rail_end_stopper_left
      - source: dependencies
        assembly: x_axis_carriage_stopper_left_assembly
        artifact: non_production_parts
        names:
          - mount_screw
        name: rail_end_stopper_mount_screw_left
      - source: dependencies
        assembly: x_axis_carriage_stopper_right_assembly
        artifact: leader
        name: rail_end_stopper_right
      - source: dependencies
        assembly: x_axis_carriage_stopper_right_assembly
        artifact: non_production_parts
        names:
          - mount_screw
        name: rail_end_stopper_mount_screw_right
      - source: dependencies
        assembly: x_axis_endstop_left_assembly
        artifact: leader
        name: x_axis_endstop_left
      - source: dependencies
        assembly: x_axis_endstop_left_assembly
        artifact: non_production_parts
        names:
          - mount_screw
        name: endstop_mount_screw_left
      - source: dependencies
        assembly: x_axis_endstop_left_assembly
        artifact: non_production_parts
        names:
          - board
        name: endstop_board_left
      - source: dependencies
        assembly: x_axis_endstop_right_assembly
        artifact: leader
        name: x_axis_endstop_right
      - source: dependencies
        assembly: x_axis_endstop_right_assembly
        artifact: non_production_parts
        names:
          - mount_screw
        name: endstop_mount_screw_right
      - source: dependencies
        assembly: x_axis_endstop_right_assembly
        artifact: non_production_parts
        names:
          - board
        name: endstop_board_right
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
  Production:
    parts:
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_top_right_cage
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_top_right
        name_template: "{name}"
        prod_rotation_angle: 180
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_top_left
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_bottom_right
        name_template: "{name}"
        prod_rotation_angle: 0
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_bottom_right_cage
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_bottom_left
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: dependencies
        assembly: x_axis_carriage_stopper_right_assembly
        artifact: leader
        name: rail_end_stopper_right
      - source: dependencies
        assembly: x_axis_carriage_stopper_left_assembly
        artifact: leader
        name: rail_end_stopper_left
      - source: dependencies
        assembly: x_axis_endstop_right_assembly
        artifact: leader
        name: x_axis_endstop_right
        prod_rotation_angle: 0
        prod_rotation_axis: [0, 1, 0]
      - source: dependencies
        assembly: x_axis_endstop_left_assembly
        artifact: leader
        name: x_axis_endstop_left
        prod_rotation_angle: 0
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        exclude_names:
          - mount_plate_bottom
          - mount_plate_top
          - x_axis_idler_endcap_bottom_left
          - x_axis_idler_endcap_bottom_right
          - x_axis_idler_endcap_bottom_right_cage
          - x_axis_idler_endcap_top_left
          - x_axis_idler_endcap_top_right
          - x_axis_idler_endcap_top_right_cage
        name_template: "{name}"
    arrange:
      export_individual_parts: false
      plates:
        - name: bottom_parts
          process_data_preset: petgcf_medium_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                support_type: tree(auto)
                enable_support: "1"
          parts:
            - x_axis_idler_endcap_bottom_left
            - x_axis_idler_endcap_bottom_right
            - x_axis_idler_endcap_bottom_right_cage
        - name: top_parts
          process_data_preset: petgcf_medium_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                support_type: tree(auto)
                enable_support: "1"

          parts:
            - x_axis_idler_endcap_top_left
            - x_axis_idler_endcap_top_right
            - x_axis_idler_endcap_top_right_cage
        - name: endstop_left_with_support
          process_data_preset: petgcf_medium_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                enable_support: "1"
          parts:
            - x_axis_endstop_left
        - name: endstop_right_with_support
          process_data_preset: petgcf_medium_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                enable_support: "1"
          parts:
            - x_axis_endstop_right
        - name: carriage_stoppers_tpu
          process_data_preset: tpu_minimal_quality_minimal_strength_06
          parts:
            - rail_end_stopper_left
            - rail_end_stopper_right
      auto_assign_plates: false

Parameters:
  x_axis_x_travel:
    Type: Float
  x_axis_x_travel_negative:
    Type: Float
  x_axis_profile_pitch:
    Type: Float
  mount_plate_connector_link_thickness:
    Type: Float
  mount_plate_link_width:
    Type: Float
  link_flange_depth:
    Type: Float
  link_flange_thickness:
    Type: Float
  link_screw_size:
    Type: String
  link_screw_length:
    Type: Float
  toolhead_path_width:
    Type: Float
  toolhead_path_extended_width:
    Type: Float
  toolhead_path_extended_gap:
    Type: Float
  endcap_vertical_coupler_size:
    Type: Float
  endcap_vertical_coupler_screw_size:
    Type: String
  endcap_vertical_coupler_screw_length:
    Type: Float
  endcap_axle_screw_length:
    Type: Float
  endcap_belt_clearance:
    Type: Float
  endcap_belt_vertical_clearance:
    Type: Float
  endcap_belt_width:
    Type: Float
  endcap_clearance:
    Type: Float
  endcap_idler_clearance:
    Type: Float
  endcap_idler_tooth_count:
    Type: Integer
  endcap_mount_fillet_radius:
    Type: Float
  endcap_mount_screw_size:
    Type: String
  endcap_outer_box_back_wall:
    Type: Float
  endcap_profile_clearance:
    Type: Float
  endcap_profile_groove_depth:
    Type: Float
  endcap_profile_overlap:
    Type: Float
  endcap_side_hole_boundary:
    Type: Float
  endcap_side_hole_size:
    Type: Float
  endcap_tensioner_cage_back_wall:
    Type: Float
  endcap_tensioner_cage_clearance:
    Type: Float
  endcap_tensioner_length:
    Type: Float
  endcap_tensioner_outer_box_bottom_cage_clearance:
    Type: Float
  endcap_tensioner_outer_box_bottom_thickness:
    Type: Float
  endcap_tensioner_screw_size:
    Type: String
  endcap_tensioner_travel:
    Type: Float
  endcap_top_bottom_wall:
    Type: Float
  endcap_wall:
    Type: Float
  idler_cage_back_wall:
    Type: Float
  idler_cage_wall:
    Type: Float

Parts:
  XAxisAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.x_axis_assembly.create_x_axis_assembly
      Properties:
        record_metrics: true
