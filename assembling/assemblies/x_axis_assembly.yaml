ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the x-axis

Builder:
  Visualization:
    parts:
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        names:
          - carriage_1
        name_template: "{name}"
        animation:
          x_carriage_1:
            - { $ref: x_axis_x_travel }
            - 0
            - 0
      - source: self
        artifact: non_production_parts
        names:
          - carriage_2
        name_template: "{name}"
        animation:
          x_carriage_2:
            - { $ref: x_axis_x_travel_negative }
            - 0
            - 0
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
        exclude_names:
          - carriage_1
          - carriage_2
  Production:
    parts:
      - source: self
        artifact: followers
        names:
          - mount_plate_bottom
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - mount_plate_top
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_top_right
          - x_axis_idler_endcap_top_right_cage
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_top_left
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_bottom_right
          - x_axis_idler_endcap_bottom_right_cage
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - x_axis_idler_endcap_bottom_left
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - rail_end_stopper_right
          
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - rail_end_stopper_left
          
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        exclude_names:
          - mount_plate_bottom
          - mount_plate_top
          - x_axis_idler_endcap_bottom_left
          - x_axis_idler_endcap_bottom_right
          - x_axis_idler_endcap_bottom_right_cage
          - x_axis_idler_endcap_top_left
          - x_axis_idler_endcap_top_right
          - x_axis_idler_endcap_top_right_cage
          - rail_end_stopper_right
          - rail_end_stopper_left
        name_template: "{name}"
    process_data_preset: petgcf_medium_strength_high_speed_06
    process_data:
      overrides:
        process_overrides:
          enable_support: "0"
          support_interface_spacing: "1.0"
          support_object_first_layer_gap: 0.8
          support_object_xy_distance: "3.5"
          support_on_build_plate_only: "1"
          support_threshold_angle: "25"
          support_top_z_distance: "0.4"
          xy_contour_compensation: "0.0"
          xy_hole_compensation: "0.2"
          #support_type: tree(auto)

    arrange:
      export_individual_parts: false
      plates:
        - name: bottom_parts
          parts:
            - axis_holding_counter_flange_bottom
            - mount_plate_bottom
            - x_axis_idler_endcap_bottom_left
            - x_axis_idler_endcap_bottom_right
            - x_axis_idler_endcap_bottom_right_cage
            - rail_end_stopper_left
        - name: top_parts
          parts:
            - axis_holding_counter_flange_top
            - mount_plate_top
            - x_axis_idler_endcap_top_left
            - x_axis_idler_endcap_top_right
            - x_axis_idler_endcap_top_right_cage
            - rail_end_stopper_right
      auto_assign_plates: false

