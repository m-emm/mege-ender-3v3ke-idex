ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for a single z-axis top mount

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: top_mount
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
  Production:
    parts:
      - source: self
        artifact: leader
        name: top_mount
      - source: self
        artifact: followers
        name_template: "{name}"

Parts:
  ZAxisTopMountAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.z_axis_top_mount_assembly.create_z_axis_top_mount_assembly
