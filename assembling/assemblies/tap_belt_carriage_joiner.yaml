ShellforgepyBuilderVersion: "2026-03-27"

Description: Joiner for a fixed Tap frame and lower belt-carriage remainder

Builder:
  Outputs:
    idex_tap:
      Visualization:
        preview:
          enabled: true
          views:
            - isometric
            - front
            - back
            - top
            - left
            - right
          width: 700
          height: 700
        parts:
          - source: self
            artifact: leader
            name: idex_tap_belt_joined
          - source: self
            artifact: followers
            name_template: "idex_tap_{name}"
          - source: self
            artifact: non_production_parts
            name_template: "idex_tap_{name}"

    belt_carriage:
      Visualization:
        preview:
          enabled: true
          views:
            - isometric
            - front
            - top
          width: 512
          height: 512
        parts:
          - source: self
            artifact: leader
            name: belt_carriage_remainder
          - source: output
            assembly: idex_tap
            artifact: leader
            name: idex_tap_belt_joined

Parts:
  TapBeltCarriageJoiner:
    Type: Shellforgepy::AssemblyJoiner

    Properties:
      Joiner: mege_ender_3v3ke_idex.designs.assemblies.tap_belt_carriage_joiner.join_tap_with_belt_carriage
