ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the part fan assembly

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: part_fans
      - source: self
        artifact: followers
        names:
          - blower_ducts
        name_template: "{name}"
  Production:
    process_data:
      source: mege_3devops.process_data.mender3.process_data_04_high_speed.PROCESS_DATA_PLA_04_HS
      overrides:
        process_overrides:
          enable_support: "1"
          support_threshold_angle: "30"
          brim_type: no_brim
    parts:
      - source: self
        artifact: followers
        names:
          - blower_ducts
        name_template: "{name}"
        prod_rotation_angle: 50
        prod_rotation_axis: [1, 0, 0]

Parameters:
  blower_center_offset:
    Type: Float
  blowers_down_angle:
    Type: Float
  blowers_duct_diameter:
    Type: Float
  blowers_nozzle_center_distance:
    Type: Float
  blowers_wall:
    Type: Float
  duct_extension_width:
    Type: Float
  feeder_ring_extra_angle:
    Type: Float
  feeder_ring_height:
    Type: Float
  feeder_ring_inner_diameter:
    Type: Float
  feeder_ring_rotation_angle:
    Type: Float
  feeder_ring_wall:
    Type: Float
  feeder_ring_width:
    Type: Float
  num_blowers:
    Type: Integer
  part_fan_axis_from_left_offset:
    Type: Float
  part_fan_body_cutter_clearance:
    Type: Float
  part_fan_duct_extension_length:
    Type: Float
  part_fan_ducts_clearance:
    Type: Float
  part_fan_fillet_radius:
    Type: Float
  part_fan_hole_diameter:
    Type: Float
  part_fan_mount_plate_thickness:
    Type: Float
  part_fan_nut_cutter_clearance:
    Type: Float
  part_fan_outlet_connector_length:
    Type: Float
  part_fan_screw_hole_inset:
    Type: Float
  part_fan_screw_mount_base_thickness:
    Type: Float
  part_fan_screw_mount_cutout_size:
    Type: Float
  part_fan_screw_size:
    Type: String
  part_fan_size:
    Type: Float
  part_fan_thickness:
