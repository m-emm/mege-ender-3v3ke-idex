ShellforgepyBuilderVersion: "2026-03-27"

Description: Temporary direct-mount blower duct placeholder

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - top
        - left
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: part_fan
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
      - source: injected
        assembly: blower
        artifact: all
        name_template: "blower_{name}"

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06_idex_stock_matched
    process_data:
      overrides:
        process_overrides:
          enable_support: "0"
          support_threshold_angle: "25"
    parts:
      - source: self
        artifact: leader
        name: blower_duct_placeholder

Parameters:
  blower_body_size:
    Type: Float
  blower_thickness:
    Type: Float

Parts:
  PartFanAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.part_fan_assembly.create_part_fan_assembly
