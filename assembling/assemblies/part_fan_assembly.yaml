ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the part fan assembly

Builder:
  Visualization:
    preview:
      views:
        - top
        - left
        - front
    parts:
      - source: self
        artifact: leader
        name: blower_ducts
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
      - source: injected
        assembly: sprite_extruder
        artifact: all

  Production:
    process_data:
      source: mege_3devops.process_data.mender3.process_data_04_high_speed.PROCESS_DATA_PLA_04_HS
      overrides:
        process_overrides:
          enable_support: "1"
          support_threshold_angle: "30"
          brim_type: no_brim
    parts:
      - source: self
        artifact: leader
        name: blower_ducts
        prod_rotation_angle: 50
        prod_rotation_axis: [1, 0, 0]

