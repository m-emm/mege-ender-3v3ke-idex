ShellforgepyBuilderVersion: "2026-03-27"

Description: Part fan fused connector assembly

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - top
        - left
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: part_fan
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
      - source: self
        artifact: followers
        names:
          - central_blower
        name_template: "{name}"

      - source: injected
        assembly: sprite_extruder
        artifact: all
        name_template: "sprite_extruder_{name}"

      - source: injected
        assembly: blower
        artifact: all
        name_template: "blower_{name}"

      - source: injected
        assembly: blower_ring
        artifact: leader
        name: blower_ring

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    process_data:
      overrides:
        process_overrides:
          enable_support: "1"
          support_threshold_angle: "25"
    parts:
      - source: self
        artifact: leader
        name: blower_ducts
        prod_rotation_angle: 50
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - central_blower
        name_template: "{name}"

Parameters:
  blower_wall_thickness:
    Type: Float

Parts:
  PartFanAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.part_fan_assembly.create_part_fan_assembly
