ShellforgepyBuilderVersion: "2026-03-27"

Description: Whole printer scene composed from declarative subassemblies

Builder:
  Collection: true
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - top
        - left
        - bottom
      width: 512
      height: 512
    parts:
      - source: injected
        assembly: printer_frame
        artifact: all
      - source: injected
        assembly: printer_foot_left_front
        artifact: all
        name_template: "{assembly_name}_{name}"
