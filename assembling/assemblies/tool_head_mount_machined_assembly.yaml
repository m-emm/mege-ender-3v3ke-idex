ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the machined tool head mount

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - top
        - left
        - front
        - isometric
        - front_angle
      width: 512
      height: 512
    construction_drawings:
      - name: tool_head_mount_machined_top
        view: top
        parts:
          - source: self
            artifact: leader
            name: tool_head_mount_machined
        units: mm
        scale: 1.0
        precision: 2
        annotations:
          - id: tool_head_mount_width
            operation: bounding_box_x_dimension
            target: tool_head_mount_machined_bottom_assembly.leader
            placement:
              alignments:
                - alignment: STACK_FRONT
                  stack_gap: 8
          - id: tool_head_mount_left_web_width
            operation: linear_dimension
            from:
              target: tool_head_mount_machined_bottom_assembly.leader
              edge: EDGE_LEFT
            to:
              target: tool_head_mount_machined_bottom_assembly.non_production_parts.extruder_cutout_reference
              edge: EDGE_LEFT
            dimension_direction: RIGHT
            placement:
              alignments:
                - alignment: STACK_FRONT
                  stack_gap: 6

          - id: tool_head_mount_cutout_height
            operation: linear_dimension
            from:
              target: tool_head_mount_machined_bottom_assembly.non_production_parts.extruder_cutout_reference
              edge: EDGE_BACK
            to:
              target: tool_head_mount_machined_bottom_assembly.leader
              edge: EDGE_FRONT
            dimension_direction: BACK
            placement:
              alignments:
                - alignment: STACK_LEFT
                  stack_gap: 6

          - id: tool_head_mount_right_web_width
            operation: linear_dimension
            from:
              target: tool_head_mount_machined_bottom_assembly.non_production_parts.extruder_cutout_reference
              edge: EDGE_RIGHT
            to:
              target: tool_head_mount_machined_bottom_assembly.leader
              edge: EDGE_RIGHT
            dimension_direction: RIGHT
            placement:
              alignments:
                - alignment: STACK_FRONT
                  stack_gap: 6
          - id: tool_head_mount_height
            operation: bounding_box_y_dimension
            target: tool_head_mount_machined_bottom_assembly.leader
            placement:
              alignments:
                - alignment: STACK_LEFT
                  stack_gap: 8
          - id: left_front_hole_diameter
            operation: circle_diameter
            target: tool_head_mount_machined_bottom_assembly.cutters.hole_drill_RIGHT_FRONT
            quantity: 14
            placement:
              alignments:
                - alignment: STACK_RIGHT
                  stack_gap: 10
        frame: technical
        sheet:
          format: A4
          orientation: landscape
          margin: 10
          border: true
          title_block:
            title: Tool Head Mount (Machined)
            drawing_number: THM-MACHINED-BOTTOM
            revision: A
            material: Aluminum
            units: mm
            scale: "1:1"
            source: tool_head_mount_machined_bottom_assembly
        output: svg
    parts:
      - source: self
        artifact: leader
        name: tool_head_mount_machined
      - source: injected
        assembly: carriage
        artifact: leader
        name: carriage
  Production:
    parts:
      - source: self
        artifact: leader
        name: tool_head_mount_machined
    prototype:
      include_parts:
        - tool_head_mount_machined
      process_data_preset: petgcf_max_strength_high_speed_06
      arrange:
        export_step: false
        export_stl: true
        export_obj: true
        export_individual_parts: false
        plates:
          - name: tool_head_mount_machined_prototype
            filename: thm_machined_proto
            parts:
              - tool_head_mount_machined
        auto_assign_plates: false
    arrange:
      export_step: true
      export_stl: false
      export_obj: false
      export_individual_parts: false
      plates:
        - name: tool_head_mount_machined
          filename: thm_machined
          parts:
            - tool_head_mount_machined
      auto_assign_plates: false

Parameters:
  tool_head_mount_machined_plate_fillet_radius:
    Type: Float
  tool_head_mount_machined_plate_thickness:
    Type: Float
  tool_head_mount_machined_plate_width:
    Type: Float
  tool_head_mount_machined_plate_depth:
    Type: Float
  tool_head_mount_machined_cutout_width:
    Type: Float
  tool_head_mount_machined_cutout_depth:
    Type: Float
  tool_head_mount_machined_cutout_center_x:
    Type: Float
  tool_head_mount_machined_cutout_center_y:
    Type: Float
  tool_head_mount_machined_cutout_fillet_radius:
    Type: Float
  tool_head_mount_machined_sprite_mount_hole_diameter:
    Type: Float
  tool_head_mount_machined_sprite_mount_hole_x_inset:
    Type: Float
  tool_head_mount_machined_sprite_mount_hole_front_y_inset:
    Type: Float
  tool_head_mount_machined_sprite_mount_hole_primary_y_pitch:
    Type: Float
  tool_head_mount_machined_sprite_mount_hole_secondary_y_pitch:
    Type: Float
  drive_position:
    Type: String

Parts:
  ToolHeadMountMachinedAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.tool_head_mount_machined_assembly.create_tool_head_mount_machined_assembly
      Properties:
        record_metrics: true
