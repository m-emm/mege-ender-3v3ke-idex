ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the machined tool head mount

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - top
        - left
        - front
        - isometric
        - front_angle
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: tool_head_mount_machined
      - source: injected
        assembly: x_axis_belt_carriage
        artifact: leader
        name: x_axis_belt_carriage
      - source: dependencies
        assembly: x_axis_rail_assembly
        artifact: leader
        name: rail
      - source: injected
        assembly: carriage
        artifact: leader
        name: carriage
      - source: injected
        assembly: sprite_extruder
        artifact: leader
        name: sprite_extruder
      - source: injected
        assembly: sprite_extruder
        artifact: non_production_parts
        name_template: "sprite_extruder_{name}"
  Production:
    parts:
      - source: self
        artifact: leader
        name: tool_head_mount_machined
    prototype:
      include_parts:
        - tool_head_mount_machined
      process_data_preset: petgcf_max_strength_high_speed_06
      arrange:
        export_step: false
        export_stl: true
        export_obj: true
        export_individual_parts: false
        plates:
          - name: tool_head_mount_machined_prototype
            filename: thm_machined_proto
            parts:
              - tool_head_mount_machined
        auto_assign_plates: false
    arrange:
      export_step: true
      export_stl: false
      export_obj: false
      export_individual_parts: false
      plates:
        - name: tool_head_mount_machined
          filename: thm_machined
          parts:
            - tool_head_mount_machined
      auto_assign_plates: false

Parameters:
  tool_head_mount_machined_plate_fillet_radius:
    Type: Float
  tool_head_mount_machined_plate_thickness:
    Type: Float
  tool_head_mount_machined_plate_width:
    Type: Float
  drive_position:
    Type: String

Parts:
  ToolHeadMountMachinedAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.tool_head_mount_machined_assembly.create_tool_head_mount_machined_assembly
      Properties:
        record_metrics: true
