ShellforgepyBuilderVersion: "2026-03-27"

Description: Vector-labelled TPU95 T1 pressure-advance calibration strips

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: pressure_advance_calibration

  Production:
    process_data_preset: tpu95a_high_speed_06_idex_t1
    parts:
      - source: self
        artifact: leader
        name: pressure_advance_calibration
        obj_metadata:
          slicer_filament_id: 2
    arrange:
      export_individual_parts: true
      plates:
        - name: pressure_advance_calibration_tpu95
          process_data:
            overrides:
              process_overrides:
                enable_pressure_advance: "0"
                pressure_advance: "0"
                enable_arc_fitting: "0"
                enable_support: "0"
                brim_type: no_brim
                skirt_loops: "0"
                has_scarf_joint_seam: "0"
                sparse_infill_density: "0%"
                wall_loops: "2"
                layer_height: "0.36"
                initial_layer_print_height: "0.36"
                outer_wall_speed: "100"
                inner_wall_speed: "130"
                initial_layer_speed: "100"
                initial_layer_infill_speed: "100"
                default_acceleration: "500"
                initial_layer_acceleration: "500"
                inner_wall_acceleration: "500"
                outer_wall_acceleration: "500"
                top_surface_acceleration: "500"
                travel_acceleration: "500"
                sparse_infill_acceleration: "500"
                internal_solid_infill_acceleration: "500"
                bridge_acceleration: "500"
                default_jerk: "1"
                infill_jerk: "1"
                initial_layer_jerk: "1"
                inner_wall_jerk: "1"
                outer_wall_jerk: "1"
                top_surface_jerk: "1"
                travel_jerk: "1"
          gcode_postprocessor:
            function: mege_ender_3v3ke_idex.designs.pressure_advance_gcode_postprocessor.apply_y_banded_pressure_advance
            arguments:
              restore_advance: 0.12
              sweep:
                {
                  y_min_start: 43.5,
                  band_height: 13,
                  y_pitch: 20,
                  advance_start: 0.03,
                  advance_stop: 0.20,
                  intervals: 7,
                  label_decimals: 3,
                }
          parts:
            - pressure_advance_calibration
      auto_assign_plates: false

Parameters: {}

Parts:
  PressureAdvanceCalibrationAssembly:
    Type: Shellforgepy::Assembly
    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.pressure_advance_calibration_assembly.create_pressure_advance_calibration_assembly
      Properties:
        pressure_advance_sweep:
          {
            y_min_start: 43.5,
            band_height: 13,
            y_pitch: 20,
            advance_start: 0.03,
            advance_stop: 0.20,
            intervals: 7,
            label_decimals: 3,
          }
