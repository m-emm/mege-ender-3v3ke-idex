ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for a single tool head mount

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: tool_head_mount
      - source: self
        artifact: followers
        names:
          - blower_ducts
          - belt_clamp_base_1
          - belt_clamp_base_2
          - carriage
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - nitehawk_pcb
        name_template: "{name}"
  Production:
    process_data:
      source: mege_3devops.process_data.mender3.process_data_04_high_speed.PROCESS_DATA_PETGCF_04_HS
      overrides:
        process_overrides:
          brim_type: no_brim
          enable_support: "1"
          external_perimeter_speed: "75"
          fan_max_speed: "25"
          fan_min_speed: "10"
          outer_wall_speed: "75"
          sparse_infill_density: "75%"
          support_interface_spacing: "0.8"
          support_on_build_plate_only: "1"
          support_threshold_angle: "30"
          support_top_z_distance: "0.3"
          wall_loops: "3"
    parts:
      - source: self
        artifact: leader
        name: tool_head_mount
      - source: self
        artifact: followers
        names:
          - belt_clamp_base_1
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - belt_clamp_base_2
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]

