ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for a single tool head mount

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - front_angle
        - isometric
        - left
      width: 512
      height: 512

    parts:
      - source: self
        artifact: leader
        name: tool_head_mount
      - source: self
        artifact: followers
        names:
          - blower_ducts
          - belt_clamp_base_1
          - belt_clamp_base_2
          - carriage
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - nitehawk_pcb
        name_template: "{name}"
  Production:
    parts:
      - source: self
        artifact: leader
        name: tool_head_mount
        prod_rotation_angle: 180
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - belt_clamp_base_1
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - belt_clamp_base_2
        name_template: "{name}"
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]
    arrange:
      export_individual_parts: false
      plates:
        - name: tool_head_mount
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                brim_type: no_brim
                enable_support: "1"
                support_type: tree(auto)
          parts:
            - tool_head_mount
            - belt_clamp_base_1
            - belt_clamp_base_2
      auto_assign_plates: false

Parameters:
  extruder_mount_screw_size:
    Type: String
  x_axis_profile_length:
    Type: Float
  x_axis_profile_pitch:
    Type: Float
  tool_head_mount_base_plate_height:
    Type: Float
  tool_head_mount_base_plate_thickness:
    Type: Float
  tool_head_mount_belt_clamp_base_thickness:
    Type: Float
  tool_head_mount_belt_clamp_length:
    Type: Float
  tool_head_mount_belt_clamp_thickness:
    Type: Float
  tool_head_mount_belt_clamp_y_offset:
    Type: Float
  tool_head_mount_belt_deflector_belt_clearance:
    Type: Float
  tool_head_mount_belt_deflector_cage_thickness:
    Type: Float
  tool_head_mount_belt_deflector_into_profile_distance:
    Type: Float
  tool_head_mount_belt_deflector_thickness:
    Type: Float
  tool_head_mount_belt_path_cutter_clearance:
    Type: Float
  tool_head_mount_carriage_mount_plate_fillet_radius:
    Type: Float
  tool_head_mount_carriage_mount_plate_thickness:
    Type: Float
  tool_head_mount_carriage_mount_plate_width:
    Type: Float
  tool_head_mount_clamp_base_cutter_clearance:
    Type: Float
  tool_head_mount_extruder_cutout_carriage_gap:
    Type: Float
  tool_head_mount_extruder_cutout_fillet_radius:
    Type: Float
  tool_head_mount_extruder_cutout_width:
    Type: Float
  tool_head_mount_plate_carriage_clearance:
    Type: Float
  tool_head_mount_side_plate_depth:
    Type: Float
  tool_head_mount_side_plate_height:
    Type: Float
  tool_head_mount_side_plate_thickness:
    Type: Float
  tool_head_mount_side_stiffener_thickness:
    Type: Float
  tool_head_mount_sprite_mount_screw_length:
    Type: Float
  tool_head_mount_tool_head_base_plate_clearance:
    Type: Float
  tool_head_mount_tool_head_x_offset:
    Type: Float
  tool_head_mount_tool_head_z_offset:
    Type: Float
  tool_head_mount_x_offset:
    Type: Float
  tool_head_mount_y_extension:
    Type: Float
  drive_position:
    Type: String

  tool_head_mount_top_box_wall:
    Type: Float
  tool_head_mount_top_box_height:
    Type: Float

Parts:
  ToolHeadMountAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.tool_head_mount_assembly.create_tool_head_mount_assembly
