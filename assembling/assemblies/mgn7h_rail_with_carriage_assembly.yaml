ShellforgepyBuilderVersion: "2026-03-27"

Description: Standalone MGN7H rail with one built-in carriage follower

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - back
        - top
        - left
        - right
      width: 700
      height: 700
      variants:
        - name: rail_cross_section_only
          views:
            - top
          width: 900
          height: 700
          pixels_per_mm: 66
          hide:
            - carriage
            - printable_mockup
        - name: rail_mockup_printable_only
          views:
            - top
          width: 900
          height: 700
          pixels_per_mm: 66
          hide:
            - rail
            - carriage
        - name: rail_with_carriage_cross_section
          views:
            - bottom
          width: 1600
          height: 900
          pixels_per_mm: 66
          hide:
            - printable_mockup
    parts:
      - source: self
        artifact: leader
        name: rail
      - source: self
        artifact: followers
        names:
          - carriage
        name_template: "{name}"
      - source: self
        artifact: followers
        names:
          - rail_mockup_printable
        name: printable_mockup

  Production:
    parts:
      - source: self
        artifact: followers
        names:
          - rail_mockup_printable
        name: mgn7h_rail_mockup
    arrange:
      export_individual_parts: false
      plates:
        - name: mgn7h_rail_mockup
          filename: mgn7h_rail_mockup
          process_data_preset: pla_medium_strength_max_quality_06
          process_data:
            overrides:
              process_overrides:
                enable_support: "0"
                brim_type: "no_brim"
          parts:
            - mgn7h_rail_mockup
      auto_assign_plates: false

Parameters:
  mgn7h_rail_length:
    Type: Float
  mgn7h_rail_mount_hole_drill_extra_length:
    Type: Float
  mgn7h_rail_mock_clearance:
    Type: Float
  mgn7h_rail_mock_side_clearance:
    Type: Float
  mgn7h_rail_mock_top_clearance:
    Type: Float
  mgn7h_rail_mock_groove_clearance:
    Type: Float
  mgn7h_rail_mock_groove_height_clearance:
    Type: Float
  mgn7h_carriage_rest_offset_on_rail:
    Type: Float

Parts:
  Mgn7hRailWithCarriageAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.mgn7h_rail_with_carriage_assembly.create_mgn7h_rail_with_carriage_assembly
