ShellforgepyBuilderVersion: "2026-03-27"

Description: Standalone MGN7H rail with one built-in carriage follower

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - back
        - top
        - left
        - right
      width: 700
      height: 700
      variants:
        - name: rail_cross_section_only
          views:
            - top
          width: 900
          height: 700
          pixels_per_mm: 66
          hide:
            - carriage
    parts:
      - source: self
        artifact: leader
        name: rail
        color: [0.74, 0.78, 0.82]
      - source: self
        artifact: followers
        names:
          - carriage
        name_template: "{name}"
        color: [0.8, 0.84, 0.88]
  Production:
    parts:
      - source: self
        artifact: followers
        names:
          - rail_mockup_printable
        name: mgn7h_rail_mockup
    arrange:
      export_individual_parts: false
      plates:
        - name: mgn7h_rail_mockup
          filename: mgn7h_rail_mockup
          process_data_preset: pla_medium_strength_max_quality_06
          process_data:
            overrides:
              process_overrides:
                enable_support: "0"
                brim_type: "no_brim"
          parts:
            - mgn7h_rail_mockup
      auto_assign_plates: false

Parameters:
  mgn7h_rail_length:
    Type: Float
  mgn7h_rail_width:
    Type: Float
  mgn7h_rail_height:
    Type: Float
  mgn7h_rail_mount_hole_pitch:
    Type: Float
  mgn7h_rail_mount_hole_end_offset:
    Type: Float
  mgn7h_rail_mount_hole_diameter:
    Type: Float
  mgn7h_rail_mount_counterbore_diameter:
    Type: Float
  mgn7h_rail_mount_counterbore_depth:
    Type: Float
  mgn7h_rail_mount_screw_size:
    Type: String
  mgn7h_rail_groove_z_center:
    Type: Float
  mgn7h_rail_groove_v_height:
    Type: Float
  mgn7h_rail_groove_v_depth:
    Type: Float
  mgn7h_rail_groove_slot_height:
    Type: Float
  mgn7h_rail_groove_slot_depth:
    Type: Float
  mgn7h_rail_top_fillet_radius:
    Type: Float
  mgn7h_rail_bottom_chamfer_width:
    Type: Float
  mgn7h_rail_bottom_chamfer_height:
    Type: Float
  rail_mock_clearance:
    Type: Float
  rail_mock_groove_clearance:
    Type: Float
  rail_mock_groove_height_clearance:
    Type: Float
  mgn7h_carriage_length:
    Type: Float
  mgn7h_carriage_width:
    Type: Float
  mgn7h_carriage_height:
    Type: Float
  mgn7h_carriage_h1_offset:
    Type: Float
  mgn7h_carriage_mount_hole_pitch_x:
    Type: Float
  mgn7h_carriage_mount_hole_pitch_y:
    Type: Float
  mgn7h_carriage_mount_hole_depth:
    Type: Float
  mgn7h_carriage_mount_screw_size:
    Type: String
  mgn7h_carriage_rest_offset_on_rail:
    Type: Float

Parts:
  Mgn7hRailWithCarriageAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.mgn7h_rail_with_carriage_assembly.create_mgn7h_rail_with_carriage_assembly
