ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the Creality PSU electronics box mount

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: psu_electrics_box
      - source: self
        artifact: non_production_parts
        names:
          - cable_clamps_lid
        name_template: "{name}"
        animation:
          cable_clamps_lid_open:
            type: rotation
            axis: [1, 0, 0]
            angle_degrees: -90
            center: [BACK]
      - source: self
        artifact: non_production_parts
        exclude_names:
          - cable_clamps_lid
        name_template: "{name}"
      - source: self
        artifact: followers
        names:
          - cable_holder
        name_template: "{name}"
      - source: injected
        assembly: frame
        artifact: all

  Production:
    parts:
      - source: self
        artifact: leader
        name: psu_electrics_box
        prod_rotation_angle: 90
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - cable_holder
        name_template: "{name}"
        prod_rotation_angle: 0
        prod_rotation_axis: [0, 1, 0]
    arrange:
      export_individual_parts: false
      plates:
        - name: creality_psu
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                brim_type: no_brim
                enable_support: "1"
                support_type: tree(auto)
                support_on_build_plate_only: "1"
          parts:
            - psu_electrics_box
            - cable_holder
      auto_assign_plates: false

Parameters:
  psu_mount_screw_length:
    Type: Float
  psu_mount_screw_cylinder_head_clearance:
    Type: Float
  psu_mount_wall_thickness:
    Type: Float
  psu_mount_base_thickness:
    Type: Float
  psu_mount_electrics_box_width:
    Type: Float
  psu_mount_electrics_box_depth:
    Type: Float
  psu_mount_electrics_box_height:
    Type: Float
  psu_mount_electrics_box_wall_thickness:
    Type: Float
  psu_mount_electrics_box_depth_overlap:
    Type: Float
  psu_mount_electrics_box_low_voltage_window_width:
    Type: Float
  psu_mount_electrics_box_low_voltage_window_depth:
    Type: Float
  psu_mount_cable_hole_diameter:
    Type: Float
  psu_mount_cable_clamp_length:
    Type: Float
  psu_mount_cable_clamp_width:
    Type: Float
  psu_mount_cable_clamp_clamp_screw_size:
    Type: String
  psu_mount_cable_clamp_clamp_screw_length:
    Type: Float

Parts:
  CrealityPsuAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.creality_psu_assembly.create_creality_psu_assembly
