ShellforgepyBuilderVersion: "2026-03-27"

Description: Print-bed-front mount for the multi-head-zero reference

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - left
      width: 512
      height: 512
    parts:
      - source: injected
        assembly: print_bed
        artifact: all
        name_template: "print_bed_{name}"
      - source: injected
        assembly: print_bed_undercarriage
        artifact: all
        name_template: "print_bed_undercarriage_{name}"
      - source: injected
        assembly: multi_head_zero
        artifact: all
        name_template: "multi_head_zero_{name}"
      - source: self
        artifact: leader
        name: multi_head_zero_mount

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    parts:
      - source: self
        artifact: leader
        name: multi_head_zero_mount
        prod_rotation_angle: 90
        prod_rotation_axis: [1, 0, 0]
    arrange:
      export_individual_parts: false
      prod_gap: 12.0
      plates:
        - name: multi_head_zero_mount
          process_data_preset: petgcf_max_strength_high_speed_06
          parts:
            - multi_head_zero_mount
      auto_assign_plates: false

Parts:
  MultiHeadZeroMountAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.multi_head_zero_mount_assembly.create_multi_head_zero_mount_assembly
