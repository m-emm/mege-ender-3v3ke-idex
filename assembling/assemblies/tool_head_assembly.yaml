ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the tool head assembly

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: tool_head
      - source: self
        artifact: followers
        names:
          - blower_ducts
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - nitehawk_pcb
        name_template: "{name}"
  Production:
    process_data:
      source: mege_3devops.process_data.mender3.process_data_04_high_speed.PROCESS_DATA_PETGCF_04_HS
      overrides:
        process_overrides:
          enable_support: "1"
          support_threshold_angle: "30"
          brim_type: no_brim
          support_on_build_plate_only: "1"
          support_top_z_distance: "0.3"
          support_interface_spacing: "0.8"
          fan_min_speed: "10"
          fan_max_speed: "25"
          external_perimeter_speed: "75"
          outer_wall_speed: "75"
          sparse_infill_density: "85%"
    parts:
      - source: self
        artifact: leader
        name: tool_head
        prod_rotation_angle: -90
        prod_rotation_axis: [1, 0, 0]
      - source: self
        artifact: followers
        names:
          - blower_ducts
        name_template: "{name}"
        prod_rotation_angle: 50
        prod_rotation_axis: [0, 1, 0]

