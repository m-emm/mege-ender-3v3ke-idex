ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the tool head assembly

Builder:
  Visualization:
    preview:
      views:
        - top
        - left
        - front
    parts:
      - source: self
        artifact: leader
        name: tool_head
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
      - source: injected
        assembly: sprite_extruder
        artifact: all

  Production:
    parts:
      - source: self
        artifact: leader
        name: tool_head
        prod_rotation_angle: 45
        prod_rotation_axis: [0, 1, 0]
    arrange:
      export_individual_parts: false
      plates:
        - name: tool_head
          process_data_preset: petgcf_medium_strength_medium_quality_06
          process_data:
            overrides:
              process_overrides:
                brim_type: no_brim
                enable_support: "1"
                support_type: tree(auto)
                support_style: organic

                # support_threshold_angle: "20"
                support_on_build_plate_only: "1"
                support_interface_spacing: "2" # on Orca UI, this is Top interface spacing
          parts:
            - tool_head
      auto_assign_plates: false
Parts:
  ToolHeadAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Composite:
        Leader:
          Fused:
            - source: injected
              assembly: nitehawk_holder
              artifact: leader
            - source: injected
              assembly: part_fans
              artifact: leader
        Followers: []
        Cutters: []
        NonProductionParts:
          - source: injected
            assembly: nitehawk_holder
            artifact: non_production_parts
            name_template: "nitehawk_holder_{name}"
          - source: injected
            assembly: part_fans
            artifact: non_production_parts
            name_template: "part_fans_{name}"
