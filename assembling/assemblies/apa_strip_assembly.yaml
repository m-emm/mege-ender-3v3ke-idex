ShellforgepyBuilderVersion: "2026-03-27"

Description: Parameterized APA102 LED strip reference

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - top
        - front
        - isometric
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: apa_strip_pcb
        color: [0.08, 0.32, 0.16]
      - source: self
        artifact: followers
        names:
          - apa_led_*
        name_template: "{name}"
        color: [0.92, 0.90, 0.82]
      - source: self
        artifact: followers
        names:
          - apa_pad_*
        name_template: "{name}"
        color: [0.95, 0.72, 0.22]

  Production:
    parts: []

Parameters:
  apa_strip_density:
    Type: String
  apa_strip_num_leds:
    Type: Integer
  apa_strip_with_hull:
    Type: Boolean
    Default: false

Parts:
  ApaStripAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.apa_strip_assembly.create_apa_strip_assembly
