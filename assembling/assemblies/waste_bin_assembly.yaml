ShellforgepyBuilderVersion: "2026-03-27"

Description: Standalone waste bin assembly

Builder:
  Visualization:
    parts:
      - source: self
        artifact: leader
        name: waste_bin

      - source: dependencies
        assembly: sprite_extruder_left_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"

      - source: dependencies
        assembly: part_fan_left_joined_assembly
        artifact: leader
        name_template: "{assembly_name}_{name}"

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06_idex_stock_matched
    process_data:
      overrides:
        process_overrides:
          enable_support: "1"

    parts:
      - source: self
        artifact: leader
        name: waste_bin
      - source: self
        artifact: followers
        name_template: "{name}"
    arrange:
      export_individual_parts: false

      plates:
        - name: waste_bin

      auto_assign_plates: true

Parameters:
  waste_bin_width:
    Type: Float
  waste_bin_depth:
    Type: Float
  waste_bin_height:
    Type: Float
  waste_bin_wall_thickness:
    Type: Float
  waste_bin_fillet_radius:
    Type: Float

Parts:
  WasteBinAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.waste_bin_assembly.create_waste_bin_assembly
