ShellforgepyBuilderVersion: "2026-03-27"

Description: Standalone waste bin assembly

Builder:
  Visualization:
    parts:
      - source: self
        artifact: all
        name_template: "{assembly_name}_{name}"

      - source: dependencies
        assembly: sprite_extruder_left_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"

      - source: dependencies
        assembly: part_fan_left_joined_assembly
        artifact: leader
        name_template: "{assembly_name}_{name}"

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    process_data:
      overrides:
        process_overrides:
          enable_support: "1"
          support_type: normal(auto)
          support_style: default
          bridge_no_support: "0"
          max_bridge_length: "0"

    parts:
      - source: self
        artifact: leader
        name: waste_bin
      - source: self
        artifact: followers
        names:
          - nozzle_brush_holder
        name_template: "{name}"
      - source: self
        artifact: followers
        names:
          - top_bin
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [1, 0, 0]
    arrange:
      export_individual_parts: false

      plates:
        - name: waste_bin
          parts:
            - waste_bin
            - nozzle_brush_holder
            - top_bin


        # - name: waste_bin_top
        #   parts:

      auto_assign_plates: false

Parameters:
  waste_bin_width:
    Type: Float
  waste_bin_depth:
    Type: Float
  waste_bin_height:
    Type: Float
  waste_bin_wall_thickness:
    Type: Float
  waste_bin_fillet_radius:
    Type: Float

Parts:
  WasteBinAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.waste_bin_assembly_v2.create_waste_bin_assembly
