ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the x-axis MCU board holder

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - front_angle
        - isometric
        - top
        - bottom
        - left
        - right
      width: 512
      height: 512
    parts:
      # - source: dependencies
      #   assembly: printer_frame_assembly
      #   artifact: leader
      #   name: printer_frame
      - source: self
        artifact: leader
        name: board_holder
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"

  Production:
    process_data_preset: petgcf_medium_strength_high_speed_06
    parts:
      - source: self
        artifact: leader
        name: board_holder
      - source: self
        artifact: followers
        names:
          - tpu_cover
        name_template: "{name}"
        flip: true
      - source: self
        artifact: followers
        names:
          - side_walls
        name_template: "{name}"
        flip: false
    arrange:
      export_individual_parts: false
      plates:
        - name: board_holder_base
          parts:
            - board_holder

          process_data:
            process_overrides:
              enable_support: "1"
              support_threshold_angle: "30"

        - name: board_holder_side_walls
          parts:
            - side_walls
        - name: board_holder_tpu_cover
          process_data_preset: tpu_minimal_quality_minimal_strength_06
          parts:
            - tpu_cover
      auto_assign_plates: false

Parameters:
  board_holder_base_plate_border:
    Type: Float
  board_holder_base_plate_thickness:
    Type: Float
  board_holder_board_z_offset:
    Type: Float
  board_holder_mount_screw_size:
    Type: String
  board_holder_mount_screw_hole_inset:
    Type: Float
  board_holder_tmc_board_count:
    Type: Integer
  board_holder_pico_to_tmc_gap_x:
    Type: Float
  board_holder_tmc_to_additional_pins_gap_x:
    Type: Float
  board_holder_usb_cable_hole_width:
    Type: Float
  board_holder_usb_cable_hole_height:
    Type: Float
  x_axis_mcu_dil_pitch:
    Type: Float
  board_holder_tpu_cover_thickness:
    Type: Float
  board_holder_tpu_cover_gap_above_base:
    Type: Float
  board_holder_tpu_cover_pin_overlap_in_pitches:
    Type: Float
  board_holder_tpu_cover_cross_strap_width_in_pitches:
    Type: Float
  board_holder_plug_corner_inset:
    Type: Float
  board_holder_plug_diameter:
    Type: Float
  board_holder_plug_angle_deg:
    Type: Float
  board_holder_plug_height:
    Type: Float
  board_holder_plug_wall_thickness:
    Type: Float
  board_holder_plug_base_thickness:
    Type: Float
  board_holder_plug_slit_width:
    Type: Float
  board_holder_plug_fillet_radius:
    Type: Float
  board_holder_plug_lip_height:
    Type: Float
  board_holder_plug_lip_size:
    Type: Float
  board_holder_plug_lip_top_gap:
    Type: Float
  board_holder_plug_no_inner_hole:
    Type: Boolean
  board_holder_plug_hole_slack:
    Type: Float
  board_holder_frame_mount_eyes_enabled:
    Type: Boolean
  board_holder_frame_mount_eye_screw_size:
    Type: String
  board_holder_frame_mount_eye_width:
    Type: Float
  board_holder_frame_mount_eye_thickness:
    Type: Float
  board_holder_frame_mount_eye_fillet_radius:
    Type: Float

Parts:
  BoardHolderAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.board_holder_assembly.create_board_holder_assembly
