ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the x-axis MCU board holder

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - front_angle
        - isometric
        - top
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: board_holder
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"

  Production:
    process_data:
      source: mege_3devops.process_data.mender3.process_data_04_high_speed.PROCESS_DATA_PLACF_04_HS
      overrides:
        process_overrides:
          wall_loops: "1"
          bottom_shell_layers: "1"
          top_shell_layers: "1"
          sparse_infill_density: "25%"
          brim_type: no_brim
    parts:
      - source: self
        artifact: leader
        name: board_holder
      - source: self
        artifact: followers
        names:
          - pico_leaf_spring_preloaded
          - tmc_leaf_spring_preloaded
        name_template: "{name}"

Parameters:
  board_holder_base_plate_border:
    Type: Float
  board_holder_base_plate_y_size:
    Type: Float
  board_holder_base_plate_thickness:
    Type: Float
  board_holder_board_z_offset:
    Type: Float
  board_holder_leaf_spring_angle:
    Type: Float
  board_holder_leaf_spring_thickness:
    Type: Float
  board_holder_leaf_spring_holder_tower_x_size:
    Type: Float
  board_holder_leaf_spring_holder_tower_y_size:
    Type: Float
  board_holder_mount_screw_size:
    Type: String
  board_holder_mount_screw_hole_inset:
    Type: Float
  board_holder_tmc_board_count:
    Type: Integer

Parts:
  BoardHolderAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.board_holder_assembly.create_board_holder_assembly
