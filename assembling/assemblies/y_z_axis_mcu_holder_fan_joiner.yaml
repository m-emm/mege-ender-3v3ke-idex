ShellforgepyBuilderVersion: "2026-03-27"

Description: Joiner for the Y/Z-axis MCU holder and inward shifted replacement fan

Builder:
  Outputs:
    y_z_axis_mcu_holder:
      Visualization:
        preview:
          enabled: true
          views:
            - front_angle
            - isometric
            - top
            - bottom
            - left
            - right
          width: 512
          height: 512
        parts:
          - source: self
            artifact: leader
            name: board_holder
          - source: self
            artifact: followers
            exclude_names:
              - elko_sleeve_plate_*
            name_template: "{name}"
          - source: self
            artifact: non_production_parts
            name_template: "{name}"
          - source: output
            assembly: part_fan
            artifact: leader
            name: part_fan_body
      Production:
        process_data_preset: petgcf_medium_strength_high_speed_06
        parts:
          - source: self
            artifact: leader
            name: board_holder
          - source: self
            artifact: followers
            names:
              - tpu_cover
            name_template: "{name}"
            flip: true
          - source: self
            artifact: followers
            names:
              - elko_sleeve_plate_*
            name_template: "{name}"
            flip: true
            prod_rotation_angle: 90
            prod_rotation_axis: [1, 0, 0]
          - source: self
            artifact: followers
            names:
              - side_walls
            name_template: "{name}"
            flip: false
          - source: self
            artifact: followers
            names:
              - top_lid
            name_template: "{name}"
            flip: true
          - source: self
            artifact: followers
            names:
              - bottom_lid
            name_template: "{name}"
            flip: false
        arrange:
          export_individual_parts: false
          plates:
            - name: y_z_axis_mcu_holder_base
              parts:
                - board_holder
              process_data:
                process_overrides:
                  enable_support: "1"
                  support_threshold_angle: "30"
            - name: y_z_axis_mcu_holder_side_walls
              parts:
                - side_walls
            - name: y_z_axis_mcu_holder_top_lid
              process_data_preset: petgcf_max_strength_high_speed_06_idex
              process_data:
                overrides:
                  process_overrides:
                    brim_type: no_brim
                    enable_support: "1"
                    support_type: tree(auto)
                    support_style: organic
                    support_on_build_plate_only: "1"
                    support_top_z_distance: "0.47"
                    max_bridge_length: "0"
                    bridge_no_support: "0"
                    support_interface_top_layers: "2"
                    support_interface_spacing: "0.8"
                    support_object_xy_distance: "0.8"
                    support_bottom_z_distance: "0.2"
                    wall_loops: "3"
                    travel_speed: "150"
                    initial_layer_travel_speed: "120"
                    outer_wall_speed: "45"
                    inner_wall_speed: "60"
                    top_surface_speed: "45"
                    sparse_infill_speed: "70"
                    internal_solid_infill_speed: "60"
                    solid_infill_speed: "60"
                    gap_infill_speed: "35"
                    bridge_speed: "25"
                    initial_layer_speed: "25"
                    initial_layer_infill_speed: "35"
                    default_acceleration: "1500"
                    travel_acceleration: "1200"
                    initial_layer_acceleration: "800"
                    outer_wall_acceleration: "900"
                    inner_wall_acceleration: "1200"
                    top_surface_acceleration: "900"
                    sparse_infill_acceleration: "1200"
                    internal_solid_infill_acceleration: "1200"
                    bridge_acceleration: "800"
                    default_jerk: "4"
                    travel_jerk: "3"
                    initial_layer_jerk: "3"
                    outer_wall_jerk: "3"
                    inner_wall_jerk: "4"
                    top_surface_jerk: "3"
                    infill_jerk: "4"
              parts:
                - top_lid
            - name: y_z_axis_mcu_holder_bottom_lid
              parts:
                - bottom_lid
            - name: y_z_axis_mcu_holder_tpu_cover
              process_data_preset: tpu_minimal_quality_minimal_strength_06
              parts:
                - tpu_cover
            - name: y_z_axis_mcu_holder_elko_sleeve_plates
              process_data_preset: tpu_minimal_quality_minimal_strength_06
              parts:
                - elko_sleeve_plate_*
          auto_assign_plates: false

    part_fan:
      Visualization:
        preview:
          enabled: true
          views:
            - top
            - bottom
            - isometric
          width: 512
          height: 512
        parts:
          - source: self
            artifact: leader
            name: part_fan_body

Parameters:
  fan_x_shift:
    Type: Float
    Default: -18.0
  fan_lid_patch_margin:
    Type: Float
    Default: 4.0
  fan_rotation_angle:
    Type: Float
    Default: 90.0

Parts:
  YZAxisMcuHolderFanJoiner:
    Type: Shellforgepy::AssemblyJoiner

    Properties:
      Joiner: mege_ender_3v3ke_idex.designs.assemblies.y_z_axis_mcu_holder_fan_joiner.join_y_z_axis_mcu_holder_with_fan
      Properties:
        fan_x_shift:
          $ref: fan_x_shift
        fan_lid_patch_margin:
          $ref: fan_lid_patch_margin
        fan_rotation_angle:
          $ref: fan_rotation_angle
