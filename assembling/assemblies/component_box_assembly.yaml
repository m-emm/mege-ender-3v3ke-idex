ShellforgepyBuilderVersion: "2026-03-27"

Description: Generic one-piece TPU component box assembly

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - top
        - front
        - right
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: component_box
      - source: self
        artifact: non_production_parts
        names:
          - lid_closing_preview
        name_template: "{name}"
        animation:
          lid_close:
            type: rotation
            axis: [1, 0, 0]
            angle_degrees: 180
            origin:
              - $expr:
                  "$sub": "${wall_thickness}  + ${inner_length} / 2"
              - $expr:
                  "$sub":  "${hinge_gap} + ${wall_thickness}/2 + ${lid_clearance} /2"
              - $expr:
                  "$sub": "${inner_height} / 2 +  ${floor_thickness}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - lid_closing_preview
        name_template: "{name}"

  Production:
    process_data_preset: tpu_minimal_quality_minimal_strength_06
    process_data:
      overrides:
        process_overrides:
          enable_support: "0"
          brim_type: no_brim
          sparse_infill_density: "100%"
          wall_loops: "3"
    parts:
      - source: self
        artifact: leader
        name: component_box
    arrange:
      export_individual_parts: false
      plates:
        - name: component_box
          parts:
            - component_box
      auto_assign_plates: false

Parameters:
  inner_length:
    Type: Float
  inner_width:
    Type: Float
  inner_height:
    Type: Float
  wall_thickness:
    Type: Float
  floor_thickness:
    Type: Float
  lid_thickness:
    Type: Float
  lid_clearance:
    Type: Float
  fillet_radius:
    Type: Float
  hinge_gap:
    Type: Float
  hinge_width:
    Type: Float
  hinge_depth:
    Type: Float
  hinge_thickness:
    Type: Float

Parts:
  ComponentBoxAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.component_box_assembly.create_component_box_assembly
