ShellforgepyBuilderVersion: "2026-03-27"

Description: Focused visualization of one injected Tap toolhead stack

Builder:
  Collection: true
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - back
        - top
        - left
        - right
      width: 700
      height: 700
    parts:
      - source: injected
        assembly: tool_head_mount_machined
        artifact: leader
        name: tool_head_mount_machined
      - source: injected
        assembly: idex_tap
        artifact: all
        name_template: "idex_tap_{name}"
      - source: injected
        assembly: mgn7h_rail_with_carriage
        artifact: leader
        name: mgn7h_rail
        animation:
          idex_tap_total_travel:
            - 0
            - 0
            - { $ref: idex_tap_total_travel }

      - source: injected
        assembly: mgn7h_rail_with_carriage
        artifact: followers
        names:
          - carriage
        name: mgn7h_carriage
      - source: injected
        assembly: sprite_extruder
        artifact: all
        name_template: "sprite_extruder_{name}"
        animation:
          idex_tap_total_travel:
            - 0
            - 0
            - { $ref: idex_tap_total_travel }

      - source: injected
        assembly: opb991t11z_sensor
        artifact: all
        name_template: "opb991t11z_sensor_{name}"

  Production:
    parts: []

Parameters:
  idex_tap_total_travel:
    Type: Float

Parts:
  IdexTapStackAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.idex_tap_stack_assembly.create_idex_tap_stack_assembly
