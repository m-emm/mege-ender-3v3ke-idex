ShellforgepyBuilderVersion: "2026-03-27"

Description: Moving shuttle for the T0 Tap mechanism

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - back
        - top
        - left
        - right
      width: 700
      height: 700
    parts:
      - source: self
        artifact: leader
        name: idex_tap_moving_shuttle
        color: [1.0, 0.42, 0.22]
