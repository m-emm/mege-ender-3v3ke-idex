ShellforgepyBuilderVersion: "2026-03-27"

Description: waste bin visualization assembly

Builder:
  Collection: true
  Visualization:
    parts:
      - source: self
        artifact: all
        name_template: "{name}"
      - source: dependencies
        assembly: sprite_extruder_left_assembly
        artifact: all
        name_template: "{assembly_name}_{name}"
        animation:
          x_carriage_1:
            - { $ref: x_axis_x_travel }
            - 0
            - 0
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }

      - source: dependencies
        assembly: part_fan_left_assembly
        artifact: leader
        name_template: "{assembly_name}_{name}"
        animation:
          x_carriage_1:
            - { $ref: x_axis_x_travel }
            - 0
            - 0
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }

      - source: injected
        assembly: waste_bin_left_assembly
        artifact: followers
        names:
          - nozzle_brush_holder
        name_template: "{assembly_name}_{name}"
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }
          waste_bin_left:
            - $expr:
                $sub: "-0.5 * ${waste_bin_width}"
            - 0
            - 0
          waste_bin_right:
            - $expr:
                $sub: "0.5 * ${waste_bin_width}"
            - 0
            - 0
      - source: injected
        assembly: waste_bin_left_assembly
        artifact: followers
        exclude_names:
          - nozzle_brush_holder
        name_template: "{assembly_name}_{name}"
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }
      - source: injected
        assembly: waste_bin_left_assembly
        artifact: non_production_parts
        names:
          - LEFT_FRONT_complete_screw
          - LEFT_BACK_square_nut
          - LEFT_BACK_complete_screw
          - LEFT_BACK_square_nut
          - RIGHT_FRONT_complete_screw
          - RIGHT_FRONT_square_nut
          - RIGHT_BACK_complete_screw
          - RIGHT_BACK_square_nut
          - nozzle_brush
          - nozzle_brush_holder_threaded_insert
          - nozzle_brush_holder_screw
        name_template: "{assembly_name}_{name}"
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }
          waste_bin_left:
            - $expr:
                $sub: "-0.5 * ${waste_bin_width}"
            - 0
            - 0
          waste_bin_right:
            - $expr:
                $sub: "0.5 * ${waste_bin_width}"
            - 0
            - 0
      - source: injected
        assembly: waste_bin_left_assembly
        artifact: non_production_parts
        exclude_names:
          - LEFT_BOTTOM_complete_screw
          - LEFT_BOTTOM_square_nut
          - LEFT_TOP_complete_screw
          - LEFT_TOP_square_nut
          - RIGHT_BOTTOM_complete_screw
          - RIGHT_BOTTOM_square_nut
          - RIGHT_TOP_complete_screw
          - RIGHT_TOP_square_nut
          - nozzle_brush
          - nozzle_brush_holder_threaded_insert
          - nozzle_brush_holder_screw
        name_template: "{assembly_name}_{name}"
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }
      - source: injected
        assembly: waste_bin_left_assembly
        artifact: leader
        name: waste_bin_left
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }
          waste_bin_left:
            - $expr:
                $sub: "-0.5 * ${waste_bin_width}"
            - 0
            - 0
          waste_bin_right:
            - $expr:
                $sub: "0.5 * ${waste_bin_width}"
            - 0
            - 0

      - source: injected
        assembly: z_axis_left_rail
        artifact: leader
        name_template: "{assembly_name}_{name}"
      - source: injected
        assembly: z_axis_left_rail
        artifact: followers
        names:
          - bottom_carriage
          - top_carriage
        name_template: "{assembly_name}_{name}"
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }

      - source: injected
        assembly: z_axis_profile_left
        artifact: all

      - source: injected
        assembly: x_axis_lower_profile
        artifact: all
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }

      - source: injected
        assembly: z_axis_bottom_support_left
        artifact: all
        name_template: "{assembly_name}_{name}"

      - source: injected
        assembly: z_axis_threaded_rod_left
        artifact: leader
        name: z_axis_threaded_rod_left
      - source: injected
        assembly: z_axis_motor_mount_left
        artifact: all
        name_template: "{assembly_name}_{name}"
      - source: injected
        assembly: z_axis_carriage_left
        artifact: all
        name_template: "{assembly_name}_{name}"
        animation:
          z_axis:
            - 0
            - 0
            - { $ref: z_axis_z_travel }

Parameters:
  waste_bin_width:
    Type: Float
  x_axis_x_travel:
    Type: Float
  z_axis_z_travel:
    Type: Float
