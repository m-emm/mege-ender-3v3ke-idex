ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for one ender idex printer foot

Builder:
  Visualization:
    arrange:
      export_step: true
      export_obj: true
      export_stl: false
      export_individual_parts: false
    parts:
      - source: self
        artifact: leader
        name: printer_foot
      - source: self
        artifact: non_production_parts
        name_template: "{name}"

  Production:
    process_data:
      source: mege_3devops.process_data.mender3.process_data_04_high_speed.PROCESS_DATA_TPU_04_HS
      overrides:
        process_overrides:
          brim_type: no_brim
    parts:
      - source: self
        artifact: leader
        name: printer_foot
        transform:
          function: orient_max_planar_area
          kwargs:
            optimize_bed_adhesion_area: true

Parameters:
  printer_foot_height:
    Type: Float
  printer_foot_base_size:
    Type: Float
  printer_foot_top_size:
    Type: Float
  printer_foot_screw_length:
    Type: Float
  printer_foot_screw_cylinder_head_clearance:
    Type: Float
  printer_foot_mount_screw_size:
    Type: String
  printer_foot_mount_screw_sink:
    Type: Float
  printer_foot_groove_filler_width:
    Type: Float
  printer_foot_groove_filler_thickness:
    Type: Float
  tpu_slit_thickness:
    Type: Float
  tpu_slit_clearance:
    Type: Float
  tpu_slit_distance:
    Type: Float
  tpu_num_slits:
    Type: Integer

Parts:
  PrinterFootAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.printer_foot_assembly.create_printer_foot_assembly
