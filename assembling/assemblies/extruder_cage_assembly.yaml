ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the shared Tap-compatible extruder cage

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - top
        - left
        - front
        - isometric
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: extruder_cage
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
      - source: injected
        assembly: sprite_extruder
        artifact: all
      - source: injected
        assembly: nitehawk_board
        artifact: followers
        name_template: "nitehawk_board_{name}"
      - source: injected
        assembly: tool_head_mount_machined
        artifact: leader
        name: tool_head_mount_machined
  Production:
    parts: []

Parameters:
  extruder_cage_mount_plate_thickness:
    Type: Float
  extruder_cage_mount_plate_fillet_radius:
    Type: Float
  extruder_cage_flange_thickness:
    Type: Float
  extruder_cage_screw_size:
    Type: String
  extruder_cage_top_right_bridge_clearance:
    Type: Float
  tool_head_mount_base_plate_height:
    Type: Float
  tool_head_mount_sprite_mount_screw_length:
    Type: Float
  tool_head_additional_mount_plate_clearance:
    Type: Float
  tool_head_additional_mount_plate_depth:
    Type: Float
  duct_back_mount_plate_height:
    Type: Float
  duct_back_mount_plate_height_border:
    Type: Float
  duct_back_mount_plate_offset:
    Type: Float
  duct_back_mount_plate_width_border:
    Type: Float
  nitehawk_holder_mount_tower_diameter:
    Type: Float
  nitehawk_holder_mount_tower_height:
    Type: Float
  nitehawk_mount_tower_base_extension:
    Type: Float
  nitehawk_holes_center_distance:
    Type: Float
  nitehawk_nut_cutter_slack:
    Type: Float
  BIG_THING:
    Type: Float

Parts:
  ExtruderCageAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.extruder_cage_assembly.create_extruder_cage_assembly
