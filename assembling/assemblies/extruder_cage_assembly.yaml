ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the standalone extruder cage

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - top
        - left
        - front
        - isometric
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: extruder_cage
      - source: injected
        assembly: sprite_extruder
        artifact: all

  Production:
    parts: []

Parameters:
  extruder_cage_mount_plate_thickness:
    Type: Float
  extruder_cage_flange_thickness:
    Type: Float
  extruder_cage_screw_size:
    Type: String

Parts:
  ExtruderCageAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.extruder_cage_assembly.create_extruder_cage_assembly
