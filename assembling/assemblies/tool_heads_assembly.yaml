  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    parts:
      - source: dependencies
        assembly: extruder_cage_left_joined_assembly
        artifact: leader
        name: extruder_cage_left_joined
        prod_rotation_angle: 135
        prod_rotation_axis: [0, 1, 0]
      - source: dependencies
        assembly: tool_head_cable_attach_shield_left_assembly
        artifact: leader
        name: tool_head_cable_attach_shield_left
        prod_rotation_angle: 90
        prod_rotation_axis: [1, 0, 0]
      - source: dependencies
        assembly: part_fan_left_joined_assembly
        artifact: leader
        name: part_fan_left_joined
        prod_rotation_angle: 50
        prod_rotation_axis: [1, 0, 0]
      - source: dependencies
        assembly: extruder_cage_right_joined_assembly
        artifact: leader
        name: extruder_cage_right_joined
        prod_rotation_angle: 135
        prod_rotation_axis: [0, 1, 0]
      - source: dependencies
        assembly: tool_head_cable_attach_shield_right_assembly
        artifact: leader
        name: tool_head_cable_attach_shield_right
        prod_rotation_angle: 90
        prod_rotation_axis: [1, 0, 0]
      - source: dependencies
        assembly: part_fan_right_joined_assembly
        artifact: leader
        name: part_fan_right_joined
        prod_rotation_angle: 50
        prod_rotation_axis: [1, 0, 0]

    arrange:
      export_individual_parts: false
      prod_gap: 6.0
      plates:
        - name: tool_head_right_petgcf
          filename: tool_head_right_petgcf
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                enable_support: "1"
          parts:
            - extruder_cage_right_joined
            - tool_head_cable_attach_shield_right
            - part_fan_right_joined
        - name: tool_head_left_petgcf
          filename: tool_head_left_petgcf
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                enable_support: "1"
          parts:
            - extruder_cage_left_joined
            - tool_head_cable_attach_shield_left
            - part_fan_left_joined

      auto_assign_plates: false

Parameters:
  x_axis_x_travel:
    Type: Float
  x_axis_x_travel_negative:
    Type: Float
