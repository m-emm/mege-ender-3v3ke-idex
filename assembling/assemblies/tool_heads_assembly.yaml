ShellforgepyBuilderVersion: "2026-03-27"

Description: Lean animated visualization of the two X-axis tool heads

Builder:
  Collection: true

  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - back
        - top
        - left
        - right
      width: 700
      height: 700
    parts:
      - source: injected
        assembly: x_axis_lower_profile
        artifact: leader
        name: x_axis_lower_profile
      - source: injected
        assembly: x_axis_top_profile
        artifact: leader
        name: x_axis_top_profile
      - source: injected
        assembly: x_axis_rail
        artifact: leader
        name: x_axis_rail

      - source: injected
        assembly: x_axis_left_carriage
        artifact: all
        name_template: "x_axis_left_carriage_{name}"
        animation:
          x_carriage_1:
            - { $ref: x_axis_x_travel }
            - 0
            - 0
      - source: injected
