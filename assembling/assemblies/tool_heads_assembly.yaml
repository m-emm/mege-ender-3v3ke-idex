  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    parts:
      # - source: dependencies
      #   assembly: extruder_cage_right_joined_assembly
      #   artifact: leader
      #   name: extruder_cage_right_joined
      #   prod_rotation_angle: 135
      #   prod_rotation_axis: [0, 1, 0]
      - source: dependencies
        assembly: idex_tap_t1_joined_assembly
        artifact: leader
        name: idex_tap_t1_joined
        prod_rotation_angle: 32
        prod_rotation_axis: [1, 0, 0]
      - source: dependencies
        assembly: tool_head_cable_attach_shield_right_assembly
        artifact: leader
        name: tool_head_cable_attach_shield_right
        prod_rotation_angle: 90
        prod_rotation_axis: [1, 0, 0]

      # - source: dependencies
      #   assembly: tool_head_mount_machined_top_assembly
      #   artifact: leader
      #   name: tool_head_mount_machined_top
    arrange:
      export_individual_parts: false
      prod_gap: 6.0
      plates:
        - name: tool_heads_petgcf
          filename: tool_heads_petgcf
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                enable_support: "1"
          parts:
            #- extruder_cage_right_joined
            - idex_tap_t1_joined
            - tool_head_cable_attach_shield_right
            # - tool_head_mount_machined_top
      auto_assign_plates: false

