ShellforgepyBuilderVersion: "2026-03-27"

Description: Lidded profile-mounted housing for two Nitehawk USB daughterboards

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - top
        - left
        - right
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: nitehawk_usb_dual_board_housing
        color: [1, 1, 1]
      - source: self
        artifact: followers
        names:
          - nitehawk_usb_dual_housing_lid
        name_template: "{name}"
        color: [1, 1, 1]
      - source: self
        artifact: non_production_parts
        names:
          - board_1_board
          - board_1_terminal_block
          - board_1_usb_c_connector
          - board_1_front_plug
          - board_1_white_connector
          - board_2_board
          - board_2_terminal_block
          - board_2_usb_c_connector
          - board_2_front_plug
          - board_2_white_connector
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        names:
          - board_mount_screws
          - lid_mount_screws
          - profile_mount_screws
        name_template: "{name}"
        color: [0.78, 0.78, 0.72]

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    parts:
      - source: self
        artifact: leader
        name: nitehawk_usb_dual_board_housing
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - nitehawk_usb_dual_housing_lid
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
    prototype:
      include_parts:
        - nitehawk_usb_dual_board_housing
      box_cutters:
        - part: nitehawk_usb_dual_board_housing
          around: self.cutters.board_1_mounting_hole_front_left_pilot_hole
          size:
            - 10
            - 31
            - 12
          offset:
            - 0
            - 11.8
            - 0
      process_data_preset: petgcf_medium_strength_high_speed_06
      arrange:
        export_individual_parts: false
        plates:
          - name: nitehawk_usb_dual_board_housing_screw_hole_prototype
            filename: nitehawk_usb_dual_screw_hole_proto
            parts:
              - nitehawk_usb_dual_board_housing
        auto_assign_plates: false
    arrange:
      export_individual_parts: false
      prod_gap: 12.0
      plates:
        - name: nitehawk_usb_dual_board_housing
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                brim_type: no_brim
                enable_support: "1"
                support_type: tree(auto)
                support_style: organic
                support_on_build_plate_only: "1"
                support_top_z_distance: "0.47"
                max_bridge_length: "0"
                bridge_no_support: "0"
                support_remove_small_overhang: "0"
                support_interface_top_layers: "2"
                support_interface_spacing: "0.8"
                support_object_xy_distance: "0.8"
                support_bottom_z_distance: "0.2"
                wall_loops: "3"
          parts:
            - nitehawk_usb_dual_board_housing
            - nitehawk_usb_dual_housing_lid
      auto_assign_plates: false

