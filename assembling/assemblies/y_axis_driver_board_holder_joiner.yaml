ShellforgepyBuilderVersion: "2026-03-27"

Description: Joiner for the Y-axis driver-board holder and positioned TMC5160T Plus

Builder:
  Outputs:
    y_axis_driver_board_holder:
      Visualization:
        preview:
          enabled: true
          views:
            - isometric
            - top
            - bottom
            - front
            - back
          width: 900
          height: 700
        parts:
          - source: self
            artifact: leader
            name: y_axis_driver_board_holder
          - source: self
            artifact: followers
            name_template: "{name}"
          - source: self
            artifact: non_production_parts
            name_template: "{name}"
          - source: injected
            assembly: bigtreetech_stepper_driver
            artifact: leader
            name: bigtreetech_stepper_driver_tmc_5160t_plus
          - source: injected
            assembly: bigtreetech_stepper_driver
            artifact: non_production_parts
            name_template: "bigtreetech_stepper_driver_{name}"

      Production:
        process_data_preset: petgcf_max_strength_high_speed_06
        parts:
          - source: self
            artifact: leader
            name: y_axis_driver_board_holder
          - source: self
            artifact: followers
            name_template: "{name}"

Parameters:
  board_holder_mount_screw_hole_inset:
    Type: Float
  board_holder_mount_screw_size:
    Type: String
    Default: M3

Parts:
  YAxisDriverBoardHolderJoiner:
    Type: Shellforgepy::AssemblyJoiner

    Properties:
      Joiner: mege_ender_3v3ke_idex.designs.assemblies.y_axis_driver_board_holder_joiner.join_y_axis_driver_board_holder_with_tmc5160t_plus
      Properties:
        board_holder_mount_screw_hole_inset:
          $ref: board_holder_mount_screw_hole_inset
        board_holder_mount_screw_size:
          $ref: board_holder_mount_screw_size
