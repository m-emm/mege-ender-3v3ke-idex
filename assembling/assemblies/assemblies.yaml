    arguments:
      material_name: petg_cf_generic
      nozzle_diameter_mm: 0.6
      nozzle_hardened: true
      nozzle_high_flow: true
      strength_factor: 0.9
      quality_factor: 0.5
    overrides:
      process_overrides:
        sparse_infill_pattern: "cubic"
        support_object_first_layer_gap: "2.5"
        xy_contour_compensation: "-0.3" # This is a carefully calibrated value, measured at 2026-04-14
        xy_hole_compensation: "0.4" # This is a carefully calibrated value, measured at 2026-04-14
        z_hop: "0.45"
        retract_lift_above: "0"
        retract_lift_below: "0"
        retract_lift_enforce: "All Surfaces"
        wipe: "0"
        machine_end_gcode: |-
          G92 E0 ; Reset extruder
          G1 E-1.2 F1200 ; Retract before lift and parking
          G90 ; Absolute positioning
          {if max_layer_z < printable_height}
          G1 Z{min(max_layer_z+150, printable_height)} F480 ; Lift print clear, capped at Z max
          {endif}
          M106 S0 ;Turn-off fan
          T0 ;Park right carriage, select and park left carriage
          M104 S0 ;Turn-off left hotend
          M140 S0 ;Turn-off bed

          M84 X Y E ;Disable all steppers but Z
        travel_speed: "100"
        inner_wall_speed: "100"
        solid_infill_speed: "100"
        internal_solid_infill_speed: "100"
        sparse_infill_speed: "100"
