        sparse_infill_acceleration: "1500"
        bridge_acceleration: "1500"
        travel_jerk: "2"
        default_jerk: "2"
        initial_layer_jerk: "2"
        outer_wall_jerk: "2"
        inner_wall_jerk: "2"
        infill_jerk: "2"
