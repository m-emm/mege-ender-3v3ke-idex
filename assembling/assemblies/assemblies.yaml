      z_axis_guide_rod_length: !Ref z_axis_guide_rod_length
      z_axis_guide_rod_profile_distance: !Ref z_axis_guide_rod_profile_distance

  - name: right_z_axis_guide_rod_assembly

    resource_file: z_axis_guide_rod_assembly.yaml
    depends_on:
      - right_z_axis_profile_assembly
    inject_parts:
      z_axis_profile: right_z_axis_profile_assembly
    parameters:
      z_axis_base_z_offset: !Ref z_axis_base_z_offset
      z_axis_guide_rod_diameter: !Ref z_axis_guide_rod_diameter
      z_axis_guide_rod_length: !Ref z_axis_guide_rod_length
      z_axis_guide_rod_profile_distance: !Ref z_axis_guide_rod_profile_distance

  - name: left_z_axis_bottom_support_assembly

    resource_file: z_axis_bottom_support_assembly.yaml
    depends_on:
      - left_z_axis_profile_assembly
      - left_z_axis_threaded_rod_assembly
      - left_z_axis_motor_mount_assembly
    inject_parts:
      z_axis_profile: left_z_axis_profile_assembly
      z_axis_threaded_rod: left_z_axis_threaded_rod_assembly
      z_axis_motor_mount: left_z_axis_motor_mount_assembly
    parameters:
      side: left
      z_axis_axial_ball_bearing_8_x_19_ball_count: !Ref z_axis_axial_ball_bearing_8_x_19_ball_count
      z_axis_axial_ball_bearing_8_x_19_ball_diameter: !Ref z_axis_axial_ball_bearing_8_x_19_ball_diameter
      z_axis_axial_ball_bearing_8_x_19_ball_holder_disc_inner_diameter: !Ref z_axis_axial_ball_bearing_8_x_19_ball_holder_disc_inner_diameter
      z_axis_axial_ball_bearing_8_x_19_ball_holder_disc_outer_diameter: !Ref z_axis_axial_ball_bearing_8_x_19_ball_holder_disc_outer_diameter
      z_axis_axial_ball_bearing_8_x_19_ball_holder_disc_thickness: !Ref z_axis_axial_ball_bearing_8_x_19_ball_holder_disc_thickness
      z_axis_axial_ball_bearing_8_x_19_disc_thickness: !Ref z_axis_axial_ball_bearing_8_x_19_disc_thickness
      z_axis_axial_ball_bearing_8_x_19_inner_diameter: !Ref z_axis_axial_ball_bearing_8_x_19_inner_diameter
