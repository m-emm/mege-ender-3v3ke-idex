context:
  BIG_THING: 500

globals:
  $import: [idex_parameters.yaml]

builder_defaults:
  Production:
    arrange:
      bed_width: 220
      export_step: true
      export_obj: true
      export_stl: true
      export_individual_parts: true

placement:
  alignments:
    - part: print_bed_assembly.non_production_parts.print_bed_foil
      to: printer_frame_assembly
      alignment: TOP
      post_translation:
        - 0
        - 0
        - $ref: print_bed_vertical_gap_to_frame
    - part: y_axis_assembly
      to: printer_frame_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: y_axis_assembly.non_production_parts.profile_left
      to: printer_frame_assembly
      alignment: CENTER
      axes: [2]
    - part: y_axis_assembly.non_production_parts.carriages_fused
      to: print_bed_undercarriage_assembly
      alignment: STACK_BOTTOM
    - part: print_bed_assembly
      to: y_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [1]
    - part: print_bed_undercarriage_assembly
      to: y_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [1]

    - part: y_axis_rail_carrier_brackets_assembly.non_production_parts.profile_side_mount_plate_left_front
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: CENTER
      axes: [2]

    - part: y_axis_endstop_holder_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: CENTER
      post_translation:
        - $ref: y_axis_endstop_x_offset
        - 0
        - 0
    - part: y_axis_endstop_holder_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: BOTTOM
    - part: y_axis_endstop_holder_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: STACK_RIGHT
      stack_gap:
        $ref: y_axis_endstop_z_offset
    - part: y_axis_endstop_holder_assembly.non_production_parts.board
      to: y_axis_assembly.non_production_parts.rail_right
      alignment: STACK_BACK
      stack_gap:
        $ref: y_axis_endstop_rail_gap
    - part: y_axis_endstop_holder_assembly.cutters.mount_eye_hole
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: CENTER
      axes: [2]

    - part: creality_endstop_holder_assembly
      to: printer_frame_assembly
      alignment: TOP
      post_rotation:
        angle: -90
        axis: [0, 1, 0]
        center: creality_endstop_holder_assembly.CENTER
    - part: x_axis_endstop_left_assembly
      post_rotation:
        angle: 90
        axis: [0, 0, 1]
        center: x_axis_endstop_left_assembly.CENTER
    - part: x_axis_endstop_left_assembly
      to: x_axis_lower_profile_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_endstop_left_assembly
      to: x_axis_rail_assembly
      alignment: BOTTOM
      post_translation:
        - 0
        - 0
        - $expr:
            "$sub": "-1 * ${endstop_holder_groove_holder_height}"
    - part: x_axis_endstop_left_assembly.non_production_parts.board
      to: x_axis_rail_assembly
      alignment: STACK_LEFT
      stack_gap:
        $ref: endstop_holder_stack_gap

    - part: x_axis_endstop_right_assembly
      post_rotation:
        angle: -90
        axis: [0, 0, 1]
        center: x_axis_endstop_right_assembly.CENTER
    - part: x_axis_endstop_right_assembly
      to: x_axis_lower_profile_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_endstop_right_assembly
      to: x_axis_rail_assembly
      alignment: BOTTOM
      post_translation:
        - 0
        - 0
        - $expr:
            "$sub": "-1 * ${endstop_holder_groove_holder_height}"
    - part: x_axis_endstop_right_assembly.non_production_parts.board
      to: x_axis_rail_assembly
      alignment: STACK_RIGHT
      stack_gap:
        $ref: endstop_holder_stack_gap

    - part: x_axis_motor_mount_bottom_assembly.non_production_parts.profile_to_align
      to: x_axis_lower_profile_assembly
      alignment: CENTER
    - part: x_axis_motor_mount_top_assembly.non_production_parts.profile_to_align
      to: x_axis_top_profile_assembly
      alignment: CENTER

    - part: x_axis_top_profile_assembly
      to: x_axis_lower_profile_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_top_profile_assembly
      to: x_axis_lower_profile_assembly
      alignment: STACK_TOP
      stack_gap:
        $ref: x_axis_profile_stack_gap
      rigid_attach: true
    - part: x_axis_rail_assembly
      to: x_axis_lower_profile_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_rail_assembly
      to: x_axis_lower_profile_assembly
      alignment: STACK_TOP
      rigid_attach: true
    - part: x_axis_left_carriage_assembly
      to: x_axis_rail_assembly
      alignment: CENTER
      axes: [0, 1]
      post_translation:
        - $ref: x_axis_left_carriage_x_offset
        - 0
        - $ref: x_axis_carriage_z_offset
      rigid_attach: true
    - part: x_axis_right_carriage_assembly
      to: x_axis_rail_assembly
      alignment: CENTER
      axes: [0, 1]
      post_translation:
        - $ref: x_axis_right_carriage_x_offset
        - 0
        - $ref: x_axis_carriage_z_offset
      rigid_attach: true

    - part: left_z_axis_profile_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: CENTER
      axes: [0, 1]
    - part: left_z_axis_profile_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: STACK_TOP
    - part: right_z_axis_profile_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: CENTER
      axes: [0, 1]
    - part: right_z_axis_profile_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: STACK_TOP
    - part: left_z_axis_threaded_rod_assembly
      to: left_z_axis_profile_assembly
      alignment: CENTER
      axes: [0]
      post_translation:
        - $ref: z_axis_threaded_rod_profile_center_in_offset
        - 0
        - 0
    - part: left_z_axis_threaded_rod_assembly
      to: left_z_axis_profile_assembly
      alignment: STACK_FRONT
      stack_gap:
        $ref: z_axis_threaded_rod_profile_distance
    - part: left_z_axis_threaded_rod_assembly.non_production_parts.motor_body_reference
      to: left_z_axis_profile_assembly
      alignment: BOTTOM
    - part: right_z_axis_threaded_rod_assembly
      to: right_z_axis_profile_assembly
      alignment: CENTER
      axes: [0]
      post_translation:
        - $ref: z_axis_threaded_rod_profile_center_in_offset_negative
        - 0
        - 0
    - part: right_z_axis_threaded_rod_assembly
      to: right_z_axis_profile_assembly
      alignment: STACK_FRONT
      stack_gap:
        $ref: z_axis_threaded_rod_profile_distance
    - part: right_z_axis_threaded_rod_assembly.non_production_parts.motor_body_reference
      to: right_z_axis_profile_assembly
      alignment: BOTTOM
    - part: x_axis_assembly
      to: printer_frame_assembly
      alignment: CENTER
      axes: [0]
    - part: x_axis_assembly.non_production_parts.lower_axis_profile
      to: printer_frame_assembly.non_production_parts.frame_profile_front
      alignment: STACK_BACK
      stack_gap:
        $ref: x_axis_front_gap_to_frame_front
    - part: sprite_extruder_left_assembly
      post_rotation:
        angle: 180
        axis: [0, 0, 1]
        center: sprite_extruder_left_assembly.CENTER
    - part: sprite_extruder_left_assembly
      to: x_axis_left_carriage_assembly
      alignment: CENTER
      axes: [0]
    - part: sprite_extruder_left_assembly
      to: x_axis_left_carriage_assembly
      alignment: STACK_FRONT
      stack_gap:
        $ref: x_axis_sprite_extruder_carriage_stack_gap
    - part: sprite_extruder_left_assembly
      to: x_axis_rail_assembly
      alignment: TOP
      post_translation:
        - 0
        - 0
        - $ref: x_axis_sprite_extruder_rail_z_offset
      rigid_attach: true
    - part: sprite_extruder_right_assembly
      post_rotation:
        angle: 180
        axis: [0, 0, 1]
        center: sprite_extruder_right_assembly.CENTER
    - part: sprite_extruder_right_assembly
      to: x_axis_right_carriage_assembly
      alignment: CENTER
      axes: [0]
    - part: sprite_extruder_right_assembly
      to: x_axis_right_carriage_assembly
      alignment: STACK_FRONT
      stack_gap:
        $ref: x_axis_sprite_extruder_carriage_stack_gap
    - part: sprite_extruder_right_assembly
      to: x_axis_rail_assembly
      alignment: TOP
      post_translation:
        - 0
        - 0
        - $ref: x_axis_sprite_extruder_rail_z_offset
      rigid_attach: true
    - part: sprite_extruder_left_assembly.non_production_parts.hotend
      to: print_bed_assembly.non_production_parts.print_bed_foil
      alignment: STACK_TOP
      stack_gap:
        $ref: nozzle_bed_reach_margin
    - part: left_z_axis_carriage_assembly.non_production_parts.x_axis_alignment_reference
      to: x_axis_assembly.non_production_parts.lower_axis_profile
      alignment: BOTTOM
    - part: right_z_axis_carriage_assembly.non_production_parts.x_axis_alignment_reference
      to: x_axis_assembly.non_production_parts.lower_axis_profile
      alignment: BOTTOM

process_data_generators:
  mege3devops_parametric:
    function: mege_3devops.process_data.parametric.resolve_process_data_from_parameters
    arguments:
      printer_id: megemaster

process_data_presets:
  petgcf_medium_strength_high_speed_06:
    generator: mege3devops_parametric
    arguments:
      material_name: petg_cf_generic
      nozzle_diameter_mm: 0.6
      nozzle_hardened: true
      nozzle_high_flow: true
      strength_factor: 0.5
      quality_factor: 0.5
    overrides:
      process_overrides:
        sparse_infill_pattern: "cubic"
        support_object_first_layer_gap: "2.5"
        xy_contour_compensation: "-0.3" # This is a carefully calibrated value, measured at 2026-04-14 using  assembling/assemblies/calibration_assembly.yaml for the petgcf_medium_strength_high_speed_06 preset
        xy_hole_compensation: "0.4" # This is a carefully calibrated value, measured at 2026-04-14 using  assembling/assemblies/calibration_assembly.yaml for the petgcf_medium_strength_high_speed_06 preset

  petgcf_max_strength_high_speed_06:
    generator: mege3devops_parametric
    arguments:
      material_name: petg_cf_generic
      nozzle_diameter_mm: 0.6
      nozzle_hardened: true
      nozzle_high_flow: true
      strength_factor: 0.9
      quality_factor: 0.5
    overrides:
      process_overrides:
        sparse_infill_pattern: "cubic"
        support_object_first_layer_gap: "2.5"
        xy_contour_compensation: "-0.3" # This is a carefully calibrated value, measured at 2026-04-14
        xy_hole_compensation: "0.4" # This is a carefully calibrated value, measured at 2026-04-14

  petgcf_medium_strength_max_quality_06:
    generator: mege3devops_parametric
    arguments:
      material_name: petg_cf_generic
      nozzle_diameter_mm: 0.6
      nozzle_hardened: true
      nozzle_high_flow: true
      strength_factor: 0.5
      quality_factor: 1.0
    overrides:
      process_overrides:
        sparse_infill_pattern: "cubic"
        support_object_first_layer_gap: "2.5"

  tpu_minimal_quality_minimal_strength_06:
    generator: mege3devops_parametric
    arguments:
      material_name: esun_tpu_95a
      nozzle_diameter_mm: 0.6
      nozzle_hardened: true
      nozzle_high_flow: true
      strength_factor: 0.4
      quality_factor: 0.0
    overrides:
      process_overrides:
        brim_type: "no_brim"
        sparse_infill_pattern: "cubic"

assemblies:
  - name: printer_frame_assembly

    depends_on: []
    parameters:
      frame_profile_type: "4040"

  - name: printer_feet_assembly

    depends_on:
      - printer_frame_assembly
    inject_parts:
      frame: printer_frame_assembly.leader

  - name: print_bed_assembly

    depends_on:
      - printer_frame_assembly
    inject_parts:
      frame: printer_frame_assembly.leader

  - name: print_bed_undercarriage_assembly

    depends_on:
      - print_bed_assembly
    inject_parts:
      print_bed: print_bed_assembly.leader
      damper_left_front: print_bed_assembly.non_production_parts.damper_left_front
      damper_left_back: print_bed_assembly.non_production_parts.damper_left_back
      damper_right_front: print_bed_assembly.non_production_parts.damper_right_front
      damper_right_back: print_bed_assembly.non_production_parts.damper_right_back

  - name: y_axis_drive_assembly

    depends_on:
      - printer_frame_assembly
      - print_bed_undercarriage_assembly
    parameters:
      y_axis_drive_motor_pulley_teeth: !Ref y_axis_drive_motor_pulley_teeth
      y_axis_drive_idler_teeth: !Ref y_axis_drive_idler_teeth
    inject_parts:
      frame_back_profile: printer_frame_assembly.non_production_parts.frame_profile_back
      frame_front_profile: printer_frame_assembly.non_production_parts.frame_profile_front
      back_belt_reference: print_bed_undercarriage_assembly.cutters.belt_path_cutter_back
      front_belt_reference: print_bed_undercarriage_assembly.cutters.belt_path_cutter_front

  - name: y_axis_assembly

    depends_on:
      - y_axis_endstop_holder_assembly
      - y_axis_carriage_stopper_assembly
    inject_parts:
      y_axis_carriage_stopper_assembly: y_axis_carriage_stopper_assembly

  - name: y_axis_carriage_stopper_assembly

    resource_file: carriage_stopper_assembly.yaml
    depends_on: []
    parameters:
      stopper_width: !Ref y_axis_carriage_stopper_width
      stopper_length: !Ref y_axis_carriage_stopper_length
      stopper_thickness: !Ref y_axis_carriage_stopper_thickness
      stopper_fillet_radius: !Ref y_axis_carriage_stopper_fillet_radius
      mount_screw_size: !Ref y_axis_carriage_stopper_mount_screw_size
      mount_screw_length: !Ref y_axis_carriage_stopper_mount_screw_length
      no_fillets_at:
        - BOTTOM
        - FRONT
        - BACK

  - name: y_axis_endstop_holder_assembly

    resource_file: y_axis_endstop_holder_assembly.yaml
    depends_on: []
    parameters:
      up: !Ref y_axis_endstop_up
      out: !Ref y_axis_endstop_out
      endstop_board_holder_mount_eye_thickness: !Ref endstop_board_holder_mount_eye_thickness
      endstop_board_holder_mount_eye_length: !Ref endstop_board_holder_mount_eye_length
      endstop_board_holder_mount_eye_width: !Ref endstop_board_holder_mount_eye_width
      endstop_board_holder_mount_eye_hole_diameter: !Ref endstop_board_holder_mount_eye_hole_diameter
      endstop_board_holder_mount_eye_offset: !Ref endstop_board_holder_mount_eye_offset
      endstop_board_holder_mount_eye_fillet_radius: !Ref endstop_board_holder_mount_eye_fillet_radius
      endstop_board_holder_mount_eye_num_holes: !Ref endstop_board_holder_mount_eye_num_holes

  - name: z_axis_top_mount_endstop_holder_assembly

    resource_file: y_axis_endstop_holder_assembly.yaml
    depends_on: []
    parameters:
      up: [0, -1, 0]
      out: [0, 0, -1]
      endstop_board_holder_mount_eye_thickness: !Ref endstop_board_holder_mount_eye_thickness
      endstop_board_holder_mount_eye_length: !Ref endstop_board_holder_mount_eye_length
      endstop_board_holder_mount_eye_width: !Ref endstop_board_holder_mount_eye_width
      endstop_board_holder_mount_eye_hole_diameter: !Ref endstop_board_holder_mount_eye_hole_diameter
      endstop_board_holder_mount_eye_offset: !Ref endstop_board_holder_mount_eye_offset
      endstop_board_holder_mount_eye_fillet_radius: !Ref endstop_board_holder_mount_eye_fillet_radius
      endstop_board_holder_mount_eye_num_holes: !Ref endstop_board_holder_mount_eye_num_holes

  - name: creality_endstop_board_assembly

    resource_file: creality_endstop_board_assembly.yaml
    depends_on: []

  - name: creality_endstop_holder_assembly

    resource_file: creality_endstop_holder_assembly.yaml
    depends_on:
      - creality_endstop_board_assembly
    inject_parts:
      creality_endstop_board_assembly: creality_endstop_board_assembly
    parameters:
      up: !Ref y_axis_endstop_up
      out: !Ref y_axis_endstop_out
      creality_endstop_holder_thickness: !Ref creality_endstop_holder_thickness
      creality_endstop_holder_bottom_clearance: !Ref creality_endstop_holder_bottom_clearance
      creality_endstop_holder_sink: !Ref creality_endstop_holder_sink
      creality_endstop_holder_length_oversize: !Ref creality_endstop_holder_length_oversize
      creality_endstop_holder_width_oversize: !Ref creality_endstop_holder_width_oversize
      creality_endstop_holder_board_clearance: !Ref creality_endstop_holder_board_clearance
      creality_endstop_holder_screw_size: !Ref creality_endstop_holder_screw_size
      creality_endstop_holder_nut_cutter_slack: !Ref creality_endstop_holder_nut_cutter_slack

  - name: x_axis_assembly

    depends_on:
      - x_axis_carriage_stopper_left_assembly
      - x_axis_carriage_stopper_right_assembly
      - x_axis_lower_profile_assembly
      - x_axis_top_profile_assembly
      - x_axis_motor_mount_bottom_assembly
      - x_axis_motor_mount_top_assembly
      - x_axis_rail_assembly
      - x_axis_left_carriage_assembly
      - x_axis_right_carriage_assembly
      - x_axis_endstop_left_assembly
      - x_axis_endstop_right_assembly
    inject_parts:
      x_axis_carriage_stopper_left: x_axis_carriage_stopper_left_assembly
      x_axis_carriage_stopper_right: x_axis_carriage_stopper_right_assembly
      x_axis_lower_profile: x_axis_lower_profile_assembly
      x_axis_top_profile: x_axis_top_profile_assembly
      x_axis_motor_mount_bottom: x_axis_motor_mount_bottom_assembly
      x_axis_motor_mount_top: x_axis_motor_mount_top_assembly
      x_axis_rail: x_axis_rail_assembly
      x_axis_left_carriage: x_axis_left_carriage_assembly
      x_axis_right_carriage: x_axis_right_carriage_assembly
      x_axis_endstop_left: x_axis_endstop_left_assembly
      x_axis_endstop_right: x_axis_endstop_right_assembly

  - name: x_axis_carriage_stopper_left_assembly

    resource_file: carriage_stopper_assembly.yaml
    depends_on: []
    parameters:
      stopper_width: !Ref x_axis_carriage_stopper_width
      stopper_length: !Ref x_axis_carriage_stopper_depth
      stopper_thickness: !Ref x_axis_carriage_stopper_thickness
      stopper_fillet_radius: !Ref x_axis_carriage_stopper_fillet_radius
      mount_screw_size: !Ref x_axis_carriage_stopper_mount_screw_size
      mount_screw_length: !Ref x_axis_carriage_stopper_mount_screw_length
      no_fillets_at:
        - BOTTOM
        - RIGHT

  - name: x_axis_carriage_stopper_right_assembly

    resource_file: carriage_stopper_assembly.yaml
    depends_on: []
    parameters:
      stopper_width: !Ref x_axis_carriage_stopper_width
      stopper_length: !Ref x_axis_carriage_stopper_depth
      stopper_thickness: !Ref x_axis_carriage_stopper_thickness
      stopper_fillet_radius: !Ref x_axis_carriage_stopper_fillet_radius
      mount_screw_size: !Ref x_axis_carriage_stopper_mount_screw_size
      mount_screw_length: !Ref x_axis_carriage_stopper_mount_screw_length
      no_fillets_at:
        - BOTTOM
        - LEFT

  - name: x_axis_lower_profile_assembly

    resource_file: x_axis_profile_assembly.yaml
    depends_on: []
    parameters:
      profile_name: x_axis_lower_profile
      x_axis_profile_length: !Ref x_axis_profile_length

  - name: x_axis_top_profile_assembly

    resource_file: x_axis_profile_assembly.yaml
    depends_on: []
    parameters:
      profile_name: x_axis_top_profile
      x_axis_profile_length: !Ref x_axis_profile_length

  - name: x_axis_motor_mount_bottom_assembly

    resource_file: x_axis_motor_mount_assembly.yaml
    depends_on:
      - x_axis_lower_profile_assembly
    inject_parts:
      profile_to_align: x_axis_lower_profile_assembly
    parameters:
      profile_position: bottom

  - name: x_axis_motor_mount_top_assembly

    resource_file: x_axis_motor_mount_assembly.yaml
    depends_on:
      - x_axis_top_profile_assembly
    inject_parts:
      profile_to_align: x_axis_top_profile_assembly
    parameters:
      profile_position: top

  - name: x_axis_rail_assembly

    resource_file: x_axis_rail_assembly.yaml
    depends_on: []
    parameters:
      x_axis_rail_length: !Ref x_axis_rail_length

  - name: x_axis_carriage_assembly

    depends_on: []

  - name: x_axis_left_carriage_assembly

    resource_file: x_axis_carriage_assembly.yaml
    depends_on: []

  - name: x_axis_right_carriage_assembly

    resource_file: x_axis_carriage_assembly.yaml
    depends_on: []

  - name: x_axis_profiles_rails_carriages_assembly

    depends_on:
      - x_axis_lower_profile_assembly
      - x_axis_top_profile_assembly
      - x_axis_rail_assembly
      - x_axis_left_carriage_assembly
      - x_axis_right_carriage_assembly

  - name: x_axis_endstop_left_assembly

    resource_file: x_axis_endstop_assembly.yaml
    depends_on:
      - x_axis_lower_profile_assembly
      - x_axis_rail_assembly
      - creality_endstop_holder_assembly
    inject_parts:
      creality_endstop_holder_assembly: creality_endstop_holder_assembly
    parameters:
      x_axis_endstop_mount_base_depth: !Ref x_axis_endstop_mount_base_depth
      x_axis_endstop_mount_base_thickness: !Ref x_axis_endstop_mount_base_thickness
      x_axis_endstop_mount_base_fillet_radius: !Ref x_axis_endstop_mount_base_fillet_radius
      x_axis_endstop_mount_base_width: !Ref x_axis_endstop_mount_base_width
      x_axis_endstop_mount_base_inward_extension: !Ref x_axis_endstop_mount_base_inward_extension
      endstop_holder_mount_screw_size: !Ref endstop_holder_mount_screw_size
      endstop_holder_mount_screw_length: !Ref endstop_holder_mount_screw_length
      endstop_holder_groove_holder_length: !Ref endstop_holder_groove_holder_length
      endstop_holder_groove_holder_bottom_width: !Ref endstop_holder_groove_holder_bottom_width
      endstop_holder_groove_holder_top_width: !Ref endstop_holder_groove_holder_top_width
      endstop_holder_groove_holder_height: !Ref endstop_holder_groove_holder_height
      endstop_holder_groove_holder_slit: !Ref endstop_holder_groove_holder_slit

  - name: x_axis_endstop_right_assembly

    resource_file: x_axis_endstop_assembly.yaml
    depends_on:
      - x_axis_lower_profile_assembly
      - x_axis_rail_assembly
      - creality_endstop_holder_assembly
    inject_parts:
      creality_endstop_holder_assembly: creality_endstop_holder_assembly
    parameters:
