context:
  BIG_THING: 500

globals:
  $import: [idex_parameters.yaml]

builder_defaults:
  Production:
    arrange:
      bed_width: 220
      export_step: true
      export_obj: true
      export_stl: true
      export_individual_parts: true

placement:
  alignments:
    - part: cooleon_psu_1
      post_rotation:
        angle: 90
        axis: [1, 0, 0]
        center: cooleon_psu_1.CENTER
    - part: cooleon_psu_2
      post_rotation:
        angle: -90
        axis: [1, 0, 0]
        center: cooleon_psu_2.CENTER
    - part: cooleon_psu_2
      to: cooleon_psu_1
      alignment: CENTER
      axes: [0, 2]
    - part: cooleon_psu_2
      to: cooleon_psu_1
      alignment: STACK_BACK
      stack_gap:
        $ref: cooleon_psu_back_to_back_gap

    - part: x_axis_lower_profile_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_front
      alignment: CENTER
      axes: [0]

    - part: x_axis_rail_assembly
      to: x_axis_lower_profile_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_rail_assembly
      to: x_axis_lower_profile_assembly
      alignment: STACK_TOP
    - rigid_group:
        - x_axis_rail_assembly
      to: x_axis_lower_profile_assembly

    - part: printer_foot_left_front_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: LEFT
    - part: printer_foot_left_front_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_front
      alignment: FRONT
    - part: printer_foot_left_front_assembly
      to: printer_frame_assembly
      alignment: STACK_BOTTOM
      stack_gap:
        $expr:
          "$sub": "-1 * ${printer_foot_groove_filler_thickness}"

    - part: printer_foot_left_back_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: LEFT
    - part: printer_foot_left_back_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_back
      alignment: BACK
    - part: printer_foot_left_back_assembly
      to: printer_frame_assembly
      alignment: STACK_BOTTOM
      stack_gap:
        $expr:
          "$sub": "-1 * ${printer_foot_groove_filler_thickness}"

    - part: printer_foot_right_front_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: RIGHT
    - part: printer_foot_right_front_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_front
      alignment: FRONT
    - part: printer_foot_right_front_assembly
      to: printer_frame_assembly
      alignment: STACK_BOTTOM
      stack_gap:
        $expr:
          "$sub": "-1 * ${printer_foot_groove_filler_thickness}"

    - part: printer_foot_right_back_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: RIGHT
    - part: printer_foot_right_back_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_back
      alignment: BACK
    - part: printer_foot_right_back_assembly
      to: printer_frame_assembly
      alignment: STACK_BOTTOM
      stack_gap:
        $expr:
          "$sub": "-1 * ${printer_foot_groove_filler_thickness}"

    - part: left_z_axis_strut_holder_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: CENTER
    - part: left_z_axis_strut_holder_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: BACK

    - part: left_z_axis_strut_holder_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: STACK_TOP

    - part: right_z_axis_strut_holder_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: CENTER
    - part: right_z_axis_strut_holder_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: BACK
    - part: right_z_axis_strut_holder_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: STACK_TOP

    - part: left_z_axis_back_strut_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: CENTER
      axes: [0]
    - part: left_z_axis_back_strut_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: BACK
      post_translation:
        - 0
        - $expr:
            "$sub": "-1 * ${z_axis_strut_back_offset}"
        - 0

    - part: left_z_axis_back_strut_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: STACK_TOP
      stack_gap:
        $ref: strut_holder_thickness

    - part: right_z_axis_back_strut_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: CENTER
      axes: [0]
    - part: right_z_axis_back_strut_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: BACK
      post_translation:
        - 0
        - $expr:
            "$sub": "-1 * ${z_axis_strut_back_offset}"
        - 0

    - part: right_z_axis_back_strut_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: STACK_TOP
      stack_gap:
        $ref: strut_holder_thickness

    - part: print_bed_assembly.non_production_parts.print_bed_foil
      to: printer_frame_assembly
      alignment: TOP
      post_translation:
        - 0
        - 0
        - $ref: print_bed_vertical_gap_to_frame
    - part: y_axis_assembly
      to: printer_frame_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: y_axis_assembly.non_production_parts.profile_left
      to: printer_frame_assembly
      alignment: CENTER
      axes: [2]
    - part: nozzle_cam_assembly
      post_rotation:
        angle: -90
        axis: [1, 0, 0]
        center: nozzle_cam_assembly.CENTER
    - part: nozzle_cam_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: STACK_BOTTOM
      stack_gap:
        $ref: aukey_nozzle_cam_holder_profile_vertical_gap
    - part: nozzle_cam_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: STACK_LEFT
      stack_gap:
        $ref: aukey_nozzle_cam_holder_profile_gap
    - part: nozzle_cam_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: CENTER
      axes: [1]

    - rigid_group:
        - nozzle_cam_assembly
      to: y_axis_assembly.non_production_parts.profile_right

    - rigid_group:
        - aukey_nozzle_cam_holder_assembly
      to: nozzle_cam_assembly
    - part: y_axis_assembly.non_production_parts.carriages_fused
      to: print_bed_undercarriage_assembly
      alignment: STACK_BOTTOM
    - part: print_bed_assembly
      to: y_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [1]
    - part: print_bed_undercarriage_assembly
      to: y_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [1]

    - part: apa_strip_back_assembly
      to: print_bed_assembly.non_production_parts.print_bed_foil
      alignment: CENTER
      axes: [0]
      post_translation:
        - $ref: vision_light_mount_x_offset
        - 0
        - 0

    - part: apa_strip_back_assembly.followers.apa_led_1
      to: print_bed_assembly.non_production_parts.print_bed_foil
      alignment: STACK_BOTTOM
      stack_gap:
        $ref: vision_light_mount_bed_clearance
    - part: apa_strip_back_assembly
      to: print_bed_undercarriage_assembly.non_production_parts.front_spar_profile_reference
      alignment: STACK_FRONT
      stack_gap:
        $expr:
          "$sub": "${vision_light_mount_plate_border} + ${vision_light_mount_u_spar_clearance_y} + ${vision_light_mount_u_wall_thickness}"

    - part: apa_strip_left_assembly
      post_rotation:
        angle: 90
        axis: [0, 0, 1]
        center: apa_strip_left_assembly.CENTER
    - part: apa_strip_left_assembly
      to: apa_strip_back_assembly
      alignment: CENTER
    - part: apa_strip_left_assembly
      to: apa_strip_back_assembly
      alignment: STACK_FRONT
      stack_gap:
        $expr:
          "$sub": "${vision_light_mount_strip_gap}"

    - part: apa_strip_left_assembly
      to: apa_strip_back_assembly
      alignment: STACK_LEFT
      stack_gap:
        $expr:
          "$sub": "${vision_light_mount_strip_gap}"

    - part: apa_strip_right_assembly
      post_rotation:
        angle: 90
        axis: [0, 0, 1]
        center: apa_strip_right_assembly.CENTER
    - part: apa_strip_right_assembly
      to: apa_strip_back_assembly
      alignment: CENTER
    - part: apa_strip_right_assembly
      to: apa_strip_back_assembly
      alignment: STACK_FRONT
      stack_gap:
        $expr:
          "$sub": "${vision_light_mount_strip_gap}"

    - part: apa_strip_right_assembly
      to: apa_strip_back_assembly
      alignment: STACK_RIGHT
      stack_gap:
        $expr:
          "$sub": "${vision_light_mount_strip_gap}"

    - part: apa_strip_front_assembly
      to: apa_strip_back_assembly
      alignment: CENTER

    - part: apa_strip_front_assembly
      to: apa_strip_left_assembly
      alignment: STACK_FRONT
      stack_gap:
        $expr:
          "$sub": "${vision_light_mount_strip_gap}"

    - part: y_axis_rail_carrier_brackets_assembly.non_production_parts.profile_side_mount_plate_left_front
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: CENTER
      axes: [2]

    - part: y_axis_endstop_holder_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: CENTER
      post_translation:
        - $ref: y_axis_endstop_x_offset
        - 0
        - 0
    - part: y_axis_endstop_holder_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: BOTTOM
    - part: y_axis_endstop_holder_assembly
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: STACK_RIGHT
      stack_gap:
        $ref: y_axis_endstop_z_offset
    - part: y_axis_endstop_holder_assembly.non_production_parts.board
      to: y_axis_assembly.non_production_parts.rail_right
      alignment: STACK_BACK
      stack_gap:
        $ref: y_axis_endstop_rail_gap
    - part: y_axis_endstop_holder_assembly.cutters.mount_eye_hole
      to: y_axis_assembly.non_production_parts.profile_right
      alignment: CENTER
      axes: [2]

    - part: x_axis_endstop_left_assembly
      post_rotation:
        angle: 90
        axis: [0, 0, 1]
        center: x_axis_endstop_left_assembly.CENTER

    - part: x_axis_endstop_left_assembly.non_production_parts.mount_screw
      to: x_axis_lower_profile_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_endstop_left_assembly
      to: x_axis_rail_assembly
      alignment: BOTTOM
      post_translation:
        - 0
        - 0
        - $expr:
            "$sub": "-1 * ${endstop_holder_groove_holder_height}"
    - part: x_axis_endstop_left_assembly.non_production_parts.board
      to: x_axis_rail_assembly
      alignment: STACK_LEFT
      stack_gap:
        $ref: endstop_holder_stack_gap

    - part: x_axis_endstop_right_assembly
      post_rotation:
        angle: -90
        axis: [0, 0, 1]
        center: x_axis_endstop_right_assembly.CENTER
    - part: x_axis_endstop_right_assembly.non_production_parts.mount_screw
      to: x_axis_lower_profile_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_endstop_right_assembly
      to: x_axis_rail_assembly
      alignment: BOTTOM
      post_translation:
        - 0
        - 0
        - $expr:
            "$sub": "-1 * ${endstop_holder_groove_holder_height}"
    - part: x_axis_endstop_right_assembly.non_production_parts.board
      to: x_axis_rail_assembly
      alignment: STACK_RIGHT
      stack_gap:
        $ref: endstop_holder_stack_gap

    - rigid_group:
        - x_axis_endstop_left_assembly
        - x_axis_endstop_right_assembly
      to: x_axis_rail_assembly

    - part: x_axis_motor_mount_bottom_assembly.non_production_parts.profile_to_align
      to: x_axis_lower_profile_assembly
      alignment: CENTER
    - rigid_group:
        - x_axis_motor_mount_bottom_assembly
      to: x_axis_lower_profile_assembly
    - part: x_axis_motor_mount_top_assembly.non_production_parts.profile_to_align
      to: x_axis_top_profile_assembly
      alignment: CENTER
    - rigid_group:
        - x_axis_motor_mount_top_assembly
      to: x_axis_top_profile_assembly

    - part: x_axis_top_profile_assembly
      to: x_axis_lower_profile_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_top_profile_assembly
      to: x_axis_lower_profile_assembly
      alignment: STACK_TOP
      stack_gap:
        $ref: x_axis_profile_stack_gap
    - rigid_group:
        - x_axis_top_profile_assembly
      to: x_axis_lower_profile_assembly

    - part: x_axis_mcu_holder_assembly
      post_rotation:
        angle: -90
        axis: [0, 1, 0]
        center: x_axis_mcu_holder_assembly.CENTER
    - part: x_axis_mcu_holder_assembly
      post_rotation:
        angle: 90
        axis: [1, 0, 0]
        center: x_axis_mcu_holder_assembly.CENTER

    - part: x_axis_mcu_holder_assembly
      post_rotation:
        angle: 90

    - part: x_axis_mcu_holder_assembly
      to: z_axis_top_bridge_profile_assembly
      alignment: CENTER

    - part: x_axis_mcu_holder_assembly
      to: z_axis_top_bridge_profile_assembly
      alignment: STACK_TOP

    - rigid_group:
        - x_axis_mcu_holder_assembly
      to: z_axis_top_bridge_profile_assembly

    - part: x_axis_left_carriage_assembly
      to: x_axis_rail_assembly
      alignment: CENTER
      axes: [0, 1]
      post_translation:
        - $ref: x_axis_left_carriage_x_offset
        - 0
        - $ref: x_axis_carriage_z_offset
    - part: x_axis_right_carriage_assembly
      to: x_axis_rail_assembly
      alignment: CENTER
      axes: [0, 1]
      post_translation:
        - $ref: x_axis_right_carriage_x_offset
        - 0
        - $ref: x_axis_carriage_z_offset
    - rigid_group:
        - x_axis_left_carriage_assembly
        - x_axis_right_carriage_assembly
      to: x_axis_rail_assembly

    - rigid_group:
        - tool_head_mount_machined_bottom_assembly
      to: x_axis_left_carriage_assembly
    - rigid_group:
        - tool_head_mount_machined_top_assembly
      to: x_axis_right_carriage_assembly

    - rigid_group:
        - tool_head_cable_attach_shield_left_assembly
      to: tool_head_mount_machined_bottom_assembly

    - part: left_blower_assembly
      post_rotation:
        angle: -90
        axis: [0, 1, 0]

    - part: left_blower_assembly
      post_rotation:
        angle: -90
        axis: [0, 0, 1]

    - part: right_blower_assembly
      post_rotation:
        angle: 90
        axis: [0, 1, 0]

    - part: right_blower_assembly
      post_rotation:
        angle: -90
        axis: [0, 0, 1]

    - part: left_blower_assembly
      to: tool_head_mount_machined_bottom_assembly
      alignment: CENTER
    - part: left_blower_assembly
      to: tool_head_mount_machined_bottom_assembly
      alignment: STACK_TOP
    - part: left_blower_assembly
      to: tool_head_mount_machined_bottom_assembly
      alignment: FRONT

    - part: right_blower_assembly
      to: tool_head_mount_machined_top_assembly
      alignment: CENTER
    - part: right_blower_assembly
      to: tool_head_mount_machined_top_assembly
      alignment: STACK_TOP
    - part: right_blower_assembly
      to: tool_head_mount_machined_top_assembly
      alignment: FRONT

    - rigid_group:
        - left_blower_assembly
      to: tool_head_mount_machined_bottom_assembly

    - rigid_group:
        - right_blower_assembly
      to: tool_head_mount_machined_top_assembly

    - part: sprite_extruder_left_assembly
      to: tool_head_mount_machined_bottom_assembly
      alignment: CENTER
      post_translation:
        - $ref: x_axis_sprite_extruder_tool_head_mount_x_offset
        - $ref: x_axis_sprite_extruder_tool_head_mount_y_offset
        - $ref: x_axis_sprite_extruder_tool_head_mount_z_offset
    - rigid_group:
        - sprite_extruder_left_assembly
      to: tool_head_mount_machined_bottom_assembly

    - part: sprite_extruder_right_assembly
      to: tool_head_mount_machined_top_assembly
      alignment: CENTER
      post_translation:
        - $ref: x_axis_sprite_extruder_tool_head_mount_x_offset
        - $ref: x_axis_sprite_extruder_tool_head_mount_y_offset
        - $ref: x_axis_sprite_extruder_tool_head_mount_z_offset
    - rigid_group:
        - sprite_extruder_right_assembly
      to: tool_head_mount_machined_top_assembly

    - part: eddy_duo_assembly
      post_rotation:
        angle: 90
        axis: [0, 0, 1]

    - part: eddy_duo_assembly
      to: sprite_extruder_left_assembly.non_production_parts.hotend
      alignment: CENTER

    - part: eddy_duo_assembly
      to: tool_head_mount_machined_bottom_assembly
      alignment: FRONT

    - part: eddy_duo_assembly
      to: tool_head_mount_machined_bottom_assembly
      alignment: STACK_LEFT
      stack_gap:
        $ref: eddy_duo_tool_head_side_gap

    - part: eddy_duo_assembly
      to: sprite_extruder_left_assembly.non_production_parts.hotend
      alignment: BOTTOM
      post_translation:
        - -6
        - 9
        - $ref: eddy_duo_nozzle_clearance
    - rigid_group:
        - eddy_duo_assembly
      to: tool_head_mount_machined_bottom_assembly

    - part: z_axis_profile_left_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: CENTER
      axes: [0, 1]
    - part: z_axis_profile_left_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: STACK_TOP
    - part: z_axis_guide_rod_left_assembly
      to: z_axis_profile_left_assembly
      alignment: CENTER
      axes: [0]
    - part: z_axis_guide_rod_left_assembly
      to: z_axis_profile_left_assembly
      alignment: STACK_FRONT
      stack_gap:
        $ref: z_axis_guide_rod_profile_distance
    - part: z_axis_guide_rod_left_assembly
      to: z_axis_profile_left_assembly
      alignment: BOTTOM
      post_translation:
        - 0
        - 0
        - $ref: z_axis_base_z_offset
    - rigid_group:
        - z_axis_guide_rod_left_assembly
      to: z_axis_profile_left_assembly
    - part: z_axis_profile_right_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: CENTER
      axes: [0, 1]
    - part: z_axis_profile_right_assembly
      to: printer_frame_assembly.non_production_parts.frame_profile_right
      alignment: STACK_TOP
    - part: z_axis_guide_rod_right_assembly
      to: z_axis_profile_right_assembly
      alignment: CENTER
      axes: [0]
    - part: z_axis_guide_rod_right_assembly
      to: z_axis_profile_right_assembly
      alignment: STACK_FRONT
      stack_gap:
        $ref: z_axis_guide_rod_profile_distance
    - part: z_axis_guide_rod_right_assembly
      to: z_axis_profile_right_assembly
      alignment: BOTTOM
      post_translation:
        - 0
        - 0
        - $ref: z_axis_base_z_offset
    - rigid_group:
        - z_axis_guide_rod_right_assembly
      to: z_axis_profile_right_assembly
    - part: z_axis_threaded_rod_left_assembly
      to: z_axis_profile_left_assembly
      alignment: CENTER
      axes: [0]
      post_translation:
        - $ref: z_axis_threaded_rod_profile_center_in_offset
        - 0
        - 0
    - part: z_axis_threaded_rod_left_assembly
      to: z_axis_profile_left_assembly
      alignment: STACK_FRONT
      stack_gap:
        $ref: z_axis_threaded_rod_profile_distance
    - part: z_axis_threaded_rod_left_assembly.non_production_parts.motor_body_reference
      to: z_axis_profile_left_assembly
      alignment: BOTTOM
    - rigid_group:
        - z_axis_threaded_rod_left_assembly
      to: z_axis_profile_left_assembly
    - part: z_axis_threaded_rod_right_assembly
      to: z_axis_profile_right_assembly
      alignment: CENTER
      axes: [0]
      post_translation:
        - $ref: z_axis_threaded_rod_profile_center_in_offset_negative
        - 0
        - 0
    - part: z_axis_threaded_rod_right_assembly
      to: z_axis_profile_right_assembly
      alignment: STACK_FRONT
      stack_gap:
        $ref: z_axis_threaded_rod_profile_distance
    - part: z_axis_threaded_rod_right_assembly.non_production_parts.motor_body_reference
      to: z_axis_profile_right_assembly
      alignment: BOTTOM
    - rigid_group:
        - z_axis_threaded_rod_right_assembly
      to: z_axis_profile_right_assembly

    - part: nitehawk_usb_dual_board_housing_assembly.non_production_parts.profile_mount_reference
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: CENTER

    - part: nitehawk_usb_dual_board_housing_assembly.non_production_parts.profile_mount_reference
      to: printer_frame_assembly.non_production_parts.frame_profile_left
      alignment: STACK_LEFT

    - part: z_axis_top_bridge_profile_assembly
      to: z_axis_profile_left_assembly
      alignment: STACK_BACK
      stack_gap:
        $ref: z_axis_top_bridge_profile_back_offset
    - part: z_axis_top_bridge_profile_assembly
      to: z_axis_profile_left_assembly
      alignment: TOP
      post_translation:
        - 0
        - 0
        - -20.0

    - part: z_axis_top_profile_gusset_left_assembly.non_production_parts.z_profile_to_align
      to: z_axis_profile_left_assembly
      alignment: CENTER
      axes: [0]
    - part: z_axis_top_profile_gusset_left_assembly.non_production_parts.z_profile_to_align
      to: z_axis_profile_left_assembly
      alignment: BACK
    - part: z_axis_top_profile_gusset_left_assembly.non_production_parts.z_profile_to_align
      to: z_axis_profile_left_assembly
      alignment: TOP
    - part: z_axis_top_profile_gusset_left_assembly.non_production_parts.top_profile_to_align
      to: z_axis_top_bridge_profile_assembly
      alignment: CENTER
      axes: [1, 2]

    - part: z_axis_top_profile_gusset_right_assembly.non_production_parts.z_profile_to_align
      to: z_axis_profile_right_assembly
      alignment: CENTER
      axes: [0]
    - part: z_axis_top_profile_gusset_right_assembly.non_production_parts.z_profile_to_align
      to: z_axis_profile_right_assembly
      alignment: BACK
    - part: z_axis_top_profile_gusset_right_assembly.non_production_parts.z_profile_to_align
      to: z_axis_profile_right_assembly
      alignment: TOP
    - part: z_axis_top_profile_gusset_right_assembly.non_production_parts.top_profile_to_align
      to: z_axis_top_bridge_profile_assembly
      alignment: CENTER
      axes: [1, 2]

    - part: x_axis_assembly
      to: printer_frame_assembly
      alignment: CENTER
      axes: [0]
    - part: x_axis_lower_profile_assembly
