globals:
  BIG_THING: 500

  print_bed_y_travel: 325
  y_axis_carriage_spacing: 100
  mgn_12ca_carriage_length: 34.7

  y_axis_rail_length:
    $expr:
      "$sub": "${print_bed_y_travel} + ${y_axis_carriage_spacing} + ${mgn_12ca_carriage_length}"

  frame_inner_depth: !Ref y_axis_rail_length
  frame_inner_width: 380

  printer_foot_height: 37
  printer_foot_base_size: 40
  printer_foot_top_size: 35
  printer_foot_screw_length: 30
  printer_foot_screw_cylinder_head_clearance: 1.5
  printer_foot_mount_screw_size: "M5"
  printer_foot_mount_screw_sink: 8
  printer_foot_groove_filler_width: 7.4
  printer_foot_groove_filler_thickness: 3
  tpu_slit_thickness: 0.15
  tpu_slit_clearance: 0.5
  tpu_slit_distance: 1
  tpu_num_slits: 3


assemblies:

  - name: printer_frame_assembly

    depends_on: []
    parameters:
      frame_inner_depth:
        $ref: frame_inner_depth
      frame_inner_width:
        $ref: frame_inner_width
      frame_profile_type: "4040"

  - name: printer_feet_assembly

    depends_on:
      - printer_frame_assembly
    inject_parts:
      frame:
        assembly: printer_frame_assembly
        artifact: leader
    parameters:
      printer_foot_height:
        $ref: printer_foot_height
      printer_foot_base_size:
        $ref: printer_foot_base_size
      printer_foot_top_size:
        $ref: printer_foot_top_size
      printer_foot_screw_length:
        $ref: printer_foot_screw_length
      printer_foot_screw_cylinder_head_clearance:
        $ref: printer_foot_screw_cylinder_head_clearance
      printer_foot_mount_screw_size:
        $ref: printer_foot_mount_screw_size
      printer_foot_mount_screw_sink:
        $ref: printer_foot_mount_screw_sink
      printer_foot_groove_filler_width:
        $ref: printer_foot_groove_filler_width
      printer_foot_groove_filler_thickness:
        $ref: printer_foot_groove_filler_thickness
      tpu_slit_thickness:
        $ref: tpu_slit_thickness
      tpu_slit_clearance:
        $ref: tpu_slit_clearance
      tpu_slit_distance:
        $ref: tpu_slit_distance
      tpu_num_slits:
        $ref: tpu_num_slits
