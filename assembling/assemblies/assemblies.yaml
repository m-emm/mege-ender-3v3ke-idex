builder_defaults:
  Production:
    arrange:
      bed_width: 220
      export_step: true
      export_obj: true
      export_stl: true
      export_individual_parts: true

placement:
  alignments:
    - part: y_axis_assembly
      to: printer_frame_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: y_axis_assembly.non_production_parts.profile_left
      to: printer_frame_assembly
      alignment: CENTER
      axes: [2]
    - part: y_axis_rail_carrier_brackets_assembly.non_production_parts.profile_side_mount_plate_left_front
      to: y_axis_assembly.non_production_parts.profile_left
      alignment: CENTER
      axes: [2]
    - part: y_axis_assembly.non_production_parts.carriages_fused
      to: print_bed_undercarriage_assembly
      alignment: STACK_BOTTOM
    - part: print_bed_assembly
      to: y_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [1]
    - part: print_bed_undercarriage_assembly
      to: y_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [1]
    - part: z_axis_assembly
      to: printer_frame_assembly
      alignment: CENTER
      axes: [0]
    - part: z_axis_assembly.non_production_parts.left_profile
      to: printer_frame_assembly
      alignment: BOTTOM
    - part: x_axis_assembly
      to: z_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [0, 1]
    - part: x_axis_assembly.non_production_parts.lower_axis_profile
      to: z_axis_assembly.non_production_parts.carriages_fused
      alignment: FRONT
    - part: x_axis_assembly.non_production_parts.lower_axis_profile
      to: z_axis_assembly.non_production_parts.x_axis_alignment_reference
      alignment: BOTTOM
    - part: tool_head_mount_bottom_assembly.followers.carriage
      to: x_axis_assembly.non_production_parts.carriage_1
      alignment: CENTER

    - part: tool_head_mount_top_assembly.followers.carriage
      to: x_axis_assembly.non_production_parts.carriage_2
      alignment: CENTER
    
    


assemblies:

  - name: printer_frame_assembly

    depends_on: []
    parameters:
      frame_inner_depth:
        $ref: frame_inner_depth
      frame_inner_width:
        $ref: frame_inner_width
      frame_profile_type: "4040"

  - name: printer_feet_assembly

    depends_on:
      - printer_frame_assembly
    inject_parts:
      frame:
        assembly: printer_frame_assembly
        artifact: leader
    parameters:
      printer_foot_height:
        $ref: printer_foot_height
      printer_foot_base_size:
        $ref: printer_foot_base_size
      printer_foot_top_size:
        $ref: printer_foot_top_size
      printer_foot_screw_length:
        $ref: printer_foot_screw_length
      printer_foot_screw_cylinder_head_clearance:
        $ref: printer_foot_screw_cylinder_head_clearance
      printer_foot_mount_screw_size:
        $ref: printer_foot_mount_screw_size
      printer_foot_mount_screw_sink:
        $ref: printer_foot_mount_screw_sink
      printer_foot_groove_filler_width:
        $ref: printer_foot_groove_filler_width
      printer_foot_groove_filler_thickness:
        $ref: printer_foot_groove_filler_thickness
      tpu_slit_thickness:
        $ref: tpu_slit_thickness
      tpu_slit_clearance:
        $ref: tpu_slit_clearance
      tpu_slit_distance:
        $ref: tpu_slit_distance
      tpu_num_slits:
        $ref: tpu_num_slits

  - name: print_bed_assembly

    depends_on:
      - printer_frame_assembly
    inject_parts:
      frame:
        assembly: printer_frame_assembly
        artifact: leader
    parameters:
      print_bed_width:
        $ref: print_bed_width
      print_bed_depth:
        $ref: print_bed_depth
      print_bed_thickness:
        $ref: print_bed_thickness
      print_bed_mount_hole_diameter:
        $ref: print_bed_mount_hole_diameter
      print_bed_mount_screw_size:
        $ref: print_bed_mount_screw_size
      print_bed_mount_screw_length:
        $ref: print_bed_mount_screw_length
      print_bed_mount_hole_pitch:
        $ref: print_bed_mount_hole_pitch
      print_bed_foil_thickness:
        $ref: print_bed_foil_thickness
      print_bed_damper_height:
        $ref: print_bed_damper_height
      print_bed_damper_diameter:
        $ref: print_bed_damper_diameter
      print_bed_vertical_gap_to_frame:
        $ref: print_bed_vertical_gap_to_frame

  - name: print_bed_undercarriage_assembly

    depends_on:
      - print_bed_assembly
    inject_parts:
      print_bed:
        assembly: print_bed_assembly
        artifact: leader
      damper_left_front:
        assembly: print_bed_assembly
        artifact: non_production_parts.damper_left_front
      damper_left_back:
        assembly: print_bed_assembly
        artifact: non_production_parts.damper_left_back
      damper_right_front:
        assembly: print_bed_assembly
        artifact: non_production_parts.damper_right_front
      damper_right_back:
        assembly: print_bed_assembly
        artifact: non_production_parts.damper_right_back
    parameters:
      print_bed_mount_hole_pitch:
        $ref: print_bed_mount_hole_pitch
      y_axis_rail_spacing:
        $ref: y_axis_rail_spacing
      y_axis_carriage_spacing:
        $ref: y_axis_carriage_spacing
      print_bed_undercarriage_profiles_height:
        $ref: print_bed_undercarriage_profiles_height
      print_bed_undercarriage_profiles_width:
        $ref: print_bed_undercarriage_profiles_width
      print_bed_undercarriage_profiles_wall:
        $ref: print_bed_undercarriage_profiles_wall
      print_bed_undercarriage_central_annulus_diameter:
        $ref: print_bed_undercarriage_central_annulus_diameter
