ShellforgepyBuilderVersion: "2026-03-27"

Description: 250 V mains switchbox with fuse holder and internal SSR

Builder:
  Visualization:
    preview:
      enabled: true
      views:
        - isometric
        - front
        - right
        - top
      width: 512
      height: 512
    parts:
      - source: self
        artifact: leader
        name: hv_switchbox_box
        color: [1, 1, 1]
      - source: self
        artifact: followers
        names:
          - hv_switchbox_lid
        name_template: "{name}"
        color: [1, 1, 1]
      - source: self
        artifact: followers
        names:
          - hv_switchbox_cable_cutout_cover
        name_template: "{name}"
        color: [0.78, 0.86, 0.82]
      - source: self
        artifact: non_production_parts
        names:
          - ssr_body
          - ssr_output_terminal_cover
          - ssr_input_terminal_cover
          - ssr_output_terminal_screws
          - ssr_input_terminal_screws
        name_template: "{name}"
        color: [0.55, 0.58, 0.62]
      - source: self
        artifact: non_production_parts
        names:
          - fuse_holder_holder_body
        name_template: "{name}"
        color: [0.35, 0.45, 0.55]
      - source: self
        artifact: non_production_parts
        names:
          - fuse_holder_mount_nut
          - lid_mount_screw_*_screw
          - lid_mount_screw_*_nut
          - hv_switchbox_terminal_screws
          - hv_switchbox_terminal_nuts
          - ssr_mount_screws
          - ssr_mount_nuts
          - cable_cutout_cover_mount_screws
          - cable_cutout_cover_mount_nuts
        name_template: "{name}"
        color: [0.78, 0.78, 0.72]
      - source: self
        artifact: non_production_parts
        names:
          - fuse_holder_terminal_blades
        name_template: "{name}"
        color: [0.9, 0.86, 0.72]
      - source: self
        artifact: non_production_parts
        names:
          - hv_switchbox_terminal_rail
          - ssr_mount_bosses
        name_template: "{name}"
        color: [0.9, 0.9, 0.88]

  Production:
    process_data_preset: petgcf_max_strength_high_speed_06
    parts:
      - source: self
        artifact: leader
        name: hv_switchbox_box
        prod_rotation_angle: 90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - hv_switchbox_lid
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [0, 1, 0]
      - source: self
        artifact: followers
        names:
          - hv_switchbox_cable_cutout_cover
        name_template: "{name}"
        prod_rotation_angle: -90
        prod_rotation_axis: [1, 0, 0]
    arrange:
      export_individual_parts: false
      plates:
        - name: hv_switchbox_box
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                brim_type: no_brim
                enable_support: "1"
                support_type: tree(auto)
                support_style: organic
                support_on_build_plate_only: "1"
                support_interface_spacing: "2"
                wall_loops: "3"
          parts:
            - hv_switchbox_box
        - name: hv_switchbox_lid
          process_data_preset: petgcf_max_strength_high_speed_06
          process_data:
            overrides:
              process_overrides:
                brim_type: no_brim
                enable_support: "1"
                support_type: tree(auto)
                support_style: organic
                support_on_build_plate_only: "1"
                support_interface_spacing: "2"
                wall_loops: "3"
          parts:
            - hv_switchbox_lid
        - name: hv_switchbox_cable_cutout_cover
          process_data_preset: tpu_minimal_quality_minimal_strength_06
          parts:
            - hv_switchbox_cable_cutout_cover
      auto_assign_plates: false

