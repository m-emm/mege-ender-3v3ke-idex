ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the y-axis rail carrier brackets

Builder:
  Visualization:
    parts:
      - source: dependencies
        assembly: printer_frame_assembly
        artifact: leader
        name: printer_frame
      - source: dependencies
        assembly: y_axis_assembly
        artifact: leader
        name: y_axis
      - source: dependencies
        assembly: y_axis_assembly
        artifact: followers
        name_template: "{name}"
      - source: dependencies
        assembly: y_axis_assembly
        artifact: non_production_parts
        exclude_names:
          - carriages_fused
        name_template: "{name}"
      - source: self
        artifact: followers
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        exclude_names:
          - profile_side_mount_plate_left_front
          - profile_side_mount_plate_left_back
          - profile_side_mount_plate_right_front
          - profile_side_mount_plate_right_back
        name_template: "{name}"
  Production:
    process_data:
      source: mege_3devops.process_data.mender3.process_data_06_high_speed.PROCESS_DATA_PETGCF_06_HS
      overrides:
        process_overrides:
          brim_type: no_brim
          enable_support: "1"
          sparse_infill_density: "30%"
          support_interface_spacing: "0.8"
          support_object_first_layer_gap: 2.5
          support_object_xy_distance: "3.0"
          support_on_build_plate_only: "1"
          support_threshold_angle: "30"
          support_top_z_distance: "0.3"
          wall_loops: "3"
          top_shell_layers: "4"
          bottom_shell_layers: "4"
    arrange:
      plates:
        - name: single_test_bracket
          parts:
            - rail_carrier_bracket_left_front
      auto_assign_plates: true
    parts:
      - source: self
        artifact: followers
        name_template: "{name}"
        flip: true

Parameters:
  y_axis_rail_carrier_bracket_outer_diameter:
    Type: Float
  y_axis_rail_carrier_bracket_height:
    Type: Float
  y_axis_rail_carrier_bracket_profile_width:
    Type: Float
  y_axis_rail_carrier_bracket_profile_wall:
    Type: Float
  y_axis_rail_carrier_bracket_mount_plate_thickness:
    Type: Float
  y_axis_rail_carrier_bracket_mount_plate_length:
    Type: Float
  y_axis_rail_carrier_bracket_mount_plate_fillet_radius:
    Type: Float
  y_axis_rail_carrier_bracket_mount_screw_length:
    Type: Float
  y_axis_rail_carrier_bracket_mount_screw_size:
    Type: String
  y_axis_rail_carrier_bracket_mount_screw_inset:
    Type: Float

Parts:
  YAxisRailCarrierBracketsAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.y_axis_rail_carrier_brackets_assembly.create_y_axis_rail_carrier_brackets_assembly
      Properties:
        y_axis_rail_carrier_bracket_outer_diameter:
          $ref: y_axis_rail_carrier_bracket_outer_diameter
        y_axis_rail_carrier_bracket_height:
          $ref: y_axis_rail_carrier_bracket_height
        y_axis_rail_carrier_bracket_profile_width:
          $ref: y_axis_rail_carrier_bracket_profile_width
        y_axis_rail_carrier_bracket_profile_wall:
          $ref: y_axis_rail_carrier_bracket_profile_wall
        y_axis_rail_carrier_bracket_mount_plate_thickness:
          $ref: y_axis_rail_carrier_bracket_mount_plate_thickness
        y_axis_rail_carrier_bracket_mount_plate_length:
          $ref: y_axis_rail_carrier_bracket_mount_plate_length
        y_axis_rail_carrier_bracket_mount_plate_fillet_radius:
          $ref: y_axis_rail_carrier_bracket_mount_plate_fillet_radius
        y_axis_rail_carrier_bracket_mount_screw_length:
          $ref: y_axis_rail_carrier_bracket_mount_screw_length
        y_axis_rail_carrier_bracket_mount_screw_size:
          $ref: y_axis_rail_carrier_bracket_mount_screw_size
        y_axis_rail_carrier_bracket_mount_screw_inset:
          $ref: y_axis_rail_carrier_bracket_mount_screw_inset
