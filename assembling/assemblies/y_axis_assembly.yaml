ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the y-axis

placement:
  alignments:
    - part: y_axis_assembly
      to: printer_frame_assembly
      alignment: CENTER
      axes: [0, 1]
    - part: y_axis_assembly.non_production_parts.profile_left
      to: printer_frame_assembly
      alignment: CENTER
      axes: [2]
    - part: y_axis_assembly.non_production_parts.carriages_fused
      to: print_bed_undercarriage_assembly
      alignment: STACK_BOTTOM
    - part: print_bed_assembly
      to: y_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [1]
    - part: print_bed_undercarriage_assembly
      to: y_axis_assembly.non_production_parts.carriages_fused
      alignment: CENTER
      axes: [1]

Builder:
  Visualization:
    parts:
      - source: dependencies
        assembly: printer_frame_assembly
        artifact: leader
        name: printer_frame
      - source: dependencies
        assembly: print_bed_assembly
        artifact: leader
        name: print_bed
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: dependencies
        assembly: print_bed_assembly
        artifact: non_production_parts
        name_template: "print_bed_{name}"
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: dependencies
        assembly: print_bed_undercarriage_assembly
        artifact: followers
        name_template: "print_bed_undercarriage_{name}"
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: dependencies
        assembly: print_bed_undercarriage_assembly
        artifact: non_production_parts
        name_template: "print_bed_undercarriage_{name}"
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: dependencies
        assembly: y_axis_drive_assembly
        artifact: leader
        name: y_axis_drive
      - source: dependencies
        assembly: y_axis_drive_assembly
        artifact: followers
        name_template: "y_axis_drive_{name}"
      - source: dependencies
        assembly: y_axis_drive_assembly
        artifact: non_production_parts
        name_template: "y_axis_drive_{name}"
      - source: self
        artifact: leader
        name: y_axis
      - source: self
        artifact: followers
        name_template: "{name}"
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
        exclude_names:
          - carriages_fused

Parameters:
  y_axis_rail_spacing:
    Type: Float
  y_axis_rail_length:
    Type: Float
  y_axis_profile_length:
    Type: Float
  y_axis_carriage_spacing:
    Type: Float
  mgn_12ca_carriage_length:
    Type: Float
  y_axis_rail_carrier_bracket_outer_diameter:
    Type: Float
  y_axis_rail_carrier_bracket_height:
    Type: Float
  y_axis_rail_carrier_bracket_profile_width:
    Type: Float
  y_axis_rail_carrier_bracket_profile_wall:
    Type: Float
  y_axis_rail_carrier_bracket_mount_plate_thickness:
    Type: Float
  y_axis_rail_carrier_bracket_mount_plate_length:
    Type: Float
  y_axis_rail_carrier_bracket_mount_plate_fillet_radius:
    Type: Float

Parts:
  YAxisAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.y_axis_assembly.create_y_axis_assembly
      Properties:
        y_axis_rail_spacing:
          $ref: y_axis_rail_spacing
        y_axis_rail_length:
          $ref: y_axis_rail_length
        y_axis_profile_length:
          $ref: y_axis_profile_length
        y_axis_carriage_spacing:
          $ref: y_axis_carriage_spacing
        mgn_12ca_carriage_length:
          $ref: mgn_12ca_carriage_length
        y_axis_rail_carrier_bracket_outer_diameter:
          $ref: y_axis_rail_carrier_bracket_outer_diameter
        y_axis_rail_carrier_bracket_height:
          $ref: y_axis_rail_carrier_bracket_height
        y_axis_rail_carrier_bracket_profile_width:
          $ref: y_axis_rail_carrier_bracket_profile_width
        y_axis_rail_carrier_bracket_profile_wall:
          $ref: y_axis_rail_carrier_bracket_profile_wall
        y_axis_rail_carrier_bracket_mount_plate_thickness:
          $ref: y_axis_rail_carrier_bracket_mount_plate_thickness
        y_axis_rail_carrier_bracket_mount_plate_length:
          $ref: y_axis_rail_carrier_bracket_mount_plate_length
        y_axis_rail_carrier_bracket_mount_plate_fillet_radius:
          $ref: y_axis_rail_carrier_bracket_mount_plate_fillet_radius
        record_metrics: false
