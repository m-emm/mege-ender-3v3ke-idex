ShellforgepyBuilderVersion: "2026-03-27"

Description: Assembly configuration for the y-axis

Builder:
  Visualization:
    parts:
      - source: dependencies
        assembly: printer_frame_assembly
        artifact: leader
        name: printer_frame
      - source: dependencies
        assembly: print_bed_assembly
        artifact: leader
        name: print_bed
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: dependencies
        assembly: print_bed_assembly
        artifact: non_production_parts
        name_template: "print_bed_{name}"
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: dependencies
        assembly: print_bed_undercarriage_assembly
        artifact: followers
        name_template: "print_bed_undercarriage_{name}"
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: dependencies
        assembly: print_bed_undercarriage_assembly
        artifact: non_production_parts
        name_template: "print_bed_undercarriage_{name}"
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: dependencies
        assembly: y_axis_drive_assembly
        artifact: leader
        name: y_axis_drive
      - source: dependencies
        assembly: y_axis_drive_assembly
        artifact: followers
        name_template: "y_axis_drive_{name}"
      - source: dependencies
        assembly: y_axis_drive_assembly
        artifact: non_production_parts
        name_template: "y_axis_drive_{name}"
      - source: dependencies
        assembly: y_axis_endstop_holder_assembly
        artifact: leader
        name: y_axis_endstop_holder
      - source: dependencies
        assembly: y_axis_endstop_holder_assembly
        artifact: non_production_parts
        name_template: "y_axis_endstop_{name}"
      - source: self
        artifact: leader
        name: y_axis
      - source: self
        artifact: followers
        names:
          - carriage_front_carriage_left
          - carriage_back_carriage_left
          - carriage_front_carriage_right
          - carriage_back_carriage_right
        name_template: "{name}"
        animation:
          bed_y:
            - 0
            - { $ref: print_bed_y_travel }
            - 0
      - source: self
        artifact: followers
        exclude_names:
          - carriage_front_carriage_left
          - carriage_back_carriage_left
          - carriage_front_carriage_right
          - carriage_back_carriage_right
        name_template: "{name}"
      - source: self
        artifact: non_production_parts
        name_template: "{name}"
        exclude_names:
          - carriages_fused
  Production:
    parts:
      - source: self
        artifact: followers
        names:
          - carriage_stopper_left_front
          - carriage_stopper_left_back
          - carriage_stopper_right_front
          - carriage_stopper_right_back
        name_template: "{name}"
        flip: true
      - source: dependencies
        assembly: y_axis_endstop_holder_assembly
        artifact: leader
        name: y_axis_endstop_holder
        flip: true

Parameters:
  y_axis_rail_spacing:
    Type: Float
  y_axis_rail_length:
    Type: Float
  y_axis_profile_length:
    Type: Float
  y_axis_carriage_spacing:
    Type: Float
  mgn_12ca_carriage_length:
    Type: Float
  y_axis_carriage_stopper_length:
    Type: Float
  y_axis_carriage_stopper_thickness:
    Type: Float
  y_axis_carriage_stopper_fillet_radius:
    Type: Float
  y_axis_carriage_stopper_mount_screw_size:
    Type: String
  y_axis_carriage_stopper_mount_screw_length:
    Type: Float

Parts:
  YAxisAssembly:
    Type: Shellforgepy::Assembly

    Properties:
      Generator: mege_ender_3v3ke_idex.designs.assemblies.y_axis_assembly.create_y_axis_assembly
      Properties:
        y_axis_rail_spacing:
          $ref: y_axis_rail_spacing
        y_axis_rail_length:
          $ref: y_axis_rail_length
        y_axis_profile_length:
          $ref: y_axis_profile_length
        y_axis_carriage_spacing:
          $ref: y_axis_carriage_spacing
        mgn_12ca_carriage_length:
          $ref: mgn_12ca_carriage_length
        y_axis_carriage_stopper_length:
          $ref: y_axis_carriage_stopper_length
        y_axis_carriage_stopper_thickness:
          $ref: y_axis_carriage_stopper_thickness
        y_axis_carriage_stopper_fillet_radius:
          $ref: y_axis_carriage_stopper_fillet_radius
        y_axis_carriage_stopper_mount_screw_size:
          $ref: y_axis_carriage_stopper_mount_screw_size
        y_axis_carriage_stopper_mount_screw_length:
          $ref: y_axis_carriage_stopper_mount_screw_length
        record_metrics: true
