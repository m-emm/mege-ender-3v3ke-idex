ShellforgepyBuilderVersion: "2026-03-27"

Description: Joiner for Tap-related hardware and the fan-joined extruder cage

Builder:
  Outputs:
    extruder_cage:
      Visualization:
        preview:
          enabled: true
          views:
            - top
            - left
            - front
            - isometric
          width: 512
          height: 512
        parts:
          - source: self
            artifact: leader
            name: extruder_cage_joined
          - source: self
            artifact: non_production_parts
            name_template: "extruder_cage_{name}"
          - source: output
            assembly: idex_tap
            artifact: all
            name_template: "idex_tap_{name}"
      Production:
        process_data_preset: petgcf_max_strength_high_speed_06
        parts:
          - source: self
            artifact: leader
            name: extruder_cage_joined
            prod_rotation_angle: 180
            prod_rotation_axis: [0, 1, 0]
        arrange:
          export_individual_parts: false
          plates:
            - name: extruder_cage_joined
              filename: extruder_cage_joined
              process_data_preset: petgcf_max_strength_high_speed_06
              process_data:
                overrides:
                  process_overrides:
                    enable_support: "1"
                    support_threshold_angle: "25"
              parts:
                - extruder_cage_joined
          auto_assign_plates: false

    idex_tap:
      Visualization:
        preview:
          enabled: true
          views:
            - isometric
            - front
            - back
            - top
            - left
            - right
          width: 700
          height: 700
        parts:
          - source: self
            artifact: all
            name_template: "idex_tap_{name}"
          - source: output
            assembly: extruder_cage
            artifact: leader
            name: extruder_cage_joined
          - source: output
            assembly: extruder_cage
            artifact: non_production_parts
            name_template: "extruder_cage_{name}"

Parts:
  TapExtruderCageJoiner:
    Type: Shellforgepy::AssemblyJoiner

    Properties:
      Joiner: mege_ender_3v3ke_idex.designs.assemblies.tap_extruder_cage_joiner.join_tap_with_extruder_cage
